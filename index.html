rify the chain", "Vendor controls: \"SCAR\" — SLAs, Contracts, Audits, Right-to-audit", "Trust but verify: \"TPM TRusts the Platform Module\"", "Termination: \"Disable, Dismiss, Debrief, Destroy-access\"", "Mandatory Vacation = \"Must Vacate\" so someone else detects fraud", "ATE: Awareness (All), Training (Technical/role-specific), Education (Expert-level)", "CPTT: \"Copy Pat Trades Tokens\" — Copyright, Patent, Trademark, Trade Secret", "Copyright is automatic like a \"Copy\" — it just happens", "Trade Secret dies when told — \"Tell the Trade, Trash the Secret\"", "GDPR rights: \"ARERDO\" — Access, Rectification, Erasure, Restrict, Data portability, Object", "HIPAA rules: \"PSB\" — Privacy, Security, Breach notification", "FIPS 199 impact: \"LMH\" — Low (limited), Moderate (serious), High (severe/catastrophic)", "Control categories: \"TAP\" — Technical, Administrative, Physical", "Control functions: \"PD-CDCRD\" — Preventive, Detective, Corrective, Deterrent, Compensating, Recovery, Directive", "SOC Types: \"Type I = snapshot In time, Type II = Two periods tested\"", "PCI-DSS: \"12 requirements for Plastic Card Industry\"", "NIST 800-53: \"800 controls, 53 ways to secure\" (exaggeration but memorable)", "ISO 27001: \"27001 = requirements you MUST meet\"", "Export controls: \"EAR hears commercial, ITAR = miliTARy\"", "GDPR transfers: \"SBA\" — SCCs, BCRs, Adequacy decisions", "Evidence types: \"RDTD\" — Real, Documentary, Testimonial, Demonstrative", "Burden of proof: \"Criminal Beyond, Civil Preponderance\" — Criminal is harder to prove", "ECPA three titles: \"Wire, Store, Pen\" — Wiretap Act, Stored Communications Act, Pen Register Act", "CFAA: \"Computer Fraud Against Access\"", "Canon priority: \"S-H-S-P\" — Society, Honor, Service, Profession", "Ethics hierarchy: \"Public over Private, Society over Self\"", "Change process: \"RRAISTD\" — Request, Review, Approve, Implement, Schedule, Test, Document", "Config management: \"BIC\" — Baseline, Inventory, CMDB", "Quantitative methods: \"MDSB\" — Monte Carlo, Decision trees, Sensitivity, Bayesian", "FAIR factors: \"LEF x LM\" — Loss Event Frequency x Loss Magnitude", "Proof standards: \"BPS\" highest to lowest — Beyond reasonable doubt, Preponderance, Substantial evidence", "Negligence elements: \"DBCD\" — Duty, Breach, Causation, Damage", "Delphi = \"Delivered Privately, Experts Lend Perspectives, Hidden Identity\"", "Qualitative tools: \"DBIRS\" — Delphi, Brainstorming, Interviews, Risk matrices, Scenarios", "BIA process: \"IDDCI\" — Identify functions, Determine dependencies, Calculate impacts, Identify priorities, Identify resources", "MTD > RTO + WRT: \"Maximum Tolerable = Recovery Time + Work Recovery Time\"", "Site spectrum: \"Mirror > Hot > Warm > Cold\" by speed and cost", "Reciprocal: \"Risky Reciprocal — Relies on Relationships\"", "TPRM lifecycle: \"DCME\" — Due diligence, Contract, Monitor, Exit", "Contractual essentials: \"SRDIL\" — SLAs, Right-to-audit, Data handling, Incident notification, Liability", "OECD principles: \"CDPUSOIA\" — Collection, Data quality, Purpose, Use, Security, Openness, Individual, Accountability", "PbD: \"Proactive, Default, Design, Functionality, Security, Transparency, Respect\"", "Governance hierarchy: \"BCCS\" — Board (oversight), CEO (accountability), CISO (strategy), Staff (operations)", "CISO reports: \"Never to CIO\" — independence prevents conflict of interest", "Hierarchy: \"Please Stop Bashing Good People\" — Policy, Standards, Baselines, Guidelines, Procedures", "Only Guidelines are Optional: \"Good suggestions, Optional compliance\"", "Intelligence levels: \"STOT\" — Strategic, Tactical, Operational, Technical", "Intelligence cycle: \"DCPAD-F\" — Direction, Collection, Processing, Analysis, Dissemination, Feedback", "STIX and TAXII: \"STIX Structures, TAXII Transports\"", "Test types by disruption: \"Can Team Simulations Produce Full results?\" — Checklist, Tabletop, Simulation, Parallel, Full interruption", "Parallel = \"Production Plus recovery running together\"", "Risk ATC: \"Appetite (want), Tolerance (variation), Capacity (maximum)\"", "Like eating: Appetite = how much you want to eat, Capacity = how much your stomach can hold", "Planning horizons: \"STO\" — Strategic (years), Tactical (months), Operational (days)", "Like military: Strategy wins wars, Tactics wins battles, Operations execute missions", "GDPR breach: \"72 hours to the Authority\"", "HIPAA breach: \"60 days, 500+ = media notification\"", "HIPAA safe harbor: \"Encrypted = Exempt\"", "Layers outside-in: \"PPNNHAD\" — Policies, Physical, Perimeter, Network, Host, Application, Data", "Fail-secure: \"Fail SAFE = deny\" (counterintuitive but accurate)", "Authorization package: \"SSP-SAR-POA&M\" — Plan, Assessment, Action items", "AO outcomes: \"AID\" — ATO (yes), IATO (temporary), Denial (no)", "Negligence: \"DBCH\" — Duty, Breach, Causation, Harm (all four required)", "PCI-DSS: \"Plastic Card Industry rules, not law\" — contractual obligation", "CMM levels: \"I Really Don't Mind Ordering\" — Initial, Repeatable, Defined, Managed, Optimizing", "NIST CSF: \"I Prefer Doughnuts, Really, Completely\" — Identify, Protect, Detect, Respond, Recover", "MAAT: \"Mitigate, Accept, Avoid, Transfer\" — four options for every risk", "Risk math: \"Total - Controls = Residual\"", "GPL = \"Give People Liberty\" (but they must share too)", "MIT = \"Minimal Imposed Terms\" (very permissive)", "Piracy types: \"COSHI\" — Counterfeiting, OEM, Softlifting, Hard-disk, Internet", "Proof standards lowest to highest: \"Substantial, Preponderance, Beyond\" — SPB", "Investigation response: \"Preserve, Report, Document, Cooperate\" — PRDC", "SoD = \"Stops One from Doing it all\" (Preventive)", "Need-to-Know: \"Clearance gets you in the building, Need-to-Know gets you in the room\"", "Detective controls: \"JoMa\" — Job rotation and Mandatory vacation both detect fraud", "NIST CSF functions: \"IPDRR-G\" — Identify, Protect, Detect, Respond, Recover (+ Govern in 2.0)", "Framework hierarchy: \"CSF=strategy, 800-53=controls, CIS=priorities, ISO=certification\"", "Ethics canons: \"SHSP\" — Society, Honorable, Service, Profession (in priority order)", "When canons conflict: \"Society Always Wins\" — Canon 1 overrides all others", "Vendor assessment: \"QCOPI\" — Questionnaire, Certification (ISO), On-site, Pen test, Independence (SOC)", "Contract requirements: \"RASILD\" — Right-to-audit, Assessment requirements, SLAs, Incident notification, Liability, Data handling", "BIA metrics: \"MRR-W\" — MTD (max tolerable), RTO (recovery time), RPO (recovery point), WRT (work recovery)", "Impact priority: \"Safety First, Then Financial, Then Reputation\" — human life always wins", "STRIDE: \"Spoofing, Tampering, Repudiation, Information disclosure, DoS, Elevation\"", "DREAD: \"Damage, Reproducibility, Exploitability, Affected users, Discoverability\"", "Kill Chain: \"RWDEICA\" — Recon, Weaponize, Deliver, Exploit, Install, C2, Actions\"", "ATE levels: \"Awareness (everyone), Training (role-specific), Education (professionals)\"", "Program cycle: \"ADDMI\" — Assess, Develop, Deliver, Measure, Improve", "IR phases: \"PDCER-P\" — Prepare, Detect, Contain, Eradicate, Recover, Post-incident (review)", "Containment order: \"Evidence first, Contain second, Eradicate third\"", "US regulations by sector: \"GS-PH-FC\" — GLBA+SOX (financial), PCI (cards), HIPAA (health), FISMA (government), CCPA (privacy)", "Breach notification: \"GDPR=72hrs to authority, HIPAA=60days to individuals\"", "Quantitative formulas: \"AV x EF = SLE, SLE x ARO = ALE\"", "Risk treatment: \"MATA\" — Mitigate, Accept, Transfer, Avoid", "NIST RMF: \"Can Sam Identify All Authorized Monitors?\" — Categorize, Select, Implement, Assess, Authorize, Monitor", "Policy hierarchy: \"People Should Be Good People\" — Policy, Standard, Baseline, Guideline, Procedure", "CISO reporting: \"Never to CIO — always CEO/COO/Board\" for independence", "COOP elements: \"ESDA-VHR\" — Essential functions, Succession, Delegation, Alternate sites, Vital records, Human capital, Reconstitution", "Succession depth: \"Three deep — primary, first alternate, second alternate\"", "Recovery hierarchy: \"MTD is the Max, RTO is the Target, WRT is the Work to verify, RPO is the Point of data loss\"", "Canon order: \"SHSP\" — Society, Honor, Service, Profession", "Ethics priority: \"Society first, Self last\"", "Awareness levels: \"ATE\" — Awareness (all), Training (targeted), Education (experts)", "Burden of proof: \"BPS\" — Beyond reasonable doubt (criminal), Preponderance (civil), Substantial evidence (administrative)", "Negligence: \"DBCD\" — Duty, Breach, Causation, Damages — all four required", "OECD principles: \"CDPUSOIA\" — Collection limitation, Data quality, Purpose specification, Use limitation, Security, Openness, Individual participation, Accountability", "Export controls: \"EAR for Everyone (commercial), ITAR for Infantry (military)\"", "Control selection flow: \"199 Categorize → 200 Require → 53 Select → Tailor → Implement\"", "Kill Chain: \"Recon Weapons Delivered, Exploits Installed, Command Achieved\" — RWDEICA", "Diamond Model: \"AICV\" — Adversary, Infrastructure, Capability, Victim", "Evidence types: \"RDTDH\" — Real, Documentary, Testimonial, Demonstrative, Hearsay", "Admissibility: \"RSRL\" — Relevant, Sufficient, Reliable, Legally obtained", "RMF steps: \"Can Sally Implement A Secure Monitor?\" — Categorize, Select, Implement, Assess, Authorize, Monitor", "CMM levels: \"I Rarely Define Metrics Optimally\" — Initial, Repeatable, Defined, Managed, Optimizing"]}, {"code": "ASD", "name": "Asset Security", "weight": "10", "topics": [{"t": "Data Classification and Sensitive Data Types", "d": "Data must be classified by sensitivity. Government: Top Secret > Secret > Confidential > Unclassified. Private sector: Confidential > Private > Sensitive > Public. Key data types include PII, PHI, and proprietary data."}, {"t": "Data Roles and Responsibilities", "d": "Data Owner (classifies, ultimately responsible), Data Custodian (day-to-day protection), Data Controller (determines processing purpose), Data Processor (processes on behalf of controller)."}, {"t": "Data States and Protection Methods", "d": "Data at rest (AES-256), in motion (TLS/VPN), and in use (memory isolation). Tokenization replaces data with tokens that have no mathematical relationship to the original."}, {"t": "Data Destruction and Remanence", "d": "Destruction hierarchy: Erasing < Clearing < Purging < Sanitization < Destruction. Data remanence is residual data after deletion. Degaussing only works on magnetic media (NOT SSDs)."}, {"t": "Privacy Protection and Data Lifecycle", "d": "Pseudonymization (replaceable identifiers, still personal data), anonymization (permanent, no longer personal data), data masking, and the full data lifecycle from creation through destruction."}, {"t": "Data Security Controls and Data Loss Prevention (DLP)", "d": "DLP systems detect and prevent unauthorized data exfiltration across three deployment points: network (data in motion), endpoint (data in use), and storage (data at rest). Combined with data rights management (DRM/IRM) and database activity monitoring (DAM)."}, {"t": "Data Retention Policies and Record Management", "d": "Data retention policies define how long data must be kept and when it must be destroyed. Requirements come from regulations (SOX 7 years, HIPAA 6 years), business needs, and legal holds that override normal destruction schedules."}, {"t": "Asset Classification and Inventory", "d": "All organizational assets must be inventoried and classified. Asset types include hardware, software, data, and personnel. Classification drives the security controls applied. Asset management is continuous throughout the asset lifecycle."}, {"t": "Media Handling and Storage Security", "d": "Physical and digital media must be handled according to classification level. Controls include marking/labeling, secure storage, controlled transport, and proper sanitization before reuse or disposal."}, {"t": "Anonymization and De-identification Techniques", "d": "Anonymization irreversibly removes PII (no longer personal data under GDPR). De-identification uses techniques like k-anonymity, l-diversity, and t-closeness. Pseudonymization is reversible and data remains personal data under GDPR."}, {"t": "Cloud Data Security and Shared Responsibility", "d": "Cloud computing shifts data security responsibilities between provider and customer based on service model. IaaS gives customers most control, SaaS gives least. The shared responsibility model defines who secures what."}, {"t": "Data Ownership and Accountability", "d": "Data ownership defines who has ultimate responsibility for data throughout its lifecycle. Roles include Data Owner, Data Steward, Data Controller, and Data Processor, each with distinct responsibilities and accountability levels."}, {"t": "Information Lifecycle Management (ILM)", "d": "ILM manages data from creation through disposal across six phases: Create, Store, Use, Share, Archive, and Destroy. Each phase requires appropriate security controls based on classification."}, {"t": "Encryption for Data Protection: Methods and Key Management", "d": "Data protection relies on encryption: symmetric (AES — fast, bulk data), asymmetric (RSA/ECC — key exchange, digital signatures), and hybrid approaches. Key management is critical — poor key management undermines all encryption."}, {"t": "Data Sovereignty and Cross-Border Data Transfer", "d": "Data sovereignty requires that data is subject to the laws of the country where it resides. Cross-border transfers require legal mechanisms (GDPR SCCs, BCRs, adequacy decisions). Cloud computing complicates sovereignty."}, {"t": "NIST SP 800-88: Media Sanitization Guidelines", "d": "NIST 800-88 Rev. 1 defines three sanitization levels: Clear (overwrite), Purge (make unrecoverable), and Destroy (physical destruction). The appropriate level depends on security categorization and whether media will be reused."}, {"t": "Data Security in Different Environments", "d": "Data security requirements differ across environments: on-premises (full control), cloud (shared responsibility), mobile (BYOD/MDM), IoT (limited compute), and legacy systems (outdated controls). Each requires tailored approaches."}, {"t": "Scoping and Tailoring Security Controls", "d": "Scoping identifies which security controls apply to a system. Tailoring modifies selected controls to fit the organizational context. Together they ensure controls are appropriate — not excessive or insufficient."}, {"t": "Digital Rights Management (DRM) and Information Rights Management (IRM)", "d": "DRM protects digital content (music, video, software) from unauthorized use. IRM extends this concept to business documents with persistent protection that travels with the data regardless of location."}, {"t": "Data Security Baselines and Standards", "d": "Security baselines define minimum acceptable configurations. Key baselines include CIS Benchmarks, DISA STIGs, and vendor-specific guides. Baselines must be applied, monitored, and updated as threats evolve."}, {"t": "Privacy Impact Assessment (PIA) and Data Protection Impact Assessment (DPIA)", "d": "PIAs and DPIAs systematically identify and mitigate privacy risks before systems go live. GDPR mandates DPIAs for high-risk processing. Both assess necessity, proportionality, and risks to individuals."}, {"t": "Secure Resource Provisioning", "d": "Secure provisioning ensures resources (hardware, software, cloud, personnel) are deployed with appropriate security controls from the start. It includes procurement security, secure configuration, and access control setup."}, {"t": "Data Marking, Labeling, and Handling", "d": "All data and media must be marked with classification levels. Handling procedures define how data at each level may be stored, transmitted, processed, and destroyed. Proper labeling prevents accidental disclosure."}, {"t": "Data Loss Prevention (DLP) Implementation", "d": "DLP technologies, deployment modes, policy configuration, and integration with data classification for preventing unauthorized data exposure."}, {"t": "Data Governance and Stewardship", "d": "Organizational structures for data management including data governance frameworks, data quality, metadata management, and data stewardship roles."}, {"t": "Cloud Data Security and Shared Responsibility", "d": "Protecting data in cloud environments including encryption strategies, key management, data residency, and cloud-specific data security controls."}, {"t": "Privacy Impact Assessments and Data Protection", "d": "Conducting PIAs/DPIAs, implementing privacy-enhancing technologies, and applying data protection principles including purpose limitation and data minimization."}, {"t": "Information Rights Management (IRM) and Digital Rights Management (DRM)", "d": "Technologies for persistent data protection including document rights management, usage controls, watermarking, and enterprise IRM deployment."}, {"t": "Secure Data Destruction and Disposal", "d": "Methods for securely destroying data across different media types including magnetic, solid-state, optical, and cloud environments."}, {"t": "Data States and Protection Methods", "d": "Protecting data in all three states: at rest, in transit, and in use, with appropriate encryption and access control for each state."}, {"t": "Data Ownership Models and Responsibilities", "d": "Proper data ownership assigns clear accountability for data classification, protection, and lifecycle management. Understanding the distinction between owner, custodian, steward, processor, and controller is heavily tested."}, {"t": "Data Retention and Disposal Requirements", "d": "Organizations must retain data for legally mandated periods while disposing of it when retention expires. Over-retention increases risk; under-retention violates compliance. Legal holds override all retention schedules."}, {"t": "Tokenization vs Encryption vs Masking", "d": "Three key data protection techniques with different characteristics: encryption (reversible with key), tokenization (random substitution with vault), and masking (irreversible transformation). Each suits different use cases."}, {"t": "Cloud Data Security Models", "d": "Cloud computing introduces unique data security challenges. The shared responsibility model defines who secures what. Customer ALWAYS owns data security regardless of cloud service model (IaaS, PaaS, SaaS)."}, {"t": "Data Classification Procedures and Criteria", "d": "A formal data classification process includes identifying data, determining classification criteria, assigning labels, implementing controls, and periodically reviewing classifications. Both over- and under-classification waste resources or create risk."}, {"t": "Object Reuse and Data Remanence", "d": "Object reuse occurs when storage media is reassigned to a new user/process without proper sanitization. Data remanence is residual data remaining after deletion. Both create risks of unauthorized information disclosure."}, {"t": "Data Sovereignty and Residency", "d": "Data sovereignty means data is subject to the laws of the country where it physically resides. Data residency requires data to remain within specific geographic boundaries. Cloud computing makes both increasingly complex."}, {"t": "Anonymization Techniques: k-Anonymity, l-Diversity, t-Closeness", "d": "Advanced anonymization techniques prevent re-identification of individuals in datasets. Each technique addresses specific weaknesses in simpler approaches, from k-anonymity through l-diversity to t-closeness."}, {"t": "CASB: Cloud Access Security Broker", "d": "A CASB sits between cloud users and cloud services to enforce security policies, provide visibility into shadow IT, protect data, and ensure compliance across cloud environments."}, {"t": "Information Lifecycle Management Phases", "d": "Data passes through distinct lifecycle phases: Create, Store, Use, Share, Archive, and Destroy. Each phase requires appropriate security controls to protect data throughout its existence."}, {"t": "European Data Protection: GDPR Deep Dive", "d": "GDPR is the most comprehensive privacy regulation globally. Key concepts include lawful bases for processing, data subject rights, DPO requirements, 72-hour breach notification, and extraterritorial scope."}, {"t": "Data Handling and Media Management", "d": "Proper data handling procedures ensure information is protected throughout its lifecycle. Media management covers labeling, storage, transportation, and sanitization of physical and electronic media."}, {"t": "Data Loss Prevention Architecture", "d": "DLP systems detect and prevent unauthorized data exfiltration. Three deployment points protect data at rest, in motion, and in use. Detection methods include exact matching, regex, fingerprinting, and machine learning."}, {"t": "Sensitive Data Types and Regulatory Mapping", "d": "Different types of sensitive data (PII, PHI, PCI, IP) are protected by different regulations. Understanding which regulations apply to which data types drives control selection and compliance strategy."}, {"t": "Cloud Security Alliance and CSA STAR", "d": "The Cloud Security Alliance provides the Cloud Controls Matrix and STAR registry for evaluating cloud provider security. Understanding CCM, CAIQ, and STAR certification levels helps with cloud vendor assessment."}, {"t": "Records Management and Legal Hold", "d": "Records management ensures organizational records are created, maintained, and disposed of in accordance with legal, regulatory, and business requirements. Legal holds override all retention schedules when litigation is anticipated."}, {"t": "Secure Asset Provisioning and Decommissioning", "d": "Assets must be provisioned with security from the start and decommissioned with proper data sanitization. The asset lifecycle requires security at acquisition, deployment, operation, maintenance, and disposal."}, {"t": "Data Protection Methods Comparison", "d": "Comparing encryption, tokenization, masking, hashing, obfuscation, and anonymization helps select the right data protection method for each use case. Each technique has different reversibility, performance, and compliance characteristics."}, {"t": "Scoping and Tailoring Data Protection Controls", "d": "Scoping determines which security controls apply to a specific system based on the data it processes. Tailoring adjusts baseline controls to meet specific organizational requirements and risk tolerance."}, {"t": "Data Quality and Integrity Controls", "d": "Data integrity ensures information is accurate, complete, consistent, and trustworthy throughout its lifecycle. Controls include input validation, referential integrity, checksums, and audit trails."}, {"t": "Secure Data Sharing and Collaboration", "d": "Secure data sharing enables collaboration while maintaining confidentiality and compliance. Technologies include DRM, IRM, secure file sharing, data rooms, and privacy-preserving techniques."}, {"t": "Physical Asset Security and Facility Protection", "d": "Physical asset security protects hardware, media, and facilities from theft, damage, and unauthorized access. It includes access controls, environmental controls, and asset tracking throughout the lifecycle."}, {"t": "Data Backup and Recovery Strategies", "d": "Data backup strategies protect against data loss from hardware failure, human error, malware, and disasters. The 3-2-1 rule, backup types, and recovery objectives guide backup program design."}, {"t": "Third-Party and Cloud Data Processing Agreements", "d": "When third parties process your data, proper agreements are essential. Data Processing Agreements (DPAs) under GDPR, Business Associate Agreements (BAAs) under HIPAA, and service level agreements define responsibilities and protections."}], "review": [{"t": "PII", "d": "Personally Identifiable Information — any data that can identify a specific individual."}, {"t": "PHI", "d": "Protected Health Information — health data linked to an individual, protected under HIPAA."}, {"t": "Data Owner", "d": "Senior manager ultimately responsible. Classifies data and determines access policies."}, {"t": "Data Custodian", "d": "IT staff performing day-to-day tasks (backups, access control) as directed by the Owner."}, {"t": "Controller vs Processor", "d": "Controller determines WHY/HOW data is processed. Processor handles data on behalf of controller."}, {"t": "Degaussing", "d": "Strong magnetic field to destroy data on magnetic media. Does NOT work on SSDs/flash/optical."}, {"t": "Cryptographic Erasure", "d": "Destroying the encryption key, rendering encrypted data permanently unreadable. Preferred for SSDs/cloud."}, {"t": "Pseudonymization", "d": "Replaces identifiers with fake ones but re-identification is possible. Still personal data under GDPR."}, {"t": "Data Remanence", "d": "Residual data remaining on media after deletion attempts."}, {"t": "Scoping vs Tailoring", "d": "Scoping = selecting applicable controls. Tailoring = customizing those controls for your environment."}, {"t": "Tokenization", "d": "Replacing sensitive data with a non-sensitive token. No mathematical relationship to original value."}, {"t": "COPPA", "d": "Children's Online Privacy Protection Act — websites collecting PII from children under 13 need parental consent."}, {"t": "Legal Hold", "d": "Directive to preserve records when litigation anticipated. OVERRIDES normal retention schedules — no destruction allowed."}, {"t": "Data Retention", "d": "How long data must be kept. SOX=7yr, HIPAA=6yr. Over-retention increases risk, under-retention violates compliance."}, {"t": "NIST 800-88", "d": "Media sanitization guide. Three levels: Clear (overwrite), Purge (unrecoverable), Destroy (physical). One-pass clear is sufficient."}, {"t": "k-Anonymity", "d": "Each record indistinguishable from k-1 others. Vulnerable to homogeneity attack (all k records same sensitive value)."}, {"t": "l-Diversity", "d": "Requires l different sensitive values per equivalence class. Fixes k-anonymity homogeneity weakness."}, {"t": "Differential Privacy", "d": "Adds mathematical noise to query results. Protects individuals while preserving aggregate statistics."}, {"t": "Shared Responsibility Model", "d": "Cloud security split: IaaS=customer most responsible, SaaS=CSP most responsible. Customer ALWAYS responsible for data."}, {"t": "CASB", "d": "Cloud Access Security Broker — monitors and enforces security policy for cloud service usage."}, {"t": "Data Sovereignty", "d": "Data subject to laws where it physically resides. Cloud replication can create unintended sovereignty issues."}, {"t": "ILM", "d": "Information Lifecycle Management: Create, Store, Use, Share, Archive, Destroy — security controls at every phase."}, {"t": "Data Steward", "d": "Focuses on data quality, consistency, and governance. Works between owners and custodians."}, {"t": "Data Masking", "d": "Replaces real data with fictional but structurally similar data. Static (separate copy) or Dynamic (real-time). Not reversible."}, {"t": "DRM vs IRM", "d": "DRM = entertainment content protection. IRM = business document protection. Both: protection travels with data."}, {"t": "CIS Benchmarks", "d": "Community configuration guides. Level 1 = essential/minimal impact. Level 2 = defense in depth/may reduce functionality."}, {"t": "DISA STIGs", "d": "DoD configuration standards. CAT I = critical, CAT II = medium, CAT III = low severity."}, {"t": "DPIA", "d": "Data Protection Impact Assessment. GDPR mandatory for high-risk processing. Conduct BEFORE building system."}, {"t": "PIA", "d": "Privacy Impact Assessment. US federal requirement under E-Government Act. Evaluates PII collection/use/sharing."}, {"t": "Secure Provisioning", "d": "Deploy resources with security from start. Verify integrity, configure baselines, harden, enforce least privilege."}, {"t": "Asset Lifecycle", "d": "Acquire, Deploy, Operate, Retire — security considerations at every phase."}, {"t": "Shadow IT", "d": "Unauthorized cloud services used by employees outside management visibility. Discovered via CASB."}, {"t": "Record Categories", "d": "Vital (irreplaceable), Important (effort to replace), Useful (convenient), Nonessential (short-term utility)."}, {"t": "Configuration Drift", "d": "Unauthorized deviation from approved security baselines. Detected by SCAP scanners and config management tools."}, {"t": "Media Marking", "d": "Label all media with HIGHEST classification contained. Use headers/footers/cover sheets for documents."}, {"t": "DLP States", "d": "Data at rest (stored), in motion (network), in use (endpoint). Each requires different DLP deployment."}, {"t": "DLP Detection", "d": "Exact matching, regex, keywords, statistical/ML, document fingerprinting. Exact = lowest FP."}, {"t": "Network DLP", "d": "Monitors email/web/FTP at network choke points. Cannot prevent USB or print."}, {"t": "Endpoint DLP", "d": "Agent on device — monitors USB, print, clipboard, file operations."}, {"t": "Cloud DLP", "d": "Integrates with CASB — monitors cloud storage, SaaS apps."}, {"t": "Data Steward", "d": "Day-to-day data quality and policy management. Bridges Owner and Custodian."}, {"t": "Data Quality", "d": "Accuracy, completeness, consistency, timeliness, validity, uniqueness."}, {"t": "Data Lineage", "d": "Tracks data from source through transformations to consumption. Audit trail for compliance."}, {"t": "Data Catalog", "d": "Makes metadata discoverable across the organization. Technical + business + operational metadata."}, {"t": "SSE-KMS", "d": "Server-Side Encryption with customer-managed keys in cloud. Balance of control and convenience."}, {"t": "BYOK/HYOK", "d": "Bring Your Own Key (cloud KMS) / Hold Your Own Key (on-prem). HYOK = maximum control."}, {"t": "Data Residency", "d": "Regulatory requirement for data to stay within geographic boundaries (GDPR, PIPL)."}, {"t": "Shadow Data", "d": "Sensitive data in unmanaged cloud services. Discovered via CASB + cloud DLP."}, {"t": "Residual Data", "d": "Data remaining after deletion. Object reuse risk. Sanitize: clear → purge → destroy."}, {"t": "PIA/DPIA", "d": "Privacy Impact Assessment / Data Protection Impact Assessment. Required by GDPR for high-risk processing."}, {"t": "Privacy by Design", "d": "Cavoukian 7 principles. Proactive, default privacy, embedded in design. GDPR Article 25."}, {"t": "Differential Privacy", "d": "Mathematical noise added to queries. Protects individuals in aggregate analysis. Used by Apple/Google."}, {"t": "Homomorphic Encryption", "d": "Compute on encrypted data without decrypting. Very slow but advancing. Privacy-preserving analytics."}, {"t": "Data Minimization", "d": "Collect only what is necessary. GDPR principle. Reduces breach impact."}, {"t": "Purpose Limitation", "d": "Data collected only for specified purposes. Cannot be repurposed without consent."}, {"t": "Storage Limitation", "d": "Retain data only as long as needed. Delete when purpose fulfilled."}, {"t": "Right to Erasure", "d": "GDPR right to be forgotten. Data subject can request deletion. Challenging in distributed systems."}, {"t": "IRM", "d": "Information Rights Management — persistent protection traveling with data. Controls: read, edit, copy, print, forward."}, {"t": "DRM", "d": "Digital Rights Management — consumer content protection. Widevine, FairPlay."}, {"t": "Watermarking", "d": "Visible/invisible marks identifying authorized recipient. Enables leak tracing."}, {"t": "Steganography", "d": "Hiding data within other data (images, audio). Covert communication or watermarking."}, {"t": "Data Governance Board", "d": "Sets data strategy, resolves disputes, prioritizes initiatives. Cross-functional leadership."}, {"t": "ETL Security", "d": "Extract-Transform-Load pipeline. Protect data during extraction and transformation stages."}, {"t": "Data Lake", "d": "Raw unstructured data storage. Zone-based architecture: raw → curated → published."}], "formulas": [], "aids": ["Government: \"Top Students Score Correctly, Usually\" — TS, S, C, U", "Private: \"Companies Protect Sensitive Public-data\" — C, P, S, Pub", "Owner = Oversees classification", "Custodian = Caretaker doing daily Care", "Controller Controls purpose, Processor just Processes", "Three states: \"RMU\" — Rest (stored), Motion (network), Use (memory)", "At Rest: \"AES Always Encrypts Storage\"", "Destruction hierarchy: \"Every Child Plays Safe, Destroyed\" — Erase, Clear, Purge, Sanitize, Destroy", "Degaussing = Demagnetizing — only magnetic media", "Pseudo = fake name but traceable (like a pen name)", "Anonymous = gone forever", "Scoping vs Tailoring: \"Scope the list, Tailor the fit\"", "DLP deployment: \"NES\" — Network, Endpoint, Storage", "DLP actions: \"AQEB\" — Alert, Quarantine, Encrypt, Block", "DRM vs DLP: \"DRM travels with data, DLP guards the gate\"", "Retention priorities: \"VIU-N\" — Vital (irreplaceable), Important (effort to replace), Useful (convenient), Nonessential (short-term)", "Legal hold: \"Litigation Locks data — no destruction\"", "Asset types: \"HSDP\" — Hardware, Software, Data, Personnel", "Asset lifecycle: \"ADOR\" — Acquire, Deploy, Operate, Retire", "Sanitization levels: \"CPD\" — Clear (overwrite), Purge (unrecoverable), Destroy (physical)", "Degaussing: \"De-GAUSS = De-MAGnetic — magnetic media only\"", "Privacy hierarchy: \"Anonymized > De-identified > Pseudonymized\" — strongest to weakest", "k-l-t: \"k groups, l varieties, t distributions\"", "Responsibility: \"IaaS = I do Almost all Security, SaaS = Somebody else does Almost all Security\"", "Cloud concerns: \"SCPDRD\" — Sovereignty, Commingling, Portability, Destruction, Right-to-audit, Data classification", "OSCP: \"Owner Sets policy, Steward ensures quality, Custodian Performs tasks, Processor follows instructions\"", "Accountability: \"Accountability stays At the top, Always\"", "Data lifecycle: \"Create, Store, Use, Share, Archive, Destroy\" — CSUAD", "Destroy all copies: \"BRAT\" — Backups, Replicas, Archives, Temp files — all must be destroyed", "Symmetric: \"Same key, Speedy\" — one key, fast", "Asymmetric: \"A pair Apart\" — public/private pair", "Key lifecycle: \"GDSURRD\" — Generate, Distribute, Store, Use, Rotate, Revoke, Destroy", "Transfer mechanisms: \"ASBD\" — Adequacy, SCCs, BCRs, Derogations", "Schrems II: \"Shield Shattered, SCCs Strengthened\"", "Sanitization: \"CPD — Clear it, Purge it, Destroy it\"", "SSD sanitization: \"Crypto kills SSDs, Degaussing does NOT\"", "Environment controls: \"OCMIL\" — On-premises (full control), Cloud (shared), Mobile (MDM), IoT (segment), Legacy (isolate)", "Mobile security: \"MCRE\" — MDM, Containerization, Remote wipe, Encryption", "Scope then Tailor: \"Select, then Sew to fit\"", "Control types: \"CSH\" — Common (organizational), System-specific (one system), Hybrid (mix)", "DRM vs DLP: \"DRM is the bodyguard (travels with data), DLP is the security gate (guards the perimeter)\"", "Analog hole: \"A camera always wins\" — if you can see it, you can capture it", "CIS Levels: \"Level 1 = Light touch, Level 2 = Lockdown\"", "STIG CATs: \"CAT I = Critical, CAT II = Cautious, CAT III = Cosmetic\"", "DPIA process: \"DARIN-C\" — Describe, Assess necessity, Risk assessment, Identify mitigations, Note findings, Consult DPO/authority", "DPIA required: \"SLAM-N\" — Sensitive data at Scale, Large-scale monitoring, Automated decisions, Monitoring public areas, New technologies", "Provisioning: \"VCHA\" — Verify (integrity), Configure (baselines), Harden (remove unnecessary), Access (least privilege)", "Deprovisioning: \"RSDRU\" — Revoke access, Sanitize data, Dispose hardware, Remove records, Update inventory", "Marking locations: \"HFC\" — Headers, Footers, Cover sheets on every page", "Handling: \"STPD\" — Storage, Transmission, Processing, Destruction requirements per level", "DLP states: \"RMU\" — Rest (storage), Motion (network), Use (endpoint)", "DLP detection: \"ERKSD\" — Exact matching, Regex, Keywords, Statistical, Document fingerprint", "Data roles: \"OSCP\" — Owner (accountable), Steward (quality), Custodian (technical), Processor (delegated)", "Data quality: \"ACCTVU\" — Accuracy, Completeness, Consistency, Timeliness, Validity, Uniqueness", "Cloud encryption: \"Provider Provides, Customer Controls, HYOK Holds\" — increasing customer control", "Data sovereignty: \"Data stays where law says\" — regulatory geographic restrictions", "Privacy principles: \"PDS-AIA\" — Purpose limitation, Data minimization, Storage limitation, Accuracy, Integrity/confidentiality, Accountability", "GDPR rights: \"ARREPO\" — Access, Rectify, Restrict, Erase, Port, Object", "IRM vs DLP: \"IRM = Inherent Rights on Media (travels with data), DLP = Data Leaving Prevention (guards boundaries)\"", "IRM controls: \"RECPF\" — Read, Edit, Copy, Print, Forward (each independently controllable)", "Destruction by media: \"Magnetic=Degauss/Shred, SSD=Crypto/Crush, Optical=Shred, Paper=CrossCut\"", "Documentation: \"Serial number, Method, Date, Witness, Certificate\"", "Data states: \"ReTU\" — Rest (stored), Transit (moving), Use (processing)", "Protection by state: \"FDE at rest, TLS in transit, SGX in use\""]}, {"code": "SEC", "name": "Security Architecture and Engineering", "weight": "13", "topics": [{"t": "Cryptography Fundamentals (PAIN)", "d": "Cryptography achieves four goals: Privacy (confidentiality), Authentication, Integrity, Non-Repudiation. Key space = 2^n. Kerckhoffs' Principle: security depends on key secrecy, not algorithm secrecy."}, {"t": "Symmetric vs Asymmetric Cryptographic Systems", "d": "Symmetric uses one shared key (AES, 3DES) — fast but key distribution problem. Asymmetric uses key pairs (RSA, ECC, Diffie-Hellman) — scalable but slow. Hybrid systems combine both. Digital signatures provide authentication, integrity, and non-repudiation."}, {"t": "Security Models: Bell-LaPadula, Biba, Clark-Wilson", "d": "Bell-LaPadula enforces confidentiality (no read up, no write down). Biba enforces integrity (no read down, no write up). Clark-Wilson uses well-formed transactions and separation of duties for commercial integrity."}, {"t": "Secure Design Principles and Zero Trust", "d": "Defense in depth layers multiple controls. Zero trust assumes breach and verifies continuously. Fail-secure denies access on failure. Fail-open allows access. Least privilege, complete mediation, economy of mechanism, and separation of duties are foundational principles."}, {"t": "Hashing, Digital Certificates, and PKI", "d": "Hashing creates fixed-length digests for integrity (SHA-256, SHA-3). PKI uses Certificate Authorities to bind public keys to identities. Certificate lifecycle includes issuance, renewal, and revocation (CRL, OCSP). HMAC combines hashing with a secret key for authentication."}, {"t": "Site and Facility Security Controls", "d": "Physical security uses layered perimeters: fencing, lighting, CCTV, guards. Mantrap/vestibule prevents tailgating. Server room controls: positive pressurization, FM-200 suppression, raised floors. HVAC maintains temperature/humidity. Power: UPS for short-term, generators for long-term."}, {"t": "Cryptographic Key Management and Key Lifecycle", "d": "Cryptographic key management covers the entire key lifecycle — generation, distribution, storage, rotation, revocation, and destruction — along with key escrow, key recovery, and split knowledge/dual control principles."}, {"t": "Elliptic Curve Cryptography and Modern Algorithms", "d": "ECC provides equivalent security to RSA with much smaller key sizes (256-bit ECC equals 3072-bit RSA). Understanding algorithm selection, key sizes, and the impact of quantum computing on current cryptographic systems."}, {"t": "Security Evaluation Models: Common Criteria and TCSEC", "d": "TCSEC (Orange Book) rated systems A1-D. Common Criteria (ISO 15408) replaced it with Evaluation Assurance Levels (EAL1-7). Protection Profiles define requirements; Security Targets describe implementation."}, {"t": "Trusted Computing and Hardware Security", "d": "Hardware security includes TPM (key storage, measured boot), HSM (cryptographic operations), Secure Boot (firmware integrity), and hardware roots of trust. These form the foundation for system integrity."}, {"t": "State Machine Model and Information Flow Model", "d": "The state machine model ensures a system is secure in every possible state. The information flow model tracks how data moves between subjects and objects, preventing unauthorized information flows (covert channels)."}, {"t": "Processor Security: Protection Rings and Memory Protection", "d": "Processor protection rings (0-3) enforce privilege separation. Ring 0 = kernel (most privileged), Ring 3 = user applications (least privileged). Memory protection mechanisms prevent processes from accessing each other's memory space."}, {"t": "Virtualization Security", "d": "Virtualization introduces security concerns: VM escape (breaking out of VM to hypervisor), VM sprawl (unmanaged VMs), inter-VM attacks, and hypervisor vulnerabilities. Type 1 (bare-metal) hypervisors are more secure than Type 2 (hosted)."}, {"t": "Cryptanalytic Attacks", "d": "Cryptanalytic attacks attempt to break encryption: Brute Force (try all keys), Known Plaintext (have some plaintext-ciphertext pairs), Chosen Plaintext (choose plaintexts to encrypt), Ciphertext-Only (only ciphertext available), Birthday Attack (collision finding), Side-Channel (physical leakage)."}, {"t": "PKI: Certificate Authorities, Certificate Lifecycle, and Trust Models", "d": "Public Key Infrastructure binds identities to public keys through Certificate Authorities (CAs). Certificate lifecycle includes issuance, renewal, suspension, and revocation. Trust models: hierarchical, bridge, mesh, and web of trust."}, {"t": "Hashing Algorithms and Message Authentication", "d": "Hash functions produce fixed-size digests: MD5 (128-bit, broken), SHA-1 (160-bit, broken), SHA-256/SHA-3 (secure). HMAC combines hashing with a secret key for authentication. Digital signatures use hashing with asymmetric encryption for non-repudiation."}, {"t": "Block Cipher Modes of Operation", "d": "Block ciphers operate in different modes: ECB (insecure, patterns preserved), CBC (XOR with previous block), CTR (counter mode, parallelizable), GCM (authenticated encryption). Mode selection affects security, performance, and functionality."}, {"t": "Physical Security: Perimeter, Environmental, and Fire Controls", "d": "Physical security uses layered controls: perimeter (fences, gates, lighting), building (locks, mantraps, CCTV), environmental (HVAC, humidity), and fire suppression (wet pipe, dry pipe, FM-200, Halon alternatives)."}, {"t": "Secure Architecture Patterns: SOA, Microservices, and Serverless", "d": "Modern architecture patterns introduce security considerations. Service-Oriented Architecture (SOA) uses web services. Microservices decompose into small, independent services. Serverless shifts responsibility to the cloud provider. Each pattern has unique attack surfaces."}, {"t": "Cryptographic Key Management Lifecycle", "d": "Key management is more important than algorithm choice. The lifecycle includes generation (secure random), distribution (secure channel), storage (HSM/vault), use (proper algorithm/mode), rotation, archival, and destruction."}, {"t": "Secure Facility Design and Construction", "d": "Secure facility design addresses site selection (natural hazards, proximity to threats), construction materials, utility systems (power, water, HVAC), and specialized areas (server rooms, Faraday cages, SCIFs)."}, {"t": "IoT and Embedded System Security", "d": "IoT and embedded systems present unique security challenges: limited computing power, long lifecycles, default credentials, lack of patching capability, and massive scale. Security requires network isolation, firmware integrity, and lifecycle management."}, {"t": "Lattice-Based and Non-Interference Security Models", "d": "Formal security models including lattice-based access control, non-interference models, and composition theories for system security evaluation."}, {"t": "Cloud Security Architecture", "d": "Security considerations for cloud computing models including IaaS, PaaS, SaaS shared responsibility, cloud security controls, and cloud-native security tools."}, {"t": "Cryptographic Lifecycle and Algorithm Selection", "d": "Managing the lifecycle of cryptographic systems including algorithm selection, key length requirements, crypto agility, and transitioning from deprecated algorithms."}, {"t": "Side-Channel Attacks and Hardware Security", "d": "Attacks exploiting physical characteristics of cryptographic implementations including timing, power analysis, electromagnetic emanation, and cache-based attacks."}, {"t": "Reference Monitor and Security Kernel", "d": "The reference monitor concept, security kernel implementation, Trusted Computing Base, and formal verification of security properties."}, {"t": "Symmetric and Asymmetric Encryption Deep Dive", "d": "Detailed comparison of symmetric and asymmetric algorithms including AES internals, RSA operations, ECC advantages, and hybrid encryption."}, {"t": "Secure Design Principles", "d": "Foundational security design principles including economy of mechanism, least privilege, complete mediation, open design, and psychological acceptability."}, {"t": "Digital Signatures and Non-Repudiation", "d": "How digital signatures provide authentication, integrity, and non-repudiation using hash functions and asymmetric encryption."}, {"t": "Hash Functions and Message Authentication", "d": "Cryptographic hash functions, HMAC, message authentication codes, and their role in ensuring data integrity."}, {"t": "Public Key Infrastructure Deep Dive", "d": "PKI components, certificate lifecycle, trust models, certificate types, and PKI vulnerabilities."}, {"t": "Virtualization Security", "d": "Security challenges and controls for virtualized environments including hypervisor security, VM isolation, container security, and virtual network security."}, {"t": "Industrial Control Systems Security", "d": "Securing SCADA, ICS, and OT environments including Purdue model, protocol security, and IT/OT convergence challenges."}, {"t": "Physical Security Integration with Logical Controls", "d": "How physical security controls complement logical/technical controls and the importance of converged security programs."}, {"t": "Embedded Systems and IoT Security", "d": "Security challenges and controls for embedded systems, IoT devices, and cyber-physical systems."}, {"t": "Secure Facility Design and Construction", "d": "Security considerations for facility planning including site selection, building design, utility management, and environmental controls."}, {"t": "Cryptanalysis and Attack Methods", "d": "Methods of attacking cryptographic systems including brute force, mathematical attacks, implementation attacks, and social engineering."}, {"t": "Zero Knowledge Proofs and Advanced Cryptographic Protocols", "d": "Advanced cryptographic concepts including zero knowledge proofs, homomorphic encryption, secure multi-party computation, and post-quantum cryptography."}, {"t": "Secure Architecture Principles: Defense in Depth and Least Privilege", "d": "Defense in depth layers multiple independent security controls so no single failure compromises the system. Least privilege restricts access to the minimum necessary. Together they form the foundation of secure architecture."}, {"t": "Security Models: Brewer-Nash, Graham-Denning, and Harrison-Ruzzo-Ullman", "d": "Beyond Bell-LaPadula and Biba, additional security models address specific access control scenarios: Brewer-Nash (Chinese Wall) for conflicts of interest, Graham-Denning for access rights creation, and HRU for access control decidability."}, {"t": "Covert Channels: Storage and Timing", "d": "Covert channels are unauthorized communication paths that violate the system security policy. Storage channels transmit data by modifying shared resources. Timing channels use variations in processing time to signal information."}, {"t": "Cryptographic Algorithm Comparison: AES, RSA, ECC, SHA", "d": "Understanding the strengths, key sizes, performance characteristics, and appropriate use cases for major cryptographic algorithms is essential for the CISSP exam."}, {"t": "Digital Certificates and Certificate Lifecycle", "d": "X.509 digital certificates bind a public key to an identity. The certificate lifecycle includes request, issuance, use, renewal, suspension, and revocation. CRLs and OCSP check certificate validity."}, {"t": "Steganography and Digital Watermarking", "d": "Steganography hides the existence of a message within another medium (image, audio, video). Digital watermarking embeds identifying information for traceability. Both complement but differ from encryption."}, {"t": "Fire Suppression Systems for Data Centers", "d": "Fire suppression in data centers requires systems that extinguish fires without damaging electronic equipment or harming personnel. Clean agent systems (FM-200, Novec 1230) are preferred over water-based systems."}, {"t": "TEMPEST and Emanation Security", "d": "TEMPEST is a US government program addressing the security risk of electromagnetic emanations from electronic equipment. Countermeasures include shielding (Faraday cages), filtering, masking, and distance."}, {"t": "Cloud Security Architecture and Deployment Models", "d": "Cloud deployment models (public, private, hybrid, community) and service models (IaaS, PaaS, SaaS) create different security responsibilities. Understanding multi-tenancy risks and cloud-specific threats is essential."}, {"t": "Secure Boot and Trusted Platform Module (TPM)", "d": "Secure boot ensures only authorized software loads during startup. TPM provides hardware-based security functions including key storage, attestation, and integrity measurement. Together they establish trust from hardware up."}, {"t": "Industrial Control Systems and SCADA Security", "d": "ICS/SCADA systems control critical infrastructure (power, water, manufacturing). They have unique security challenges including legacy protocols, long lifecycles, and safety-critical requirements that differ from IT security."}, {"t": "Memory Protection Mechanisms", "d": "Memory protection prevents processes from accessing memory outside their allocated space. Key mechanisms include ASLR, DEP/NX, stack canaries, and bounds checking. These defenses mitigate buffer overflow attacks."}, {"t": "Database Encryption: TDE, Column-Level, and Application-Level", "d": "Databases can be encrypted at different granularities: Transparent Data Encryption (full database), column-level (specific sensitive fields), and application-level (encrypted before database storage). Each has different security and performance trade-offs."}, {"t": "Lattice-Based Access Control and Mandatory Access Control", "d": "Lattice models define mathematical upper and lower bounds for access control decisions. MAC enforces system-wide security policy based on classifications and clearances, not owner discretion."}, {"t": "Wireless Security Architecture and Protocols", "d": "Wireless networks require specific security architectures: 802.1X for enterprise authentication, EAP for flexible credential exchange, and proper encryption (WPA3) to protect data confidentiality over the air."}, {"t": "Clark-Wilson Integrity Model", "d": "The Clark-Wilson model enforces integrity through well-formed transactions and separation of duties. It uses constrained data items (CDIs), transformation procedures (TPs), and integrity verification procedures (IVPs)."}, {"t": "Common Criteria and Evaluation Assurance Levels", "d": "The Common Criteria (ISO 15408) provides an international framework for evaluating IT security products. Products are evaluated against Protection Profiles using Evaluation Assurance Levels (EAL1-7)."}, {"t": "Cryptographic Key Management Best Practices", "d": "Key management is often the weakest link in cryptographic systems. The key lifecycle includes generation, distribution, storage, use, rotation, archival, and destruction. HSMs provide hardware-protected key storage."}, {"t": "Physical Security Defense in Depth", "d": "Physical security uses concentric layers of controls from perimeter to interior. Each layer provides deterrence, detection, delay, and response. Understanding control placement and integration with logical security is essential."}, {"t": "Blockchain and Distributed Ledger Security", "d": "Blockchain provides an immutable, distributed ledger using cryptographic hashing and consensus mechanisms. Understanding security properties, vulnerabilities, and appropriate use cases is increasingly relevant."}, {"t": "Endpoint Detection and Response (EDR)", "d": "EDR solutions monitor endpoint activity in real-time, detect suspicious behavior, and enable rapid response. Understanding EDR capabilities, deployment, and how it complements traditional antivirus is essential."}, {"t": "Supply Chain Attacks and Third-Party Risk in Operations", "d": "Supply chain attacks target the weakest link in the chain of vendors, suppliers, and service providers. Third-party risk management requires due diligence, contractual protections, and continuous monitoring."}, {"t": "Quantum Computing and Post-Quantum Cryptography", "d": "Quantum computers threaten current cryptographic algorithms. RSA, ECC, and Diffie-Hellman are vulnerable to quantum attacks using Shor's algorithm. Post-quantum cryptography (PQC) develops quantum-resistant algorithms."}, {"t": "Zero Trust Architecture", "d": "Zero Trust eliminates implicit trust based on network location. Every access request is verified regardless of where it originates. NIST SP 800-207 defines the Zero Trust Architecture framework."}, {"t": "Virtualization Security", "d": "Virtualization introduces unique security challenges including hypervisor attacks, VM escape, VM sprawl, and inter-VM communication risks. Proper security requires hardening the hypervisor and controlling the virtual environment."}, {"t": "Elliptic Curve Cryptography Deep Dive", "d": "Elliptic Curve Cryptography (ECC) provides equivalent security to RSA with significantly smaller key sizes, making it ideal for mobile and IoT devices with limited resources."}, {"t": "Side-Channel Attacks and Countermeasures", "d": "Side-channel attacks extract secret information by analyzing physical characteristics of cryptographic implementations: timing, power consumption, electromagnetic emissions, and acoustic signals."}, {"t": "PKI Trust Models and Certificate Path Validation", "d": "PKI trust models define how entities establish trust in digital certificates. Models include hierarchical, mesh, bridge, and web of trust. Certificate path validation ensures the chain from entity to trust anchor is valid."}, {"t": "Ransomware Defense and Recovery", "d": "Ransomware defense requires a multi-layered strategy: prevention (patch, segment, train), detection (EDR, behavioral monitoring), and recovery (offline backups, tested restoration procedures). Paying ransom is discouraged."}], "review": [{"t": "PAIN", "d": "Privacy, Authentication, Integrity, Non-Repudiation — four goals of cryptography"}, {"t": "Kerckhoffs' Principle", "d": "Security should rely on key secrecy, not algorithm secrecy"}, {"t": "Symmetric Encryption", "d": "Same key; fast; keys needed = n(n-1)/2. Examples: AES, 3DES"}, {"t": "Asymmetric Encryption", "d": "Key pair (public/private); scalable but slow; keys = 2n. Examples: RSA, ECC"}, {"t": "Digital Signature", "d": "Hash encrypted with sender's private key — provides authentication, integrity, non-repudiation"}, {"t": "Bell-LaPadula", "d": "Confidentiality: No Read Up, No Write Down"}, {"t": "Biba", "d": "Integrity: No Read Down, No Write Up"}, {"t": "Clark-Wilson", "d": "Commercial integrity: CDIs, TPs, and Separation of Duties"}, {"t": "Zero Trust", "d": "Never trust, always verify. Assume breach. NIST SP 800-207."}, {"t": "Defense in Depth", "d": "Layered security — administrative, technical, physical controls"}, {"t": "FM-200", "d": "Clean agent fire suppression — safe for occupied spaces, replaced Halon"}, {"t": "TCB", "d": "Trusted Computing Base — totality of protection mechanisms enforcing security policy"}, {"t": "Common Criteria", "d": "ISO 15408 — replaced TCSEC. Uses EAL1-7, Protection Profiles, Security Targets, Target of Evaluation."}, {"t": "EAL", "d": "Evaluation Assurance Level 1-7. Higher = more rigorous evaluation, NOT necessarily more secure."}, {"t": "TCSEC", "d": "Orange Book. Ratings A1-D. Replaced by Common Criteria. Only evaluated confidentiality."}, {"t": "TPM", "d": "Trusted Platform Module — hardware chip for key storage, measured boot, platform integrity, remote attestation."}, {"t": "HSM", "d": "Hardware Security Module — tamper-resistant device for cryptographic operations and key management. FIPS 140-2 certified."}, {"t": "FIPS 140-2 Levels", "d": "L1=basic, L2=tamper-evident, L3=tamper-resistant (most common), L4=tamper-active with environmental protection."}, {"t": "Secure Boot", "d": "UEFI feature verifying cryptographic signatures of firmware/OS components during startup. Prevents rootkits."}, {"t": "State Machine Model", "d": "System secure in ALL states — secure start, secure transitions, secure end. Foundation for BLP/Biba."}, {"t": "Covert Storage Channel", "d": "Information transferred via shared storage resources. One process writes, another reads indirectly."}, {"t": "Covert Timing Channel", "d": "Information transferred via timing of system events. Modulating resource usage to signal data."}, {"t": "Non-Interference Model", "d": "High-security actions must have NO observable effect on low-security subjects."}, {"t": "Protection Rings", "d": "Ring 0 = kernel (most privileged), Ring 3 = user apps (least). Modern OSes use mainly 0 and 3."}, {"t": "Buffer Overflow", "d": "Writing beyond allocated memory bounds. Defenses: DEP/NX, ASLR, stack canaries, input validation."}, {"t": "ASLR", "d": "Address Space Layout Randomization — randomizes memory locations to prevent exploitation."}, {"t": "TOCTOU", "d": "Time of Check to Time of Use — race condition between security verification and resource usage."}, {"t": "VM Escape", "d": "Breaking out of VM to access hypervisor or other VMs. Most critical virtualization threat."}, {"t": "Type 1 vs Type 2 Hypervisor", "d": "Type 1 = bare-metal (more secure). Type 2 = hosted on OS (larger attack surface)."}, {"t": "ECB Mode", "d": "Electronic Codebook — NEVER use. Each block encrypted independently, patterns preserved."}, {"t": "GCM Mode", "d": "Galois/Counter Mode — authenticated encryption (AEAD). Gold standard. Used in TLS 1.3."}, {"t": "CBC Mode", "d": "Cipher Block Chaining — XOR with previous block. Sequential. Vulnerable to padding oracle."}, {"t": "X.509", "d": "Standard digital certificate format. Contains: subject, issuer, serial, validity, public key, signature."}, {"t": "CRL vs OCSP", "d": "CRL = periodic revocation list (can be stale). OCSP = real-time status check. OCSP stapling = server-side."}, {"t": "HMAC", "d": "Hash-based MAC — integrity + authentication using shared key. No non-repudiation (shared key)."}, {"t": "Salt", "d": "Random data added before hashing. Defeats rainbow tables. Each password should have unique salt."}, {"t": "bcrypt/PBKDF2/Argon2", "d": "Key stretching algorithms for password hashing. Slow by design. Never use raw SHA-256 for passwords."}, {"t": "Birthday Attack", "d": "Hash collision found in ~2^(n/2) operations for n-bit hash. Why SHA-1 (160-bit) is deprecated."}, {"t": "Known Plaintext Attack", "d": "Attacker has some plaintext-ciphertext pairs. Analyzes relationship to find the key."}, {"t": "Side-Channel Attack", "d": "Exploits physical implementation: timing, power, EM emissions, cache. Spectre/Meltdown examples."}, {"t": "Pre-action Sprinkler", "d": "Best water-based system for data centers. Requires two triggers (smoke + heat). Prevents accidental discharge."}, {"t": "CPTED", "d": "Crime Prevention Through Environmental Design — natural surveillance, access control, territorial reinforcement."}, {"t": "UPS vs Generator", "d": "UPS = battery backup (minutes). Generator = extended power (hours/days). Both needed for full protection."}, {"t": "TEMPEST", "d": "Protection against electromagnetic emanation eavesdropping. Faraday cage blocks emissions."}, {"t": "IoT Security", "d": "Challenges: default creds, limited crypto, long lifecycle. Controls: segment network, cert auth, secure boot."}, {"t": "SCADA/ICS", "d": "Industrial control systems. Safety-critical. Air-gap from corporate. Legacy protocols (Modbus, DNP3)."}, {"t": "SOA/Microservices", "d": "SOA=SOAP/WS-Security. Microservices=many endpoints, mTLS, JWT, large attack surface."}, {"t": "Serverless Security", "d": "CSP manages infrastructure. You manage code + IAM. No persistent server. Granular function permissions."}, {"t": "Key Management Lifecycle", "d": "Generate, Distribute, Store, Use, Rotate, Revoke, Archive, Destroy. More important than algorithm choice."}, {"t": "Brewer-Nash (Chinese Wall)", "d": "Prevents conflicts of interest by dynamically restricting access based on previous access."}, {"t": "Lattice Model", "d": "Mathematical model defining security levels with upper/lower bounds. Formalizes information flow."}, {"t": "Certificate Pinning", "d": "Application stores expected cert/key — rejects others even if from trusted CA. Prevents CA compromise."}, {"t": "Graham-Denning", "d": "8 primitive protection operations for subjects/objects. Formal access control model."}, {"t": "HRU Model", "d": "Harrison-Ruzzo-Ullman — proves general access control is undecidable."}, {"t": "Cloud Shared Responsibility", "d": "IaaS = customer secures most. PaaS = shared. SaaS = provider secures most. Customer always owns data."}, {"t": "CASB", "d": "Cloud Access Security Broker — visibility into cloud usage, DLP, shadow IT discovery."}, {"t": "CSPM", "d": "Cloud Security Posture Management — monitors cloud configs for misconfigurations."}, {"t": "CWPP", "d": "Cloud Workload Protection — secures VMs, containers, serverless workloads."}, {"t": "PQC Algorithms", "d": "CRYSTALS-Kyber (key exchange), CRYSTALS-Dilithium (signatures). Counter quantum threat."}, {"t": "Shor's Algorithm", "d": "Quantum algorithm breaking RSA/ECC in polynomial time. Drives PQC migration."}, {"t": "Grover's Algorithm", "d": "Quantum algorithm halving symmetric key strength. AES-256 → 128-bit security vs quantum."}, {"t": "Crypto Agility", "d": "Design systems to easily swap algorithms. Essential for PQC migration."}, {"t": "DPA/SPA", "d": "Differential/Simple Power Analysis — extract crypto keys by measuring power consumption."}, {"t": "Cold Boot Attack", "d": "Recover encryption keys from RAM by cooling memory chips after power-off."}, {"t": "Rowhammer", "d": "Flip memory bits via repeated DRAM row access. Enables privilege escalation."}, {"t": "Spectre/Meltdown", "d": "CPU cache side-channel attacks. Cross-process memory read. Required firmware + OS patches."}, {"t": "Hybrid Encryption", "d": "Asymmetric encrypts symmetric key, symmetric encrypts data. Best of both worlds."}, {"t": "Diffie-Hellman", "d": "Key exchange over insecure channel. Vulnerable to MITM. Use authenticated DH (DHE-RSA)."}, {"t": "ECC", "d": "Elliptic Curve Cryptography. Shorter keys for same security: ECC-256 ≈ RSA-3072."}, {"t": "AES Key Sizes", "d": "AES-128 (10 rounds), AES-192 (12 rounds), AES-256 (14 rounds). All three approved by NIST."}, {"t": "Reference Monitor", "d": "Abstract concept: tamper-proof, always invoked, verifiable. Security kernel is its implementation."}, {"t": "TCB", "d": "Trusted Computing Base — all hardware/firmware/software enforcing security policy. Minimize for security."}, {"t": "Trusted Path", "d": "Tamper-proof communication between user and TCB. Example: Ctrl+Alt+Del for Windows login."}, {"t": "Formal Verification", "d": "Mathematical proof that system design correctly implements security policy. EAL7 requires this."}, {"t": "Microkernel", "d": "Minimal kernel — moves services to user space. Smaller TCB = more verifiable and secure."}, {"t": "AES Operations", "d": "SubBytes (confusion), ShiftRows (diffusion), MixColumns (diffusion), AddRoundKey. Per round."}, {"t": "RSA", "d": "Based on factoring large primes. Encrypt with public, sign with private. Keys: 2048+ minimum."}, {"t": "DSA", "d": "Digital Signature Algorithm — signatures ONLY, cannot encrypt. NIST standard."}, {"t": "ECDSA/EdDSA", "d": "Elliptic Curve Digital Signatures. Smaller signatures. Ed25519 is modern standard."}, {"t": "Forward Secrecy", "d": "Compromising long-term key does not compromise past sessions. Use ephemeral keys (ECDHE)."}, {"t": "ChaCha20", "d": "Stream cipher alternative to AES. Used in TLS 1.3. Faster in software than AES without hardware acceleration."}, {"t": "Saltzer & Schroeder", "d": "8 design principles: Economy of mechanism, Least privilege, Complete mediation, Open design, Separation of privilege, Fail-safe defaults, Psychological acceptability, Least common mechanism."}, {"t": "Economy of Mechanism", "d": "Keep design simple. Complexity introduces bugs and vulnerabilities."}, {"t": "Complete Mediation", "d": "Check EVERY access request — no bypass paths. Related to reference monitor concept."}, {"t": "Code Signing", "d": "Digital signature on software. Verifies integrity and publisher. Uses developer's private key."}, {"t": "Timestamping", "d": "Proves signature was created at specific time. Valid even after signing cert expires."}, {"t": "Nonce", "d": "Number used once. Prevents replay attacks. Essential for challenge-response and cryptographic protocols."}, {"t": "IV (Initialization Vector)", "d": "Random value used with key for first block. Must be unique per encryption. WEP's 24-bit IV was too short."}, {"t": "Key Escrow", "d": "Trusted third party holds copy of encryption key. Clipper chip was controversial example."}], "formulas": ["Key Space = 2^n where n is key length in bits", "Symmetric keys needed = n(n-1)/2", "Asymmetric keys needed = 2n", "AES block = 128 bits; keys = 128/192/256 bits", "Work factor = effort to break a cipher (time, cost, resources)", "RSA minimum key size: 2048 bits (NIST recommendation)", "ECC 256-bit ≈ RSA 3072-bit security equivalence", "Digital Signature: Hash(message) → Encrypt(hash, sender private key)", "Verify: Decrypt(signature, sender public key) → Compare(hash)", "Symmetric speed: 1,000-10,000x faster than asymmetric", "Zero Trust = Never Trust + Always Verify + Assume Breach", "Defense in Depth = Administrative + Technical + Physical layers", "NIST SP 800-207 = Zero Trust Architecture standard", "Control Plane (PDP) + Data Plane (PEP) = ZTA enforcement", "MD5 = 128-bit digest (BROKEN)", "SHA-1 = 160-bit digest (BROKEN)", "SHA-256 = 256-bit digest (current standard)", "HMAC = Hash(secret key + message) — integrity + authentication", "Birthday attack: probability of collision in 2^(n/2) attempts for n-bit hash", "Fence: 3-4 ft = deter casual, 6-7 ft = hard to climb, 8+ ft = determined intruder", "Temperature: 64-75°F (18-24°C) | Humidity: 40-60%", "UPS = short-term (15-30 min) | Generator = long-term", "Fire classes: A=ordinary, B=liquid, C=electrical, D=metal, K=kitchen", "Symmetric keys needed: n(n-1)/2 for n users", "Asymmetric keys needed: 2n for n users", "Key stretching: PBKDF2/bcrypt/scrypt/Argon2 — adds computational cost to password hashing", "ECC 256-bit = RSA 3072-bit security equivalence", "Grover's algorithm: AES-256 → 128-bit effective security against quantum", "Shor's algorithm: breaks RSA, ECC, DH in polynomial time on quantum computers", "Brute force time = 2^(key_length) operations", "Birthday attack collision = ~2^(n/2) for n-bit hash", "Rainbow table defense = salted hashes", "HMAC = Hash(key || message) — integrity + authentication", "Digital Signature = Encrypt(Hash(message), private_key) — adds non-repudiation", "Birthday attack: need 2^80 operations for SHA-1 (160/2) — feasible; need 2^128 for SHA-256 — infeasible", "ECC equivalence: ECC-256 ≈ RSA-3072 ≈ AES-128", "RSA: Encrypt with public key (privacy), Sign with private key (authentication)", "Symmetric keys needed: n(n-1)/2 for n participants", "Asymmetric keys needed: 2n for n participants", "ECC 256-bit ≈ RSA 3072-bit ≈ AES 128-bit (equivalent security)"], "aids": ["PAIN = Privacy, Authentication, Integrity, Non-Repudiation", "Symmetric = Same key = Speed; Asymmetric = A pair = Always scalable but slow", "One-Time Pad: Random, Right length, wRite once, pRotect (4 Rs)", "Confusion = Substitution; Diffusion = transPosition", "RSA = Ron Rivest, Adi Shamir, Leonard Adleman — factoring primes", "ECC = Elliptic Curve = Efficient (shorter keys, same security)", "DH = Door Handle — opens the channel but does not verify who is on the other side", "Sign with Private, Verify with Public — \"SiP ViP\"", "BLP: \"Bell Locks Peeping\" — protects confidentiality", "Biba: \"Biba Is Better At integrity\"", "BLP: \"No Read Up, No Write Down\" = NRUND", "Biba: \"No Read Down, No Write Up\" = NRDNU", "Clark-Wilson: \"CDI + TP + SoD = Commercial Integrity\"", "Defense in Depth = \"Layers Like an Onion\"", "Fail-Secure = \"Shut the door\" | Fail-Open = \"Open the door\"", "Least Privilege = \"Just enough, just in time\"", "Zero Trust = \"Never trust, always verify\" — ABC: Assume Breach, verify Continuously", "Saltzer & Schroeder principles: ELCO-PS — Economy, Least privilege, Complete mediation, Open design, Psychological acceptability, Separation", "Hash properties: \"DOCA\" — Deterministic, One-way, Collision-resistant, Avalanche", "MD5 and SHA-1: \"MuSt Die\" — both are broken", "CRL = Comes Really Late; OCSP = Online Checks Swiftly and Promptly", "Salt prevents Rainbow tables — \"Salt the Rainbow\"", "Power problems: \"Bro, Sagging Spikes Surge Noisily In Blackouts\"", "Fire suppression: \"Wet is Fastest, Pre-action is Protective, FM-200 is Friendly\"", "CPTED: \"Natural SAT\" — Surveillance, Access control, Territoriality", "Key lifecycle: \"Good Dogs Stay Until Retired, Rarely Destroyed\" — Generate, Distribute, Store, Use, Rotate, Revoke, Destroy", "CRL vs OCSP: \"CRL = Catalog (periodic list), OCSP = Online (real-time check)\"", "Split knowledge: \"No one person has the whole picture\"", "ECC advantage: \"Elliptic = Efficient — small keys, same security\"", "Quantum threats: \"Shor Shores up asymmetric attacks, Grover Grinds symmetric strength\"", "Post-quantum: \"Lattice Locks out quantum — CRYSTALS are the future\"", "TCSEC levels: \"A Brilliant Computer Does security\" — A, B, C, D (highest to lowest)", "CC components: \"PP Sets the Standard, ST Shows the Target, TOE is Tested\" — PP, ST, TOE", "EAL: \"Every Assurance Level increases rigor, not security\"", "Reference monitor: \"TAV\" — Tamper-proof, Always invoked, Verifiable", "TPM: \"Trust the Platform Module\" — measures boot integrity", "HSM: \"Hardware Secures Master keys\" — dedicated crypto device", "FIPS 140 levels: \"Basic, Evidence, Resistant, Active\" — 1, 2, 3, 4", "State machine: \"Secure Start, Secure Steps, Secure Stop\"", "Covert channels: \"Storage Shares data, Timing Ticks data\"", "Non-interference: \"No Influence seen — NI model\"", "Rings: \"Ring 0 Rules, Ring 3 Runs apps\" — privilege decreases with ring number", "Memory defenses: \"DAN\" — DEP, ASLR, NX bit — all fight buffer overflows", "TOCTOU: \"Time Of Check vs Time Of Use — the gap is the vulnerability\"", "Type 1 = \"Bare metal = Better security\" (no host OS to attack)", "Type 2 = \"Two layers = Two attack surfaces\" (host OS + hypervisor)", "VM escape: \"VM Exits to access the hyperVisor = Most serious threat\"", "Attack ained resources, Patch challenges, Long lifecycles", "IoT controls: \"SCSM\" — Segment network, Certificate auth, Secure boot, Monitor behavior", "SCADA: \"Safety Critical Always Deserves Air-gapping\"", "Security models: \"BLC-G\" — Bell-LaPadula (confidentiality), Lattice (mathematical), Chinese Wall (conflict of interest), Graham-Denning (operations)", "Chinese Wall: \"See A, Can't see A's competitor\" — dynamic conflict of interest", "Cloud responsibility: \"Pizza analogy\" — IaaS = you cook (most work), PaaS = you add toppings, SaaS = you eat (least work)", "Cloud security tools: \"CASB = See, CSPM = Configure, CWPP = Protect\"", "Deprecated crypto: \"DM SR3\" — DES, MD5, SHA-1, RC4, 3DES (all broken or deprecated)", "PQC algorithms: \"Kyber Key, Dilithium signs\" — CRYSTALS-Kyber for key exchange, CRYSTALS-Dilithium for signatures", "Side-channel types: \"TPEC-ACR\" — Timing, Power, EM, Cache, Acoustic, Cold boot, Rowhammer", "TEMPEST: \"Transient Electromagnetic Pulse Emanation STandard\" — EM shielding", "TCB: \"Trusted Computing Base = everything that enforces security policy\"", "AES operations: \"SSMA\" — SubBytes, ShiftRows, MixColumns, AddRoundKey", "Key equivalence: \"ECC 256 = RSA 3072 = AES 128\" — remember the ratios", "Design principles: \"ELCOSFLP\" — Economy, Least privilege, Complete mediation, Open design, Separation, Fail-safe, Least common, Psychological acceptability", "Key principle: \"Simple, Minimal, Verify All, Default Deny\"", "Signing: \"Private Signs, Public Verifies\" — opposite of encryption", "Signature goals: \"AIN\" — Authentication, Integrity, Non-repudiation (no Confidentiality)", "Hash evolution: \"MD5=Broken, SHA-1=Sunset, SHA-2=Standard, SHA-3=Standby\"", "HMAC vs Digital Signature: \"HMAC = shared key (no non-repudiation), Signature = private key (non-repudiation)\"", "PKI components: \"CRROC\" — CA, RA, Repository, OCSP, CRL", "Certificate lifecycle: \"GEIDUR-R\" — Generate, Enroll, Issue, Distribute, Use, Renew, Revoke", "Hypervisor types: \"Type 1 = Bare (Better), Type 2 = On top of OS (Okay)\"", "Container security: \"MSNRS\" — Minimal images, Scan vulnerabilities, Network policies, Run non-root, Sign images", "Purdue levels: \"0=Process, 1=Control, 2=Supervise, 3=Operations, DMZ, 4=IT, 5=Internet\"", "ICS priorities: \"OT = ASC (Availability, Safety, Confidentiality) — opposite of IT CIA\"", "Physical control types: \"DPDC\" — Deterrent, Preventive, Detective, Compensating", "CPTED principles: \"SATR\" — Surveillance (natural), Access control (natural), Territorial reinforcement", "IoT attack surface: \"DCFPS\" — Default credentials, Communications (unencrypted), Firmware (insecure), Physical access (debug ports), Supply chain", "IoT security controls: \"BUSNED\" — Boot (secure), Updates (signed), Segmentation, Network encryption, Every device inventoried, Default credentials changed", "Site selection: \"DNCUT\" — Disaster risk, Neighborhood, Crime, Utilities, Transportation", "Data center design: \"RHCWS\" — Raised floor, Hot/cold aisle, Cable management, Water detection, Seismic bracing", "Attack knowledge: \"CKKCC\" — Ciphertext-only, Known-plaintext, Known-chosen, Chosen-plaintext, Chosen-ciphertext", "Side channels: \"TPECF\" — Timing, Power, Electromagnetic, Cache, Fault injection", "PQC families: \"LHCS\" — Lattice (Kyber/Dilithium), Hash-based (SPHINCS+), Code-based, Supersingular isogeny", "Quantum impact: \"Shor breaks asymmetric, Grover weakens symmetric (double key length)\"", "Fire Triangle: \"HOP\" — Heat, Oxygen, Fuel. Remove any one.", "Safe agents: \"FNI\" — FM-200, Novec 1230, Inert gas (safe for people). CO2 = KILLS.", "BLP: \"No Read Up, No Write Down\" (WURD = Write Up, Read Down — what is ALLOWED)", "Biba: \"No Read Down, No Write Up\" (BRUP = Biba Reads Up)", "EAL levels: \"Formally Structured Methods Make Security Semi-Formally Formal\" — 1-Functionally, 2-Structurally, 3-Methodically, 4-Methodically designed, 5-Semi-formally, 6-Semi-formally verified, 7-Formally verified"]}, {"code": "CNS", "name": "Communication and Network Security", "weight": "13", "topics": [{"t": "OSI and TCP/IP Models in Depth", "d": "OSI has 7 layers; TCP/IP has 4 layers. Each layer has specific protocols, data units, and devices. Encapsulation adds headers going down; decapsulation removes them going up. Understanding layer mapping is essential for attack identification and device placement."}, {"t": "Network Attacks: DDoS, MITM, DNS Poisoning", "d": "DDoS floods targets with traffic from botnets. MITM intercepts communications between two parties. DNS poisoning corrupts name resolution to redirect traffic. ARP spoofing redirects local traffic. Each attack targets specific layers and has specific countermeasures."}, {"t": "Firewall Types and Generations", "d": "1st gen: Packet filter (stateless, L3). 2nd gen: Application proxy (L7, most secure, slowest) and Circuit-level (L5, SOCKS). 3rd gen: Stateful (L3-4, tracks connections). NGFW: multi-function (IDS/IPS, TLS inspection, application awareness)."}, {"t": "Wireless Security: WPA3, EAP, and Enterprise Authentication", "d": "WEP is broken (24-bit IV, RC4). WPA2 uses AES-CCMP. WPA3 adds SAE (Dragonfly) for forward secrecy and offline attack resistance. Enterprise wireless uses 802.1X with EAP variants (PEAP, EAP-TLS). Rogue APs and evil twins are primary wireless threats."}, {"t": "Network Segmentation, VLANs, and Micro-segmentation", "d": "Network segmentation divides networks into zones to limit lateral movement. VLANs provide logical separation at Layer 2. DMZ isolates public-facing services. Micro-segmentation applies granular policies to individual workloads. SDN separates control and data planes for programmable security."}, {"t": "VPN Technologies: IPsec, SSL/TLS, and Tunneling Protocols", "d": "VPNs create encrypted tunnels over untrusted networks. IPsec operates at Layer 3 (AH for integrity, ESP for encryption), SSL/TLS VPNs operate at Layer 4-7. Key protocols include IKE for key exchange, and tunneling modes (transport vs tunnel)."}, {"t": "Email Security Protocols: S/MIME, DKIM, SPF, DMARC", "d": "Email security uses layered protocols: S/MIME and PGP for end-to-end message encryption and signing, SPF validates sender IP, DKIM adds cryptographic signatures to messages, and DMARC ties them together with policy enforcement."}, {"t": "DNS Security: DNSSEC, DoH, DoT, and DNS Attacks", "d": "DNS is critical infrastructure vulnerable to cache poisoning, DNS tunneling, and hijacking. DNSSEC adds digital signatures. DNS over HTTPS (DoH) and DNS over TLS (DoT) encrypt DNS queries. DNS is the \"phonebook of the internet.\""}, {"t": "Content Delivery Networks (CDN) and Edge Security", "d": "CDNs distribute content across global edge servers for performance and DDoS protection. They also provide WAF, bot management, and TLS termination. CDNs introduce security considerations around cache poisoning, origin protection, and SSL/TLS management."}, {"t": "Network Access Control (NAC) and 802.1X", "d": "NAC verifies device compliance before granting network access. 802.1X provides port-based authentication using EAP. NAC checks device health (patches, antivirus, encryption) and quarantines non-compliant devices."}, {"t": "Network Device Security: Routers, Switches, and Load Balancers", "d": "Network infrastructure devices must be hardened: disable unnecessary services, use encrypted management protocols, implement access control lists, and monitor for unauthorized changes. Each device type has specific security considerations."}, {"t": "Converged Protocols and Voice/Video Security", "d": "Converged networks carry data, voice, and video on a single infrastructure. VoIP security concerns include eavesdropping, toll fraud, and DoS. Protocols include SIP, H.323, SRTP. Converged networks require QoS, VLAN separation, and encryption."}, {"t": "Software-Defined Networking (SDN) and Network Function Virtualization (NFV)", "d": "SDN separates the control plane from the
