 vs Uncredentialed Scan", "d": "Credentialed = deeper, more accurate (logs in). Uncredentialed = external view, less thorough."}, {"t": "Internal vs External Audit", "d": "Internal = own staff (must be independent). External = third party (higher assurance)."}, {"t": "Audit Evidence", "d": "Documentary, Testimonial, Observational, Analytical — must be sufficient, reliable, relevant."}, {"t": "IAST", "d": "Interactive testing — agents inside app observe runtime + code. Combines SAST + DAST. Lowest false positives."}, {"t": "SCA", "d": "Software Composition Analysis — finds vulnerabilities in third-party/open-source libraries."}, {"t": "MTTD", "d": "Mean Time to Detect — average time to identify a security incident. Lower = better."}, {"t": "MTTR", "d": "Mean Time to Respond/Remediate — average time to contain/fix. Lower = better."}, {"t": "NIST SP 800-137", "d": "Information Security Continuous Monitoring (ISCM) — real-time security posture visibility."}, {"t": "CDM", "d": "Continuous Diagnostics and Mitigation — DHS program: what/who is on network, what happens, data protection."}, {"t": "Regression Testing", "d": "Re-testing after changes to ensure fixes do not introduce new issues."}, {"t": "V-Model Testing", "d": "Unit → Integration → System → Acceptance testing levels."}, {"t": "Bug Bounty", "d": "Inviting external researchers to find vulnerabilities for rewards. Defined scope and rules."}, {"t": "QSA", "d": "Qualified Security Assessor — performs PCI-DSS audits for large merchants."}, {"t": "SAQ", "d": "Self-Assessment Questionnaire — PCI-DSS self-evaluation for smaller merchants."}, {"t": "EPSS", "d": "Exploit Prediction Scoring System — predicts likelihood of vulnerability exploitation in the wild."}, {"t": "ASV", "d": "Approved Scanning Vendor — PCI-DSS quarterly external vulnerability scanning."}, {"t": "Gap Analysis", "d": "Compare current state to requirements — identifies deficiencies needing remediation."}, {"t": "Pair Programming", "d": "Continuous code review — driver writes, navigator reviews in real-time."}, {"t": "Mutation Fuzzing", "d": "Dumb fuzzing — random modifications to valid input. Less thorough than generational."}, {"t": "Synthetic Transactions", "d": "Scripted test transactions in production — detect failures before users do."}, {"t": "FAIR", "d": "Factor Analysis of Information Risk — quantitative risk analysis framework."}, {"t": "KPI vs KRI", "d": "KPI = performance (how well). KRI = risk (early warning of increasing risk)."}, {"t": "Leading Indicator", "d": "Predicts future (proactive — training completion rate). Lagging = reports past (incidents)."}, {"t": "DR Test Types", "d": "Checklist → Tabletop → Walkthrough → Simulation → Parallel → Full-interruption (increasing disruption)."}, {"t": "Parallel Test", "d": "DR site processes real data while production stays up — validates recovery without risk."}, {"t": "Full-Interruption", "d": "Production shuts down, DR site takes over — most thorough but riskiest test."}, {"t": "SOAR", "d": "Security Orchestration, Automation, Response — automated playbooks extending SIEM capabilities."}, {"t": "Log Retention", "d": "PCI-DSS = 1 year. SOX = 7 years. Always check regulatory requirements."}, {"t": "Attestation", "d": "Formal statement of opinion by auditor about control effectiveness."}, {"t": "Management Assertion", "d": "Claim by management that controls are designed and operating effectively — auditors test these."}, {"t": "BAS", "d": "Breach and Attack Simulation — automated attack simulation to test control effectiveness continuously."}, {"t": "Purple Team", "d": "Red + Blue team collaboration — systematically test and improve detection for each ATT&CK technique."}, {"t": "ASVS", "d": "Application Security Verification Standard (OWASP) — L1 automated, L2 standard, L3 critical apps."}, {"t": "PTES", "d": "Penetration Testing Execution Standard — 7 phases from pre-engagement through reporting."}, {"t": "OSSTMM", "d": "Open Source Security Testing Methodology Manual — quantifiable security testing with RAV score."}, {"t": "GRC Platform", "d": "Governance, Risk, Compliance — centralized compliance tracking (RSA Archer, ServiceNow GRC, OneTrust)."}, {"t": "NIST 800-137", "d": "Information Security Continuous Monitoring — ongoing security posture awareness framework."}, {"t": "Continuous Authorization", "d": "Replace periodic ATO with ongoing monitoring data supporting real-time authorization decisions."}], "formulas": ["SOC 1 = financial controls (ICFR)", "SOC 2 = Trust Services Criteria (Security + optional: APCIP)", "SOC 3 = public summary of SOC 2", "Type I = point-in-time design | Type II = period effectiveness (6-12 months)", "VA: Identify vulnerabilities → CVSS scoring → remediation priority", "Pen Test: Plan → Discover → Attack → Report → Clean up", "White box = full knowledge (most thorough)", "Black box = zero knowledge (most realistic)", "Grey box = partial knowledge (balanced)", "SAST = Static = Source code analysis = white-box = finds buffer overflows", "DAST = Dynamic = Runtime testing = black-box = finds SQLi, XSS", "IAST = Instrumented = SAST + DAST combined", "Fagan: Planning → Overview → Preparation → Inspection → Rework → Follow-up", "CVE = vulnerability naming | CVSS = severity scoring 0-10", "CVSS Critical ≥ 9.0 | High 7.0-8.9 | Medium 4.0-6.9 | Low 0.1-3.9", "SCAP: CVE + CVSS + CCE + CPE + XCCDF + OVAL", "SIEM = Aggregate + Normalize + Correlate + Alert", "Mutation fuzzing: Valid input → random modifications → crash detection", "Generational fuzzing: Data model → structured invalid inputs → deeper bugs", "Coverage-guided: Instrument code → track paths → mutate for new coverage", "Synthetic transaction: Script → execute → compare actual vs expected", "SOC 1: Financial reporting controls | SOC 2: Trust Services Criteria | SOC 3: Public summary", "Type I: Design at a point in time | Type II: Design + effectiveness over 6-12 months", "Trust Services Criteria: Security (mandatory) + Availability + Processing Integrity + Confidentiality + Privacy"], "aids": ["\"TAA: Test one, Assess all, Audit formally\"", "\"SOC 2 Type 2 = Two Ts of Trust\" — most comprehensive", "Trust Services: \"SAPCP\" — Security, Availability, Processing Integrity, Confidentiality, Privacy", "\"Big 4 = DEKP\" — Deloitte, EY, KPMG, PwC", "\"VA = View All weaknesses, Pen Test = Prove The impact\"", "\"White sees all, Grey sees some, Black sees none\"", "\"Red attacks, Blue defends, Purple improves together\"", "\"Rules of engagement BEFORE engagement\" — authorization first", "\"Static is Still (code not running), Dynamic is Dancing (app is running)\"", "\"SAST Sees Source, DAST Detects Deployment issues\"", "\"POPIR-F\" = Planning, Overview, Preparation, Inspection, Rework, Follow-up", "\"Fagan Finds Flaws Formally\" — most rigorous code review", "\"CVE = Common Vulnerability Enumeration (names), CVSS = Scoring System (numbers)\"", "\"X-Mas tree has all lights: FIN, PSH, URG\" (for network scanning)", "SCAP components: \"Vulnerabilities (CVE) Scored (CVSS) on Configs (CCE) and Platforms (CPE) using Checklists (XCCDF) and Tests (OVAL)\"", "SIEM: \"See Everything In Minutes\" — aggregates and correlates", "\"Mutation is Mindless, Generational is Genius\"", "\"Dumb fuzz = random mess, Smart fuzz = structured stress\"", "\"Synthetic = Simulated user, always watching\"", "\"AFL = American Fuzzy Lop = coverage-guided fuzzer\"", "SOC types: \"1=Financial, 2=Five criteria, 3=For the public\"", "Type I vs II: \"I = Instant snapshot, II = In operation over Time\"", "TSC: \"SAPCP\" — Security, Availability, Processing Integrity, Confidentiality, Privacy", "ISO: \"27001 = One standard to certify, 27002 = Two guides to follow\"", "Pen test types: \"White = Wide open knowledge, Gray = Got some info, Black = Blind\"", "PTES phases: \"PITVEP-R\" — Pre-engagement, Intelligence, Threat modeling, Vulnerability, Exploitation, Post-exploitation, Reporting", "Teams: \"Red Rips, Blue Blocks, Purple Partners\"", "VM lifecycle: \"ASPRVR\" — Asset discovery, Scan, Prioritize, Remediate, Verify, Report", "CVSS ranges: \"NLMHC\" — None, Low, Medium, High, Critical (0, 0.1-3.9, 4-6.9, 7-8.9, 9-10)", "Audit process: \"PFARF\" — Plan, Fieldwork, Analysis, Report, Follow-up", "Audit independence: \"Never audit your own boss\"", "Evidence types: \"DTOA\" — Documentary, Testimonial, Observational, Analytical", "SCAP components: \"CVE scores CVSS, CCE configs CPE, XCCDF formats OVAL\"", "CVSS scores: \"BTE\" — Base (inherent), Temporal (changes over time), Environmental (your context)", "Testing levels: \"UISA\" — Unit, Integration, System, Acceptance", "Security testing: \"SDDIS\" — SAST (static), DAST (dynamic), IAST (interactive), SCA (composition)", "Fuzzing: \"Mutation Modifies, Generation Generates from models\"", "Key metrics: \"MMPVF\" — MTTD, MTTR, Patch compliance, Vulnerability aging, False positive rate", "Good metrics: \"AMRT\" — Actionable, Measurable, Relevant, Timely", "ISCM process: \"DEIARE\" — Define, Establish, Implement, Analyze, Respond, Review", "CDM questions: \"What is, Who is, What happens, How protected\" — four capabilities", "Fagan phases: \"POPIR-F\" — Planning, Overview, Preparation, Inspection, Rework, Follow-up", "Testing spectrum: \"SAST inside, DAST outside, IAST both sides, SCA third-party rides\"", "Pen test phases: \"PRSEP-R\" — Plan, Recon, Scan, Exploit, Post-exploit, Report", "Test knowledge: \"BWG\" — Black (zero), White (full), Gray (partial)", "Team colors: \"Red attacks, Blue defends, Purple collaborates, White manages\"", "Key metrics: \"MTTD = how fast we DETECT, MTTR = how fast we RESPOND\"", "Indicator types: \"Leading = Looking ahead, Lagging = Looking behind\"", "SIEM functions: \"ANCA\" — Aggregate, Normalize, Correlate, Alert", "Log sources: \"NSEIC\" — Network, Servers, Endpoints, Identity, Cloud", "Vuln management: \"DPRVR\" — Discover, Prioritize, Remediate, Verify, Report", "CVSS components: \"BTE\" — Base (inherent), Temporal (time-varying), Environmental (your context)", "Audit parties: \"1st = Me, 2nd = My vendor, 3rd = Neither (independent)\"", "Compliance cycle: \"ATRAR\" — Assess, Test, Report, Address findings, Reassess", "BCP test escalation: \"Can The Walrus Sing Perfectly? Fully!\" — Checklist, Tabletop, Walkthrough, Simulation, Parallel, Full-interruption", "Post-test: \"DULT\" — Document results, Update plans, Lessons learned, Track remediation", "Threat models: \"SPOV\" — STRIDE (threats), PASTA (risk), OCTAVE (org), VAST (agile)", "Attack surfaces: \"NSH\" — Network (ports/APIs), Software (inputs/handlers), Human (phishing/social engineering)", "Testing spectrum: \"Control test → BAS → Pen test → Red team\" — increasing realism and scope", "Sharing standards: \"STIX describes, TAXII transports\" — format and transport", "TLP: \"Red = Restricted, Amber = Ambit (limited), Green = Group (community), White = World (public)\"", "Interface tests: \"AAIEB\" — Authentication, Authorization, Input validation, Error handling, Boundary testing", "Misuse case: \"Think like an attacker — how would I break this?\"", "Report structure: \"EMDA\" — Executive summary, Methodology, Detailed findings, Appendices", "Finding elements: \"DEAIR\" — Description, Evidence, Affected systems, Impact, Remediation", "Assessment escalation: \"Questionnaire → Certification review → Remote assessment → On-site audit\"", "Vendor assurance docs: \"SOC reports, ISO certs, PCI AoC, pen test summaries\"", "Evidence types: \"TDAP\" — Testimonial (said), Documentary (written), Analytical (computed), Physical (observed)", "Evidence qualities: \"SRR\" — Sufficient (enough), Relevant (related), Reliable (trustworthy)", "CSM components: \"VCNUT\" — Vulnerability scanning, Configuration monitoring, Network monitoring, User activity, Threat intel", "CSM cycle: \"Collect → Analyze → Alert → Report → Improve\"", "Testing levels: \"UISA\" — Unit (function), Integration (components), System (whole app), Acceptance (user)", "Security testing types: \"FMRN\" — Fuzz (random input), Mutation (code changes), Regression (re-test), Negative (bad input)", "Framework comparison: \"NIST=Numbers (comprehensive), ISO=International, CIS=Critical (prioritized), COBIT=Corporate (governance)\"", "CIS Implementation Groups: \"IG1=Everyone, IG2=IT teams, IG3=Security teams\"", "Attack surfaces: \"NSPH\" — Network (ports/services), Software (code/APIs), Physical (facilities), Human (social engineering)", "Reduction strategy: \"CRSDA\" — Close ports, Remove services, Segment networks, Disable defaults, Apply least functionality", "Bug bounty types: \"PVP\" — Private (invite only), VDP (no money), Public (everyone)", "CVD timeline: \"Report → Acknowledge → Fix → Disclose (90 days)\"", "Assessment methods (NIST): \"TEI\" — Testing (hands-on), Examination (review), Interviewing (discuss)", "Compliance frameworks: \"PHS-GC\" — PCI DSS, HIPAA, SOX, GDPR, CCPA", "Breach notification deadlines: \"GDPR=72hrs, HIPAA=60days, state laws=varies\"", "Maturity levels: \"IRDMO\" — Initial, Repeatable, Defined, Managed, Optimizing", "Effectiveness testing: \"BPR\" — BAS (automated), Purple team (collaborative), Red team (adversarial)", "Forensic types: \"DMNM\" — Disk, Memory, Network, Mobile", "Evidence handling: \"ICHWS\" — Image (copy), Chain of custody, Hash verify, Write-block, Secure storage"]}, {"code": "SOP", "name": "Security Operations", "weight": "13", "topics": [{"t": "Foundational Security Operations", "d": "Permission (access object) + Rights (take action) = Privilege. Need to Know = data access. Least Privilege = system privileges. SoD = preventive (prevents fraud). Job Rotation = detective (detects fraud). Mandatory Vacation = detective."}, {"t": "Incident Response: NIST SP 800-61", "d": "NIST 800-61 defines four phases: Preparation → Detection & Analysis → Containment, Eradication & Recovery → Post-Incident Activity. The organization's 7-step model: Detect → Respond → Mitigate → Report → Recover → Remediate → Lessons Learned. Only designated spokesperson communicates with media."}, {"t": "Digital Forensics and Evidence Handling", "d": "Digital forensics follows: Identify → Preserve → Collect → Examine → Analyze → Report. Chain of custody documents who handled evidence and when. Volatile evidence (RAM, cache) must be collected first. Legal hold preserves ESI. Four evidence types: real, documentary, testimonial, demonstrative."}, {"t": "Disaster Recovery: RPO, RTO, MTBF, MTTR", "d": "RPO = maximum acceptable data loss (how far back). RTO = maximum acceptable downtime (how fast to recover). MTBF = average time between failures. MTTR = average time to repair. MTBF = MTTF + MTTR. Hot site = fastest recovery. Cold site = cheapest."}, {"t": "Change Management and Configuration Management", "d": "Change management: Request → Review → Approve → Test → Schedule → Document. Unauthorized changes impact AVAILABILITY. Configuration management maintains baselines. Patch management: Evaluate → Test → Approve → Deploy → Verify. Configuration baselines enable drift detection."}, {"t": "Cloud Security and Asset Management", "d": "Cloud shared responsibility: SaaS = CSP maximum, IaaS = consumer maximum. SDN separates control from data plane. Information lifecycle: Create → Classify → Store → Use → Archive → Destroy. Media sanitization: Clear < Purge < Destroy (NIST 800-88)."}, {"t": "Logging, Monitoring, and SIEM Operations", "d": "Security logging captures events from systems, applications, and network devices. SIEM (Security Information and Event Management) aggregates, correlates, and analyzes logs in real-time. Key concepts include log integrity, retention, correlation rules, and SOAR for automated response."}, {"t": "Investigations, Evidence Types, and Legal Requirements", "d": "Security investigations follow specific procedures depending on type (criminal, civil, regulatory, administrative). Evidence must meet legal standards: relevant, reliable, sufficient, and permissible. The exclusionary rule, search warrants, and legal holds are key concepts."}, {"t": "Threat Intelligence Operations", "d": "Threat intelligence informs security operations through IOCs, TTPs, and threat actor profiling. Sources include OSINT, ISACs, commercial feeds, and government agencies. Intelligence must be operationalized through SIEM integration and automated response."}, {"t": "Incident Response Team Roles and Communication", "d": "IR teams require defined roles: incident commander, technical lead, communications officer, legal counsel, and HR. Communication plans must address internal stakeholders, external parties, media, regulators, and law enforcement."}, {"t": "Patch Management and Vulnerability Remediation", "d": "Patch management is a structured process: identify applicable patches, test in non-production, deploy per priority, verify effectiveness, and document. Emergency patches may bypass normal change management but must be documented after the fact."}, {"t": "Backup Strategies: Full, Incremental, Differential, and Cloud", "d": "Backup strategies balance recovery speed, storage requirements, and RPO compliance. Full (complete copy), Incremental (changes since last backup), Differential (changes since last full). Cloud backup adds geographic diversity but introduces bandwidth and security considerations."}, {"t": "Security Operations Center (SOC) Operations", "d": "The SOC provides centralized security monitoring, detection, and response. SOC models include dedicated (internal), managed (outsourced MSSP), and hybrid. SOC operates 24/7 with tiered analysts and uses SIEM, SOAR, EDR, and threat intelligence."}, {"t": "Disaster Recovery Planning and Execution", "d": "DR planning ensures IT systems recover after disruptions. Key elements: DR plan documentation, testing schedules, recovery procedures, alternate processing sites, and data restoration. DR is a subset of BCP focused on IT recovery."}, {"t": "Malware Types and Countermeasures", "d": "Malware categories include viruses (require host), worms (self-propagate), trojans (disguised), ransomware (encrypt for payment), rootkits (hide presence), spyware, adware, and fileless malware. Defense requires layered controls: prevention, detection, and response."}, {"t": "Physical Security Operations", "d": "Physical security operations include access control (badges, guards, mantraps), surveillance (CCTV, motion sensors), visitor management, equipment security, and media handling. Physical controls support and complement technical controls."}, {"t": "Business Continuity and Resilience", "d": "Business resilience goes beyond DR to ensure the organization can adapt and operate through disruptions. Key concepts: high availability (eliminate single points of failure), fault tolerance (continue despite component failure), and organizational resilience."}, {"t": "Digital Forensics Procedures and Evidence Handling", "d": "Forensic investigation methodology including evidence collection, chain of custody, forensic imaging, analysis techniques, and legal admissibility requirements."}, {"t": "Configuration and Change Management", "d": "Processes for managing system configurations and changes including configuration baselines, change advisory boards, and rollback procedures."}, {"t": "Incident Response Team and Communication", "d": "Building and operating incident response teams, defining roles, establishing communication plans, and managing stakeholder coordination during incidents."}, {"t": "Patch and Vulnerability Management Operations", "d": "Operational processes for identifying, testing, deploying, and verifying patches across enterprise systems with rollback capabilities."}, {"t": "Physical Security Controls and Environmental Protection", "d": "Environmental controls including HVAC, fire suppression, power protection, and physical security measures for data centers and facilities."}, {"t": "Investigations and Legal Considerations", "d": "Types of investigations, evidence standards, legal holds, eDiscovery, and coordination with law enforcement."}, {"t": "Security Operations Center (SOC) Architecture", "d": "Designing and operating a SOC including tiered analyst model, runbooks, playbooks, threat hunting, and SOC metrics."}, {"t": "Media Management and Sanitization", "d": "Secure handling, storage, transport, and destruction of media including NIST SP 800-88 guidelines for data sanitization at end of lifecycle."}, {"t": "Disaster Recovery Strategy and Site Selection", "d": "DR site types, selection criteria, recovery strategies, and the relationship between MTD/RTO/RPO and recovery capabilities."}, {"t": "Endpoint Security Operations", "d": "Endpoint protection including EDR, application whitelisting, host-based firewalls, full disk encryption, and endpoint hardening."}, {"t": "Threat Intelligence Operations", "d": "Collection, analysis, and operationalization of threat intelligence including STIX/TAXII, threat feeds, and intelligence-driven defense."}, {"t": "Business Continuity Operations", "d": "Operational aspects of business continuity including plan activation, crisis management, emergency communications, and continuity exercises."}, {"t": "Security Operations Center Architecture", "d": "SOC design including staffing models, tool integration, alert triage, playbooks, and SOC maturity progression."}, {"t": "Logging and Monitoring Strategy", "d": "Comprehensive logging architecture including log sources, centralization, retention, correlation, and compliance requirements."}, {"t": "Malware Analysis and Reverse Engineering", "d": "Techniques for analyzing malicious software including static analysis, dynamic analysis, sandboxing, and malware classification."}, {"t": "Disaster Recovery Implementation", "d": "Implementing DR strategies including backup methods, replication technologies, cloud DR, and recovery testing procedures."}, {"t": "Resource Protection and Provisioning", "d": "Securing system resources through hardening, configuration baselines, secure provisioning, and infrastructure as code."}, {"t": "Personnel Security Operations", "d": "Security practices for managing personnel including background checks, onboarding, termination procedures, and insider threat programs."}, {"t": "Service Level Agreement Management", "d": "Defining, monitoring, and enforcing SLAs for security services including uptime guarantees, response times, and vendor management."}, {"t": "Secure Facility and Infrastructure Operations", "d": "Managing physical infrastructure security including data center operations, environmental controls, fire suppression, and facility access."}, {"t": "Incident Response Lifecycle: NIST SP 800-61", "d": "NIST SP 800-61 defines four IR phases: Preparation, Detection and Analysis, Containment/Eradication/Recovery, and Post-Incident Activity. Understanding each phase, team roles, and communication procedures is heavily tested."}, {"t": "Backup Strategies and Recovery Testing", "d": "Backup strategies (full, incremental, differential) provide data recovery capabilities. Understanding backup types, rotation schemes, storage requirements, and recovery testing is essential for BCP/DR."}, {"t": "Malware Types and Analysis Techniques", "d": "Understanding malware categories (virus, worm, Trojan, ransomware, rootkit, fileless), propagation methods, and analysis techniques (static, dynamic, sandbox) is essential for security operations."}, {"t": "Change Management in Security Operations", "d": "Change management ensures that modifications to systems and configurations are authorized, tested, documented, and reversible. The Change Advisory Board (CAB) reviews changes to prevent unauthorized or disruptive modifications."}, {"t": "Disaster Recovery Implementation", "d": "DR implementation includes selecting site types, establishing recovery procedures, conducting testing, and maintaining plans. Understanding site types, recovery sequence, and testing methods is critical for the exam."}, {"t": "Security Operations Center (SOC) Design and Operations", "d": "The SOC is the centralized function for monitoring, detecting, and responding to security events. Understanding SOC tiers, staffing models, tools, and operational workflows is essential."}, {"t": "Investigations: Criminal, Civil, Administrative, and Regulatory", "d": "Different investigation types have different standards of evidence, procedures, and outcomes. Understanding when to involve law enforcement, preserve evidence, and maintain chain of custody is critical."}, {"t": "Threat Intelligence Operations", "d": "Threat intelligence transforms raw data into actionable information about threats. Understanding intelligence types (strategic, tactical, operational), sources (OSINT, HUMINT, SIGINT), and sharing frameworks (STIX/TAXII) is essential."}, {"t": "Patch Management and Vulnerability Remediation", "d": "Patch management is the systematic process of identifying, testing, deploying, and verifying software patches. Timely patching reduces the attack surface, but uncontrolled patching can cause outages."}, {"t": "Configuration Management and Hardening", "d": "Configuration management maintains systems in a known-good state through baselines, change control, and drift detection. System hardening reduces the attack surface by removing unnecessary services, applying secure settings, and enforcing least functionality."}, {"t": "Incident Containment Strategies", "d": "Containment stops the spread of an incident while preserving evidence. Strategies include network isolation, account disabling, and system quarantine. The choice of containment strategy depends on incident type and business impact."}, {"t": "Disaster Recovery Testing Types", "d": "DR testing validates that recovery procedures actually work. Five testing types range from least disruptive (checklist review) to most disruptive (full interruption). Regular testing is essential — untested plans will fail."}, {"t": "Evidence Handling and Forensic Procedures", "d": "Digital forensics follows strict procedures to ensure evidence integrity and admissibility. Key principles: work on copies (never originals), maintain chain of custody, hash everything, and follow the volatility order."}, {"t": "Disaster Recovery Site Types and Selection", "d": "Disaster recovery sites provide alternate processing capability when the primary site is unavailable. Site types (hot, warm, cold, mobile, cloud) differ in cost, readiness time, and capabilities."}, {"t": "Operational Security Controls and Procedures", "d": "Operational security controls ensure day-to-day security through defined procedures for system operations, media handling, monitoring, and personnel management."}, {"t": "Vulnerability and Patch Management Lifecycle", "d": "Vulnerability management is the continuous process of identifying, evaluating, remediating, and reporting on security vulnerabilities. Patch management ensures timely application of vendor-supplied fixes."}, {"t": "Business Continuity Planning and Testing", "d": "Business Continuity Planning (BCP) ensures critical business functions continue during and after a disaster. BCP encompasses BIA, strategy development, plan development, and regular testing."}, {"t": "Security Information and Event Management Architecture", "d": "SIEM systems collect, correlate, and analyze security events from across the enterprise to detect threats, support investigations, and meet compliance requirements."}, {"t": "Service Level Agreement Management", "d": "SLAs define the expected level of service between parties. For security operations, SLAs cover uptime, response times, patch timelines, and incident handling. Monitoring and enforcing SLAs ensures accountability."}], "review": [{"t": "Least Privilege", "d": "Minimum system privileges needed for job duties — governs rights/actions"}, {"t": "Separation of Duties", "d": "PREVENTIVE control — no single person completes critical task end-to-end"}, {"t": "Job Rotation", "d": "DETECTIVE control — rotating roles detects fraud/irregularities"}, {"t": "NIST 800-61", "d": "Incident Response: Prepare → Detect/Analyze → Contain/Eradicate/Recover → Post-Incident"}, {"t": "Chain of Custody", "d": "Who + When + What + Why = admissible evidence"}, {"t": "Order of Volatility", "d": "Registers → RAM → Swap → Disk → Remote → Archive (most volatile first)"}, {"t": "RPO", "d": "Recovery Point Objective — maximum acceptable data loss (drives backup frequency)"}, {"t": "RTO", "d": "Recovery Time Objective — maximum acceptable downtime (drives recovery site)"}, {"t": "MTBF", "d": "Mean Time Between Failures = MTTF + MTTR"}, {"t": "Hot/Warm/Cold Site", "d": "Hot = minutes ($$$$), Warm = hours ($$$), Cold = weeks ($$)"}, {"t": "Change Management", "d": "Request → Review → Approve → Test → Schedule → Document"}, {"t": "NIST 800-88", "d": "Media sanitization: Clear (overwrite) < Purge (degauss) < Destroy (physical)"}, {"t": "MITRE ATT&CK", "d": "Framework cataloging adversary TTPs across the attack lifecycle. Used for detection gap analysis."}, {"t": "IOC", "d": "Indicator of Compromise — observable artifact: malicious IPs, domains, file hashes, behavioral patterns."}, {"t": "TLP", "d": "Traffic Light Protocol: RED (restricted), AMBER (limited), GREEN (community), WHITE (public)."}, {"t": "Threat Hunting", "d": "Proactive search for threats evading detection. Assumes attacker is already inside."}, {"t": "IR Team Roles", "d": "Incident Commander, Technical Lead, Communications, Legal, HR, Business Liaison."}, {"t": "Patch Priority", "d": "Critical=24-72hr, High=1-2wk, Medium=30d, Low=90d. Test before deploying."}, {"t": "Virtual Patching", "d": "IPS rules blocking exploit attempts without patching underlying vulnerability. Temporary measure."}, {"t": "Full vs Incremental vs Differential", "d": "Full=everything. Incremental=since last ANY backup. Differential=since last FULL."}, {"t": "3-2-1 Backup Rule", "d": "3 copies, 2 different media types, 1 offsite. Minimum data protection standard."}, {"t": "Electronic Vaulting", "d": "Batch electronic backup transfer to offsite. RPO: hours."}, {"t": "Remote Journaling", "d": "Real-time transaction journal transfer to remote site. RPO: minutes."}, {"t": "Database Shadowing", "d": "Complete database copy at remote site. RPO: near-zero."}, {"t": "SOC Analyst Tiers", "d": "T1=triage alerts, T2=investigate incidents, T3=hunt threats/engineer detection."}, {"t": "Alert Fatigue", "d": "#1 SOC challenge. Too many alerts reduce effectiveness. Fix: tune, automate, prioritize."}, {"t": "SOAR", "d": "Security Orchestration, Automation, Response — automated playbooks for routine alerts."}, {"t": "Virus vs Worm", "d": "Virus = needs host program + user action. Worm = self-propagates without user action."}, {"t": "Ransomware Types", "d": "Single=encrypt. Double=encrypt+publish. Triple=encrypt+publish+DDoS/contact victims' customers."}, {"t": "Polymorphic vs Metamorphic", "d": "Polymorphic = changes code appearance. Metamorphic = completely rewrites itself (harder to detect)."}, {"t": "Fileless Malware", "d": "Memory-only. Uses legitimate tools (PowerShell, WMI). No files on disk. \"Living off the land.\""}, {"t": "Tailgating vs Piggybacking", "d": "Tailgating = without their knowledge. Piggybacking = with their knowledge (held door)."}, {"t": "Anti-passback", "d": "Cannot badge in twice without badging out. Prevents passing badge back to another person."}, {"t": "RAID Levels", "d": "RAID 0=no redundancy, RAID 1=mirror, RAID 5=parity (1 disk), RAID 6=double parity (2 disks), RAID 10=mirror+stripe."}, {"t": "SPOF", "d": "Single Point of Failure — component whose failure causes complete system failure. Eliminate through redundancy."}, {"t": "Availability Formula", "d": "Availability = MTBF / (MTBF + MTTR). Higher MTBF + lower MTTR = better availability."}, {"t": "Reconstitution", "d": "Planned return from DR site to primary site. Not rushed — ensure primary is fully secure and functional."}, {"t": "CDP", "d": "Continuous Data Protection — captures every change in real-time. Near-zero RPO. Highest storage/bandwidth."}, {"t": "Forensic Image", "d": "Bit-for-bit copy of media. Created with write-blocker. Hash-verified. Never analyze original."}, {"t": "Write-Blocker", "d": "Prevents modification of source media during forensic imaging. Hardware or software."}, {"t": "Legal Hold", "d": "Preserve ALL potentially relevant evidence when litigation anticipated. Failure = spoliation sanctions."}, {"t": "eDiscovery/EDRM", "d": "Electronic Discovery Reference Model — govern → identify → preserve → collect → process → review → produce."}, {"t": "Evidence Standards", "d": "Criminal = beyond reasonable doubt. Civil/Admin = preponderance (>50%)."}, {"t": "Best Evidence Rule", "d": "Original documents preferred over copies. Computer records may qualify as business records exception."}, {"t": "CMDB", "d": "Configuration Management Database — tracks all Configuration Items and their relationships."}, {"t": "CAB", "d": "Change Advisory Board — reviews and approves/denies change requests. Cross-functional membership."}, {"t": "Emergency Change", "d": "Expedited approval for critical fixes. Must be documented retroactively. Higher risk accepted."}, {"t": "VESDA", "d": "Very Early Smoke Detection Apparatus — aspirating system, earliest fire detection. Air sampling."}, {"t": "Pre-Action Sprinkler", "d": "Best for data centers — requires two triggers (detector + sprinkler head). Prevents accidental discharge."}, {"t": "FM-200", "d": "Clean agent fire suppression (HFC-227ea). Safe for occupied spaces. Replaces Halon."}, {"t": "Online UPS", "d": "Continuous conditioned power — best for data centers. Zero transfer time during outage."}, {"t": "Power Problems", "d": "Blackout=total loss, Brownout=reduced voltage, Surge=momentary increase, Spike=instantaneous high."}, {"t": "SOC Tiers", "d": "T1=triage (runbooks), T2=investigate, T3=hunt/engineer detection. T3 is proactive."}, {"t": "Runbook vs Playbook", "d": "Runbook = step-by-step procedure (specific alert). Playbook = scenario-based response plan (incident type)."}, {"t": "MSSP vs MDR", "d": "MSSP = outsourced monitoring. MDR = outsourced detection AND response (more comprehensive)."}, {"t": "Mandatory Vacation", "d": "DETECTIVE control — forces time away so substitutes may discover fraud/irregularities."}, {"t": "Need to Know", "d": "Data access restriction — even with clearance, must have justified need for specific information."}, {"t": "Spoliation", "d": "Destruction of evidence under legal hold. Severe court sanctions including adverse inference."}, {"t": "eDiscovery/EDRM", "d": "Electronic Discovery Reference Model — govern → identify → preserve → collect → process → review → produce."}, {"t": "Real Evidence", "d": "Physical objects (actual hard drive). Documentary = records/logs. Testimonial = witness."}, {"t": "SSD Sanitization", "d": "Degaussing does NOT work on SSDs. Use cryptographic erasure or physical destruction."}, {"t": "DRaaS", "d": "DR as a Service — cloud-based DR. Elastic capacity, pay-per-use."}, {"t": "Synchronous Replication", "d": "Zero data loss. Both sites confirm writes. Short distance only (<100km)."}, {"t": "EDR", "d": "Endpoint Detection and Response — behavioral, automated. Beyond signature-based AV."}, {"t": "Application Whitelisting", "d": "Only approved apps execute. More effective than blacklisting but harder to manage."}, {"t": "FDE/BitLocker", "d": "Full Disk Encryption. Protects PHYSICAL theft only. BitLocker uses TPM."}, {"t": "CIS Benchmarks/STIGs", "d": "Security configuration baselines. CIS = consensus. DISA STIGs = DoD standards."}, {"t": "Hot Aisle/Cold Aisle", "d": "Data center cooling. Cold = server intakes. Hot = exhausts. Containment improves efficiency."}, {"t": "ASHRAE", "d": "Data center guidelines: 64-80°F, 40-60% humidity. Too low humidity = ESD risk."}, {"t": "Positive Air Pressure", "d": "Server rooms pressurized to keep contaminants out. Air flows outward when doors open."}, {"t": "Duress PIN", "d": "Silent alarm code entered during forced entry. Appears normal but alerts security."}, {"t": "Reconstitution", "d": "Planned return from DR to primary site. Not rushed — verify primary is fully secure first."}], "formulas": ["Privilege = Permission (data access) + Rights (system actions)", "Need to Know = data access governance (Permission)", "Least Privilege = system action governance (Rights)", "SoD = Preventive | Job Rotation = Detective | Mandatory Vacation = Detective", "NIST 800-61: Preparation → Detection & Analysis → Containment/Eradication/Recovery → Post-Incident Activity", "Org 7-step: Detect → Respond → Mitigate → Report → Recover → Remediate → Lessons Learned", "Containment: Short-term (isolate) → Long-term (rebuild segment)", "Post-Incident: Lessons learned meeting within 2 weeks of resolution", "Order of volatility: Registers → RAM → Swap → Disk → Remote logs → Archives", "Chain of custody: Who + When + What + Why = admissible evidence", "Evidence types: Real, Documentary, Testimonial, Demonstrative", "Legal hold = preserve ESI when litigation is reasonably anticipated", "Five rules: Authentic, Accurate, Complete, Convincing, Admissible", "RPO = maximum acceptable data loss (time-based)", "RTO = maximum acceptable downtime", "MTD = RTO + WRT (Maximum Tolerable Downtime)", "MTBF = MTTF + MTTR", "Availability = MTBF / (MTBF + MTTR)", "Hot site = minutes | Warm site = hours/days | Cold site = days/weeks", "Change: Request → Review → Approve → Test → Schedule → Document", "Patch: Evaluate → Test → Approve → Deploy → Verify", "Unauthorized change = AVAILABILITY impact (CIA)", "Critical patch SLA: typically 24-72 hours", "Configuration baseline = approved system state for drift detection", "Cloud responsibility: SaaS (CSP max) → PaaS (shared) → IaaS (consumer max)", "SDN: Control Plane (brain/decisions) + Data Plane (muscle/forwarding)", "Info lifecycle: Create → Store → Use → Share → Archive → Destroy", "Sanitization: Clear (overwrite) < Purge (degauss/crypto-erase) < Destroy (physical)", "SIEM pipeline: Collect → Normalize → Correlate → Alert → Retain", "Log retention: PCI-DSS = 1 year | SOX = 7 years | HIPAA = 6 years", "NTP: All systems must synchronize time for log correlation accuracy", "Criminal: Beyond reasonable doubt (~99%) | Civil: Preponderance (>50%)", "Evidence admissibility: Relevant + Reliable + Sufficient + Permissible", "Chain of custody: Who + When + What + Why for every evidence transfer", "Incremental restore = Full + all incrementals since full (in order)", "Differential restore = Full + latest differential only", "RPO determines minimum backup frequency", "99.999% uptime = 5.26 minutes downtime per year", "RAID 5 minimum disks: 3, tolerates: 1 failure", "RAID 6 minimum disks: 4, tolerates: 2 failures", "RTO < 1 hour → hot site or cloud DRaaS with synchronous replication", "RTO 1-24 hours → warm site with asynchronous replication", "RTO > 72 hours → cold site acceptable with offsite backup restoration", "Incremental restore: Full + all incrementals in order", "Differential restore: Full + latest differential only", "3-2-1 Rule: 3 copies, 2 media types, 1 off-site", "99.9% uptime = 8.77 hours downtime per year", "99.99% uptime = 52.56 minutes downtime per year"], "aids": ["\"Separate to Prevent, Rotate to Detect\"", "\"Need to Know = data, Least Privilege = actions\"", "SLA = financial stipulation. MOU = same purpose, NO financial terms", "\"Dual = Do together, Split = Share separately\"", "NIST 800-61: \"PDCP\" — Prepare, Detect, Contain, Post-mortem", "\"DRM Rep Rec Rem LL\" — Detect, Respond, Mitigate, Report, Recover, Remediate, Lessons Learned", "\"Prepare for the worst, Detect the actual, Contain the damage, Post-mortem the response\"", "\"Media = designated spokesperson ONLY\"", "Volatility order: \"Really RAM Swaps Disks, Remotely Archived\"", "Evidence types: \"RDTD\" — Real, Documentary, Testimonial, Demonstrative", "Five rules: \"AACCA\" — Authentic, Accurate, Complete, Convincing, Admissible", "\"Image first, analyze second — never touch the original\"", "\"RPO = data in the Past (how far back), RTO = Time to Operations (how fast forward)\"", "\"Hot = Have everything, Warm = Wait for data, Cold = Completely empty\"", "\"MTBF = Mean Time Between Failures = MTTF (fail) + MTTR (repair)\"", "Site cost: \"Hot > Warm > Cold\" | Speed: \"Hot > Warm > Cold\"", "Change management: \"Really Rough Apples Taste Sweet Daily\"", "Patch management: \"Every Teacher Approves Diligent Verification\"", "\"Unauthorized = Unavailability\" — unauthorized changes impact availability", "\"Baseline = before-line\" — the known good state to compare against", "\"SPI\" — SaaS (CSP does most), PaaS (shared), IaaS (I do most)", "\"Clear = Clean for reuse, Purge = Permanent erasure, Destroy = Demolish physically\"", "SDN: \"Software Decides Networking\"", "Evidence: \"Search warrant > Surrender > Subpoena\"", "SIEM functions: \"Collect, Normalize, Correlate, Alert, Retain\" — CNCAR", "Five Ws of logging: \"Who, What, When, Where, Why\"", "SOAR: \"Security Orchestrates Automated Responses\"", "Burden of proof: \"Criminal is Certain, Civil is Coin-flip\"", "Legal hold: \"Litigation Halts destruction Obligations Legally Daily\"", "ATT&CK lifecycle: \"IEPPD-CDLCEI\" — Initial Access to Impact (12 stages)", "TLP colors: \"RAGW\" — Red (restricted), Amber (limited), Green (community), White (unlimited)", "Threat actors: \"NOHIS\" — Nation-state, Organized crime, Hacktivists, Insiders, Script kiddies", "IR team: \"ITCLHB\" — Incident commander, Technical lead, Communications, Legal, HR, Business liaison", "Communication rule: \"One mouth speaks to media\"", "Post-incident: \"LAR\" — Lessons learned, Action items, Report", "Patch process: \"MATADVD\" — Monitor, Assess, Test, Approve, Deploy, Verify, Document", "When can't patch: \"NWVD\" — Network isolation, WAF rules, Virtual patching, Document risk acceptance", "Incremental vs Differential: \"Incremental = since LAST backup, Differential = since last FULL\"", "3-2-1 rule: \"3 copies, 2 media types, 1 offsite\"", "GFS: \"Grandfather (monthly), Father (weekly), Son (daily)\"", "SOC tiers: \"Tier 1 Triages, Tier 2 Investigates, Tier 3 Hunts\"", "SOC stack: \"SSENT\" — SIEM, SOAR, EDR, NDR, TIP", "Alert fatigue fix: \"TAPC\" — Tune rules, Automate with SOAR, Prioritize by asset, Context enrichment", "Replication RPO: \"Sync=Zero, Async=Seconds, Shadow=Minutes, Journal=Minutes, Vault=Hours\"", "Recovery sequence: \"Declare, Activate, Assess, Recover, Resume, Return, Review\"", "Malware types: \"VWTRRSA-F\" — Virus, Worm, Trojan, Ransomware, Rootkit, Spyware, Adware, Fileless", "Virus evolution: \"PMM\" — Polymorphic (changes), Metamorphic (rewrites), Multipartite (multiple vectors)", "Ransomware extortion: \"1=encrypt, 2=encrypt+publish, 3=encrypt+publish+DDoS\"", "Physical layers: \"PEIO\" — Perimeter, Exterior, Interior, Object", "Tailgating vs Piggybacking: \"Tail = they don't know, Piggy = they let you ride\"", "Alarm types: \"LCA\" — Local (siren), Central (monitoring), Auxiliary (police/fire)", "RAID levels: \"0=Zero protection, 1=One mirror, 5=Five minus one disk, 6=Six minus two, 10=One mirror + Zero stripe\"", "Availability nines: \"Two 9s=87hr, Three 9s=8.7hr, Four 9s=52min, Five 9s=5min\"", "SPOF: \"Single Points Of Failure — find them and fix them\"", "Forensic process: \"IPCEA-R\" — Identify, Preserve, Collect, Examine, Analyze, Report", "Volatility order: \"Real Rascals Steal Data Really Artfully\" — Registers, RAM, Swap, Disk, Remote, Archive", "Change types: \"SNE\" — Standard (pre-approved), Normal (CAB), Emergency (urgent, document later)", "Change process: \"RITA-R\" — Request, Impact assess, Test, Approve (CAB), Rollback plan", "IRT roles: \"ICLH\" — Incident Commander, Communications Lead, Legal counsel, HR", "Communication audiences: \"ELPLP\" — Executives, Legal, PR, Law enforcement, Public/affected individuals", "Patch lifecycle: \"MATADV\" — Monitor, Assess, Test, Approve, Deploy, Verify", "Patch urgency: \"Critical=72hrs, High=30days, Medium=90days\" — know the SLAs", "Fire suppression: \"WDP-P\" — Wet pipe (fastest), Dry pipe (no water until triggered), Deluge (industrial), Pre-action (data center, two triggers)", "Power problems: \"BB SSSNT\" — Blackout, Brownout, Sag, Surge, Spike, Noise, Transient", "Evidence standards: \"Criminal > Civil = Administrative\" — Criminal has highest standard (beyond reasonable doubt)", "Evidence types: \"RTDT\" — Real (physical), Testimonial (witness), Documentary (records), Demonstrative (models)", "SOC tiers: \"1=Triage, 2=Investigate, 3=Hunt\" — increasing expertise and proactivity", "SOC models: \"I-M-M-H\" — Internal, MSSP (monitoring), MDR (detection+response), Hybrid", "Sanitization levels: \"CPD\" — Clear (casual protection), Purge (lab protection), Destroy (no recovery possible)", "SSD challenge: \"No Magnet? No Degauss. Crypto or Crush.\"", "DR sites by speed: \"Hot=Have everything, Warm=Wait for data, Cold=Create from scratch\"", "Replication: \"Sync=Same time (zero loss, short distance), Async=After (some loss, any distance)\"", "Endpoint stack: \"EFAWH\" — EDR, Firewall (host), Application whitelist, Whole disk encryption, Hardening", "AV evolution: \"Signature → Behavioral → EDR → XDR\" — increasing sophistication", "Intelligence types: \"STOT\" — Strategic (big picture), Tactical (how they attack), Operational (specific campaigns), Technical (IoCs)", "Intelligence cycle: \"DCPADF\" — Direction, Collection, Processing, Analysis, Dissemination, Feedback", "Exercise types: \"TFF\" — Tabletop (talk through it), Functional (test parts), Full-scale (test everything)", "Crisis comms: \"TTAEA\" — Transparent, Timely, Accurate, Empathetic, Actionable", "SOC tiers: \"T1 = Triage, T2 = Tackle, T3 = Track and Hunt\"", "SOC stack: \"SSENTV\" — SIEM, SOAR, EDR, NDR, TIP, Vulnerability scanner", "Log retention: \"PCI=1yr, HIPAA=6yr, SOX=7yr\" — know the compliance requirements", "Log integrity: \"WCDS\" — Write-once, Centralize, Digitally sign, Synchronize time", "Malware types: \"VWTR-SRB-FLR\" — Virus, Worm, Trojan, Ransomware, Spyware, Rootkit, Backdoor, Fileless, Logic bomb, RAT", "Analysis methods: \"Static = See, Dynamic = Do\" — examine without running vs observe while running", "Backup types: \"FID\" — Full (everything), Incremental (since any), Differential (since full)", "Cloud DR tiers: \"BPWH\" — Backup (cold), Pilot light, Warm standby, Hot site — increasing cost and decreasing RTO", "IaC tools: \"TAP\" — Terraform (provision), Ansible (configure), Packer (build images)", "Baseline standards: \"CIS = Community, STIG = Strict (DoD), Vendor = Variable\"", "Termination: \"DCRTE\" — Disable access, Collect assets, Remove building access, Transfer data, Exit interview", "Insider threat controls: \"MSJD\" — Mandatory vacation, Separation of duties, Job rotation, Dual control", "Availability nines: \"9s = subtract from year\" — 99.9% = 8.7hr, 99.99% = 52min, 99.999% = 5min", "SLA hierarchy: \"MSOU\" — MSA (master), SLA (measurable), OLA (internal), UC (underpinning/external)", "Fire suppression for data centers: \"Pre-action or Clean agent — NEVER wet pipe\"", "Data center tiers: \"1=Basic, 2=Better, 3=Best maintenance, 4=Bullet-proof\"", "IR phases: \"PDCER-P\" — Prepare, Detect, Contain, Eradicate, Recover, Post-incident"]}, {"code": "SWD", "name": "Software Development Security", "weight": "10", "topics": [{"t": "SDLC Security Integration and Development Models", "d": "Security must be integrated into EVERY SDLC phase, not bolted on at the end. Requirements phase: security requirements + risk assessment. Design: threat modeling. Develop: secure coding + peer review. Test: SAST/DAST. Operate: monitoring + patch management. DevSecOps automates security in CI/CD."}, {"t": "OWASP Top 10 Web Application Vulnerabilities", "d": "OWASP Top 10 is the standard awareness document for web application security. Key vulnerabilities: Injection (SQLi, XSS), Broken Authentication, Sensitive Data Exposure, Broken Access Control, Security Misconfiguration, SSRF. Each has specific countermeasures that are exam-testable."}, {"t": "Database Security: SQL Injection, Polyinstantiation, and ACID", "d": "RDBMS: Row=Tuple (Cardinality), Column=Attribute (Degree). ACID ensures transaction reliability. Normalization reduces redundancy (1NF→2NF→3NF cumulative). Polyinstantiation prevents inference attacks. SQL injection exploits dynamic queries. Views restrict database access."}, {"t": "SW-CMM, OOP Concepts, and Software Assurance", "d": "SW-CMM: Initial → Repeatable → Defined → Managed → Optimized (IRDMO). OOP: High cohesion GOOD, Low coupling GOOD. Change management applies to software configuration. Assurance = confidence that controls work correctly throughout the system lifecycle."}, {"t": "Software Testing Types and Acquired Software Security", "d": "Software testing spans unit through acceptance testing. Acquired software (COTS/open-source) requires supply chain security evaluation. Code signing verifies software integrity. API security requires authentication, authorization, rate limiting, and input validation."}, {"t": "DevSecOps and CI/CD Pipeline Security", "d": "DevSecOps integrates security into every phase of the DevOps lifecycle. CI/CD pipelines automate build, test, and deployment with security gates: SAST in code commit, SCA for dependencies, DAST in staging, container scanning, and infrastructure-as-code (IaC) security validation."}, {"t": "API Security and Microservices Architecture", "d": "APIs are primary attack surfaces in modern applications. Security requires authentication (OAuth 2.0, API keys), authorization (scopes, RBAC), input validation, rate limiting, and API gateways. Microservices introduce service mesh security, mutual TLS, and east-west traffic concerns."}, {"t": "Secure Coding Practices and Input Validation", "d": "Secure coding prevents vulnerabilities at the source. Key practices: input validation (whitelist), output encoding, parameterized queries, error handling, least privilege, and defense in depth. Never trust user input."}, {"t": "Object-Oriented Programming (OOP) Security Concepts", "d": "OOP principles affect security: Encapsulation (hiding internal state), Inheritance (extending classes — can inherit vulnerabilities), Polymorphism (methods behave differently by context), and Abstraction (hiding complexity). Understanding these enables secure design."}, {"t": "Database Security: Views, Stored Procedures, and Aggregation", "d": "Database security beyond SQL injection includes: views (restrict data visibility), stored procedures (controlled operations), aggregation attacks (combining low-level data reveals high-level secrets), inference attacks (deducing classified info from unclassified data)."}, {"t": "Software Acquisition and Third-Party Code Security", "d": "Most software includes third-party components (open source, commercial libraries). Security requires: evaluating vendor security practices, maintaining SBOM, monitoring for vulnerabilities, and managing end-of-life software risks."}, {"t": "Secure Development Environments and Change Control", "d": "Separate development, testing, and production environments. Developers should NOT have production access. Code promotion follows formal processes. Version control, code review, and separation of duties protect code integrity."}, {"t": "Web Application Security Headers", "d": "HTTP security headers protect against common web attacks. Key headers: Content-Security-Policy (CSP), X-Frame-Options, Strict-Transport-Security (HSTS), X-Content-Type-Options, Referrer-Policy, and Permissions-Policy."}, {"t": "SDLC Models: Waterfall, Agile, Spiral, and DevOps", "d": "Different SDLC models integrate security differently. Waterfall (sequential, requirements upfront), Agile (iterative, security in each sprint), Spiral (risk-driven, risk analysis each cycle), DevOps/DevSecOps (continuous, automated security)."}, {"t": "Mobile Application Security", "d": "Mobile app security concerns include insecure data storage, weak server-side controls, insufficient transport security, and reverse engineering. OWASP Mobile Top 10 guides mobile security. Controls include code obfuscation, certificate pinning, and secure data storage."}, {"t": "API Security and Microservices Architecture", "d": "Securing APIs through authentication, authorization, rate limiting, input validation, and securing microservice-to-microservice communication."}, {"t": "DevSecOps and CI/CD Pipeline Security", "d": "Integrating security into DevOps practices through automated security testing, infrastructure as code scanning, container security, and secure deployment pipelines."}, {"t": "Software Supply Chain Security", "d": "Securing the software supply chain including third-party libraries, open-source components, SBOM, dependency management, and supply chain attack prevention."}, {"t": "Secure Software Architecture Patterns", "d": "Design patterns that enhance security including defense in depth, fail-secure defaults, separation of privilege, and secure error handling."}, {"t": "OWASP Top 10 Web Application Vulnerabilities", "d": "The most critical web application security risks including injection, broken authentication, XSS, insecure deserialization, and server-side request forgery."}, {"t": "Secure Coding Standards and Practices", "d": "Coding standards including CERT Secure Coding, OWASP guidelines, defensive programming, memory safety, and error handling best practices."}, {"t": "Data Warehousing and Big Data Security", "d": "Security considerations for data warehouses, data lakes, big data platforms, and analytics environments including access control and privacy."}, {"t": "Database Security and SQL Injection Prevention", "d": "Securing database systems including access controls, encryption, SQL injection prevention, and database activity monitoring."}, {"t": "Mobile Application Security", "d": "Security considerations for mobile application development including platform-specific controls, data storage, and communication security."}, {"t": "Secure Software Acquisition", "d": "Security considerations when acquiring software including COTS evaluation, open-source risk, licensing, and vendor security assessment."}, {"t": "Software Development Models and Methodologies", "d": "Security integration across development models including Waterfall, Agile, DevOps, and Spiral with security activities for each phase."}, {"t": "Artificial Intelligence and Machine Learning Security", "d": "Security implications of AI/ML systems including adversarial attacks, model security, data poisoning, and responsible AI."}, {"t": "Code Repository and Version Control Security", "d": "Securing source code repositories including access controls, secrets prevention, branch protection, and code signing."}, {"t": "Web Application Security Beyond OWASP Top 10", "d": "Advanced web application security topics including business logic flaws, race conditions, deserialization attacks, and server-side request forgery."}, {"t": "Software Configuration and Change Management", "d": "Managing software configurations and changes securely including version control, change advisory boards, and configuration auditing."}, {"t": "SDLC Security Integration", "d": "Security must be integrated into every phase of the Software Development Life Cycle, not bolted on at the end. Requirements, design, implementation, testing, and maintenance all have security activities."}, {"t": "OWASP Top 10 Deep Dive", "d": "The OWASP Top 10 represents the most critical web application security risks. Understanding each vulnerability category, attack vectors, and defenses is essential for both the exam and practical security."}, {"t": "Secure Coding Practices: Input Validation and Output Encoding", "d": "Input validation and output encoding are the two most critical secure coding practices. Input validation ensures data meets expectations before processing. Output encoding prevents interpreted injection when displaying data."}, {"t": "Software Development Models Comparison", "d": "Different SDLC models suit different project types. Waterfall is sequential, Agile is iterative, Spiral emphasizes risk analysis, and DevOps integrates development and operations. Each has different security integration points."}, {"t": "Database Security: Inference, Aggregation, and Polyinstantiation", "d": "Databases face unique security challenges. Inference attacks derive classified info from unclassified data. Aggregation combines low-classification data to derive higher-classification conclusions. Polyinstantiation prevents both."}, {"t": "Software Supply Chain Security", "d": "Software supply chain attacks target the development pipeline, third-party components, and distribution mechanisms. The SolarWinds attack demonstrated devastating impact. SBOM, code signing, and dependency scanning are key defenses."}, {"t": "API Security and Common API Vulnerabilities", "d": "APIs are the backbone of modern applications and a growing attack surface. OWASP API Security Top 10 identifies the most critical API risks. Authentication, authorization, rate limiting, and input validation are essential API security controls."}, {"t": "Artificial Intelligence and Machine Learning Security", "d": "AI/ML systems introduce new security challenges including adversarial attacks, data poisoning, model theft, and privacy concerns. Understanding these risks and defenses is increasingly relevant for CISSP."}, {"t": "Buffer Overflow Attacks and Prevention", "d": "Buffer overflows occur when a program writes data beyond allocated memory boundaries. Stack-based and heap-based overflows can lead to code execution. Prevention requires secure coding, compiler protections, and OS mitigations."}, {"t": "Containerization and Serverless Security", "d": "Containers (Docker, Kubernetes) and serverless platforms introduce new security considerations. Container image security, orchestration hardening, secrets management, and serverless function isolation are key concerns."}, {"t": "Web Application Security Headers", "d": "HTTP security headers protect against common web attacks. CSP prevents XSS, HSTS enforces HTTPS, X-Frame-Options prevents clickjacking, and other headers harden the browser security context."}, {"t": "Secure Session Management", "d": "Session management maintains user state across HTTP requests. Insecure session handling leads to session hijacking, fixation, and replay attacks. Secure implementation requires random IDs, proper cookie flags, and timeout controls."}, {"t": "Serialization and Deserialization Attacks", "d": "Insecure deserialization allows attackers to manipulate serialized objects to execute arbitrary code, tamper with data, or escalate privileges. It is a critical vulnerability in Java, .NET, PHP, and Python applications."}, {"t": "Software Composition Analysis and Dependency Management", "d": "Software Composition Analysis (SCA) identifies open-source and third-party components in applications, checking for known vulnerabilities, license compliance, and outdated dependencies."}, {"t": "Threat Modeling Methodologies", "d": "Threat modeling systematically identifies potential threats to a system. Methodologies include STRIDE, PASTA, VAST, attack trees, and LINDDUN, each offering different perspectives on threat identification."}, {"t": "Code Signing and Software Integrity", "d": "Code signing uses digital signatures to verify the authenticity and integrity of software. It ensures code has not been tampered with and comes from a verified publisher."}, {"t": "Runtime Application Security", "d": "Runtime protection monitors applications during execution to detect and prevent attacks in real time. Technologies include RASP, WAF, and runtime integrity checking."}, {"t": "Microservices Security Architecture", "d": "Microservices decompose applications into small, independently deployable services. This architecture introduces unique security challenges including service-to-service authentication, API gateway security, and distributed secrets management."}, {"t": "Mobile Application Security", "d": "Mobile application security addresses unique challenges of mobile platforms including insecure data storage, insufficient transport security, improper platform usage, and reverse engineering risks."}, {"t": "Secure Software Disposal and EOL", "d": "End-of-life (EOL) software management includes decommissioning applications safely, migrating data, revoking access, and ensuring no orphaned resources remain that could become security liabilities."}, {"t": "Privacy by Design in Software Development", "d": "Privacy by Design (PbD) embeds privacy protections into software from the design phase rather than retrofitting them. Ann Cavoukian's 7 foundational principles guide privacy-aware development."}, {"t": "Secure API Design Patterns", "d": "Secure API design encompasses authentication, authorization, input validation, rate limiting, and proper error handling. REST, GraphQL, and gRPC each have unique security considerations."}, {"t": "Infrastructure as Code Security", "d": "Infrastructure as Code (IaC) defines infrastructure in version-controlled templates. Security scanning of IaC templates catches misconfigurations before deployment, implementing shift-left security for infrastructure."}, {"t": "Source Code Management and DevSecOps Pipeline", "d": "Secure source code management includes access controls, branch protection, code review requirements, and secrets scanning. DevSecOps integrates security testing into every stage of the CI/CD pipeline."}], "review": [{"t": "SDLC Security", "d": "Security requirements, threat modeling, secure coding, SAST/DAST, monitoring — in EVERY phase"}, {"t": "STRIDE", "d": "Spoofing, Tampering, Repudiation, Information disclosure, DoS, Elevation — threat modeling"}, {"t": "Waterfall", "d": "Sequential, one step back. Verification (spec) vs Validation (real world)."}, {"t": "Agile Values", "d": "Individuals > processes, software > docs, collaboration > contracts, change > plan"}, {"t": "SW-CMM", "d": "Initial, Repeatable, Defined, Managed, Optimized (IRDMO)"}, {"t": "ACID", "d": "Atomicity, Consistency, Isolation, Durability — database transaction reliability"}, {"t": "SQL Injection", "d": "Inject SQL via user input. Primary defense: parameterized queries (prepared statements)."}, {"t": "XSS", "d": "Cross-Site Scripting — inject scripts into web pages. Defense: output encoding + CSP."}, {"t": "CSRF", "d": "Cross-Site Request Forgery — forged authenticated requests. Defense: anti-CSRF tokens."}, {"t": "Polyinstantiation", "d": "Multiple data versions at different classification levels — prevents inference attacks"}, {"t": "Cohesion/Coupling", "d": "High cohesion GOOD (focused). Low coupling GOOD (independent). \"HiCo LoCo.\""}, {"t": "SBOM", "d": "Software Bill of Materials — inventory of all software components for supply chain security"}, {"t": "Input Validation", "d": "Whitelist (allowlist) preferred over blacklist. Canonicalize before validating. Never trust user input."}, {"t": "Output Encoding", "d": "Encode data for the output context: HTML encoding, URL encoding, JavaScript encoding. Prevents XSS."}, {"t": "Encapsulation", "d": "OOP: hides internal state, exposes only authorized methods. Security benefit: reduced attack surface."}, {"t": "HiCo LoCo", "d": "High Cohesion (focused modules), Low Coupling (independent modules). Good design principle."}, {"t": "Aggregation Attack", "d": "Combining unclassified data reveals classified information. Classify aggregate at higher level."}, {"t": "Inference Attack", "d": "Deducing classified info from patterns/absences. Countermeasure: polyinstantiation."}, {"t": "Database Views", "d": "Virtual tables showing data subsets. Restrict visibility but NOT true access control — combine with permissions."}, {"t": "Stored Procedures", "d": "Precompiled SQL. Reduce injection risk. Users execute procedures, not raw SQL."}, {"t": "SCA", "d": "Software Composition Analysis — identifies vulnerabilities in third-party/open-source components."}, {"t": "SPDX/CycloneDX", "d": "SBOM formats. SPDX = ISO standard. CycloneDX = OWASP standard."}, {"t": "EOL Software", "d": "End-of-life. No more patches. Must replace, isolate with compensating controls, or risk-accept."}, {"t": "Environment Separation", "d": "Dev → Test → Production. Developers should NOT have production access. Use synthetic test data."}, {"t": "Code Review", "d": "All changes reviewed before merge. Security review checks: input validation, auth logic, crypto, error handling."}, {"t": "CSP Header", "d": "Content-Security-Policy — restricts content sources. Primary defense against XSS after output encoding."}, {"t": "HSTS", "d": "HTTP Strict-Transport-Security — forces HTTPS. Prevents SSL stripping attacks."}, {"t": "X-Frame-Options", "d": "Prevents clickjacking by controlling iframe embedding. Values: DENY, SAMEORIGIN."}, {"t": "Waterfall", "d": "Sequential SDLC. Requirements → Design → Implementation → Verification → Maintenance."}, {"t": "Spiral Model", "d": "Risk-driven iterative SDLC. Risk analysis built into every cycle."}, {"t": "Agile Security", "d": "Security in every sprint: security stories, threat modeling in planning, testing in each sprint."}, {"t": "Certificate Pinning (Mobile)", "d": "App validates server cert against known value. Prevents MITM even with rogue CA."}, {"t": "Mobile Secure Storage", "d": "Use platform keystores (iOS Keychain, Android Keystore). Never plaintext on device."}, {"t": "Supply Chain Attack", "d": "Compromising build/distribution to inject malware. SolarWinds 2020, Kaseya 2021 examples."}, {"t": "Verification vs Validation", "d": "Verification = built right (meets specs). Validation = right thing built (meets needs)."}, {"t": "Normalization", "d": "1NF=no repeating groups, 2NF=no partial deps, 3NF=no transitive deps. Reduces redundancy."}, {"t": "BOLA", "d": "Broken Object Level Authorization — #1 OWASP API risk. Manipulating object IDs to access others' data."}, {"t": "API Gateway", "d": "Centralizes API security: authentication, rate limiting, SSL termination, logging, routing."}, {"t": "mTLS", "d": "Mutual TLS — both client and server present certificates. Used for service-to-service auth."}, {"t": "Service Mesh", "d": "Istio/Linkerd — transparent security between microservices: mTLS, authz, observability."}, {"t": "Shift-Left", "d": "Test security earlier in SDLC where fixes are cheaper. Pre-commit → build → test → deploy."}, {"t": "Container Security", "d": "Minimal base image, non-root, read-only filesystem, image scanning, resource limits."}, {"t": "IaC Security", "d": "Scan Terraform/CloudFormation before deploy. Checkov, tfsec detect misconfigurations."}, {"t": "SLSA", "d": "Supply-chain Levels for Software Artifacts. L1=documented, L2=authenticated, L3=hardened, L4=reproducible."}, {"t": "Dependency Confusion", "d": "Public package with same name as internal package. Package manager installs malicious public version."}, {"t": "Typosquatting", "d": "Similarly named malicious packages (e.g., \"lodsh\" vs \"lodash\"). Target developer typos."}, {"t": "Fail-Secure", "d": "Deny access on failure (firewall blocks). Fail-Open = allow on failure (emergency exits)."}, {"t": "Whitelist vs Blacklist", "d": "Whitelist = allow known-good (preferred). Blacklist = block known-bad (always incomplete)."}, {"t": "Canonicalization", "d": "Convert input to simplest form before validation. Prevents encoding-based bypasses."}, {"t": "OWASP ASVS", "d": "Application Security Verification Standard. L1=opportunistic, L2=standard, L3=advanced security reqs."}, {"t": "GraphQL Security", "d": "Depth limiting prevents query DoS. Whitelist allowed queries in production."}, {"t": "Rate Limiting", "d": "Limit API requests per user/time. Prevents brute force, DoS, and abuse."}, {"t": "DREAD", "d": "Damage, Reproducibility, Exploitability, Affected users, Discoverability — threat rating model."}, {"t": "IDEAL Model", "d": "Initiating, Diagnosing, Establishing, Acting, Learning — process improvement."}, {"t": "Pair Programming", "d": "Driver writes code, navigator reviews in real-time. Continuous code review."}, {"t": "OWASP Top 10 #1 (2021)", "d": "Broken Access Control (was #5 in 2017). IDOR, privilege escalation, forced browsing."}, {"t": "IDOR", "d": "Insecure Direct Object Reference — manipulating object IDs to access others' data. Subset of BOLA."}, {"t": "Insecure Deserialization", "d": "Manipulating serialized objects to execute code. Now part of A08 (Software/Data Integrity Failures)."}, {"t": "SSRF", "d": "Server-Side Request Forgery — tricking server to access internal resources. OWASP A10:2021."}, {"t": "CERT Secure Coding", "d": "Carnegie Mellon — language-specific secure coding rules (C, C++, Java)."}, {"t": "Defensive Programming", "d": "Assume all input malicious, all external systems untrusted. Validate everything."}, {"t": "Memory Safety", "d": "Buffer overflow prevention: DEP/NX, ASLR, stack canaries, bounds checking."}, {"t": "Use-After-Free", "d": "Accessing memory after deallocation. Null pointer after free prevents this."}, {"t": "Integer Overflow", "d": "Value exceeds maximum — wraps around. Can bypass security checks. Validate ranges."}, {"t": "TOCTOU", "d": "Time of Check to Time of Use race condition. State changes between verification and use."}, {"t": "ETL Security", "d": "Extract-Transform-Load pipeline. Protect data during all phases. Encrypt in transit."}, {"t": "NoSQL Security", "d": "Enable authentication (MongoDB defaults off!). Encrypt connections. Field-level encryption."}, {"t": "Data Warehouse Security", "d": "Column/row level access control. Mask non-production data. Audit all queries."}, {"t": "Re-identification", "d": "Combining anonymized datasets to reveal identities. Netflix Prize example."}, {"t": "Secure Random", "d": "Use cryptographic RNG (SecureRandom, /dev/urandom). NOT Math.random() for security."}, {"t": "Constant-Time Comparison", "d": "Prevents timing attacks on cryptographic values. Compare all bytes regardless of early mismatch."}, {"t": "OWASP SAMM", "d": "Software Assurance Maturity Model. Assesses organizational security practices maturity."}], "formulas": ["SDLC: Requirements → Design → Develop → Test → Operate", "STRIDE: Spoofing, Tampering, Repudiation, Information disclosure, DoS, Elevation", "Agile values: Individuals > Processes | Software > Docs | Collaboration > Contracts | Change > Plan", "DevSecOps: Shift Left = security earlier in pipeline", "SQL Injection: ' OR 1=1 -- → parameterized queries prevent", "XSS: <script>malicious<\/script> → output encoding prevents", "CSRF: Forged authenticated request → anti-CSRF token prevents", "IDOR: Changing URL parameters to access other users' data", "SSRF: Server-side request to internal resources via attacker input", "Cardinality = rows (tuples) | Degree = columns (attributes)", "ACID: Atomicity + Consistency + Isolation + Durability", "Normalization: 1NF → 2NF → 3NF (cumulative)", "SQLi prevention: Parameterized queries > stored procedures > input validation", "Expert System = Knowledge Base + Inference Engine", "SW-CMM: Initial → Repeatable → Defined → Managed → Optimized", "IDEAL: Initiating → Diagnosing → Establishing → Acting → Learning", "High Cohesion + Low Coupling = Good OOP design (\"HiCo LoCo\")", "Testing: Unit → Integration → System → Regression → UAT", "Verification = meets spec | Validation = works in real world", "SCA = Software Composition Analysis (checks dependencies for CVEs)", "SBOM = Software Bill of Materials (component inventory)", "Code signing: Developer signs with private key → user verifies with public key", "API security: AuthN + AuthZ + Rate limiting + Input validation + TLS + Logging", "Shift left: Cost of fixing bugs increases 10-100x from dev to production", "Pipeline: Code → SAST → SCA → Build → Container Scan → IaC Scan → Deploy → DAST", "Secrets management: Dynamic secrets + short TTL + automatic rotation", "OAuth 2.0 grant types: Authorization Code (web), Client Credentials (service-to-service), PKCE (mobile/SPA)", "JWT structure: Header.Payload.Signature — base64url encoded", "Rate limiting: Token bucket or sliding window algorithms"], "aids": ["SDLC: \"Really Diligent Developers Test Operations\"", "STRIDE: \"Spooky Tamperers Repudiate Information, Deny Service, Elevate Privileges\"", "Agile: \"I Work with Change\" (Individuals, Working software, Collaboration, Change)", "\"Shift Left = Start Security Sooner\"", "\"SQLi = Sneaky Query Language injection — use Prepared statements\"", "\"XSS = Cross-Site Scripting — encode Output, enforce CSP\"", "\"CSRF = Cross-Site Request Forgery — Token defense\"", "\"OWASP = Open Web Application Security Project — Top 10 awareness\"", "\"A Car has Rows\" (cARdinality = rows). \"A Degree has Columns\"", "ACID: \"All Consistent, Isolated, Durable\" — reliable transactions", "\"Poly = multiple versions for multiple clearances\"", "\"Prepared statements Prevent SQL injection\"", "SW-CMM: \"I Rarely Define Metrics Optimally\"", "IDEAL: \"I Diagnose, Establish, Act, Learn\"", "\"HiCo LoCo\" — High Cohesion, Low Coupling = good design", "\"Secure = Shut, Open = Out\" — fail-secure denies, fail-open allows", "Testing hierarchy: \"U-I-S-R-U\" — Unit, Integration, System, Regression, UAT", "\"UISRU\" — Unit, Integration, System, Regression, UAT", "\"SCA Scans Components for Alerts\" — Software Composition Analysis", "\"SBOM = Shopping list for software ingredients\"", "\"SolarWinds = Supply chain Solar flare\" — compromised build pipeline", "DevSecOps: \"Dev Secures Operations\" — security is everyone's job", "Shift left: \"Sooner = Safer = Savings\"", "Pipeline gates: \"Secrets, Static, Supply-chain, Container, Config, Dynamic\" — SSSCCD", "BOLA: \"Broken Object = Bad authorization on Object IDs\"", "API security layers: \"AAIRV\" — Authentication, Authorization, Input validation, Rate limiting, Versioning", "mTLS: \"Mutual = Both sides show their ID\"", "Service mesh: \"Mesh Manages Microservice security\"", "Input handling: \"VECO\" — Validate input, Encode output, Canonicalize first, Only whitelist", "Secure coding: \"NIPPLE\" — Never trust input, Input validate, Parameterize queries, Properly handle errors, Log events, Encode output", "OOP: \"EIPA\" — Encapsulation, Inheritance, Polymorphism, Abstraction", "HiCo LoCo: \"High Cohesion (focused), Low Coupling (independent)\"", "Encapsulation: \"Envelope that hides and protects the contents\"", "Aggregation vs Inference: \"Aggregation Adds up pieces, Inference deduces from clues\"", "Database security: \"VSPA\" — Views (restrict), Stored procedures (control), Polyinstantiation (anti-inference), Access controls (enforce)\"", "Normal forms: \"1NF=No repeating groups, 2NF=No partial dependencies, 3NF=No transitive dependencies\"", "SBOM: \"Software's complete ingredient list\"", "Third-party risks: \"LEVEL\" — License obligations, EOL risk, Vulnerabilities, Evil updates (supply chain), Legacy dependencies", "Environments: \"DTP\" — Development (write code), Testing (validate), Production (live — restricted)", "Code promotion: \"RRTADV\" — Request, Review, Test, Approve, Deploy, Verify", "Dev SoD: \"Writers don't Release, Reviewers don't Write\"", "Essential headers: \"CHXRP\" — CSP, HSTS, X-Frame-Options, Referrer-Policy, Permissions-Policy", "CSP: \"Content Sources are Policed\" — controls where content loads from", "HSTS: \"HTTP Strictly uses TLS — enforced by browser\"", "Waterfall phases: \"RDIVM\" — Requirements, Design, Implementation, Verification, Maintenance", "Spiral: \"OIDP\" in cycles — Objectives, Identify risks, Develop, Plan next", "Agile Manifesto: \"IWCR\" — Individuals, Working software, Collaboration, Responding to change", "Verification vs Validation: \"Verification = specs, Validation = satisfaction\"", "Mobile storage: \"Keystore, not Cleartext\" — use platform secure storage", "Mobile controls: \"CCRRT\" — Certificate pinning, Code obfuscation, Root detection, Runtime tamper check, Transport security", "API security: \"AAIRV\" — Authentication, Authorization, Input validation, Rate limiting, Versioning", "OWASP API Top risks: \"BOLA at the top, Broken Auth next\" — object-level authz is #1", "CI/CD security stages: \"SSDCI\" — Secrets scan, SAST/SCA, DAST, Container scan, IaC scan", "Container security: \"MIRR\" — Minimal image, Image scanning, Runtime restrictions, RBAC", "Supply chain attacks: \"STDC\" — SolarWinds (build), Typosquatting (naming), Dependency confusion (priority), Codecov (CI/CD)", "SLSA levels: \"1=Documented, 2=Authenticated, 3=Hardened, 4=Reproducible\"", "Secure design: \"FLD-S\" — Fail-secure, Least privilege, Defense in depth, Separation of privilege", "Validation: \"WCO\" — Whitelist input, Canonicalize, Output encode\"", "OWASP 2021 top 3: \"BAC-CF-Inj\" — Broken Access Control, Cryptographic Failures, Injection", "Injection defenses: \"PVO\" — Parameterized queries, Validate input, Output encode", "Secure coding pillars: \"VEP-EL\" — Validate input, Encode output, Parameterize queries, Error handling, Logging", "Memory safety: \"DABS\" — DEP/NX, ASLR, Bounds checking, Stack canaries", "Data lake zones: \"RCP\" — Raw (everything in), Curated (cleaned/classified), Published (access-controlled)", "Big data risks: \"RIC\" — Re-identification, Inference, Compliance (right to erasure)", "SQL injection prevention: \"PISW\" — Parameterized queries, Input validation, Stored procedures, WAF", "Database encryption: \"TCA\" — TDE (storage), Column-level (field), Application-level (before storage)", "Mobile storage security: \"KNSP\" — Keychain/Keystore (use), Never plaintext, SQLite encrypted, Preferences secured", "OWASP Mobile risks: \"DCAMP\" — Data storage, Communication, Authentication, Modification (tampering), Platform misuse", "Software evaluation: \"VVFSV\" — Vendor practices, Vulnerability history, Features, Security assessment, Viability", "Open-source risks: \"ASLU\" — Abandoned projects, Supply chain attacks, License issues, Unmanaged dependencies", "DevSecOps pipeline: \"PCBTRDOM\" — Plan, Code, Build, Test, Release, Deploy, Operate, Monitor", "SDLC models: \"WASD\" — Waterfall (sequential), Agile (iterative), Spiral (risk-driven), DevOps (continuous)", "AI attacks: \"ADMMP\" — Adversarial examples, Data poisoning, Model inversion, Model stealing, Prompt injection", "Responsible AI: \"BEPA\" — Bias mitigation, Explainability, Privacy, Accountability", "Repo security layers: \"AABS\" — Authentication (SSH/tokens), Authorization (RBAC), Branch protection, Secrets scanning", "Secret leak response: \"RRR\" — Remove from repo (rewrite history), Rotate the secret, Review access logs", "Advanced web attacks: \"BSDRX\" — Business logic, SSRF, Deserialization, Race conditions, XXE", "SSRF targets: \"MIFS\" — Metadata endpoints, Internal services, File systems, Scanning internal networks", "Change management: \"RTRIP\" — Request, Test, Review (CAB), Implement, Post-review", "Change categories: \"SNE\" — Standard (routine), Normal (CAB review), Emergency (fast-track)", "SW-CMM: \"I Rarely Define Metrics Optimally\" — Initial, Repeatable, Defined, Managed, Optimizing", "ACID: \"A Car Is Durable\" — Atomicity, Consistency, Isolation, Durability"]}];
