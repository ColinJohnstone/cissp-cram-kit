data plane for programmable, centralized network management. NFV virtualizes network functions (firewalls, load balancers) as software. Both enable agile security but introduce new attack surfaces."}, {"t": "Secure Communication Protocols: SSH, TLS 1.3, and IPsec", "d": "SSH provides encrypted remote access (port 22). TLS 1.3 is the latest secure transport protocol. IPsec provides Layer 3 network encryption. Each has specific use cases, strengths, and configuration requirements."}, {"t": "Network Monitoring: IDS, IPS, and SIEM Integration", "d": "IDS detects intrusions (passive). IPS prevents intrusions (inline). Types: NIDS/NIPS (network) and HIDS/HIPS (host). Detection methods: signature-based (known threats), anomaly-based (deviations from baseline), and heuristic (behavioral patterns)."}, {"t": "IPv6 Security Considerations", "d": "IPv6 expands the address space to 128 bits, includes built-in IPsec support, uses NDP instead of ARP, and introduces new security considerations including neighbor discovery attacks, tunneling risks, and dual-stack vulnerabilities."}, {"t": "Wireless Attacks and Countermeasures", "d": "Wireless attacks include rogue APs, evil twins, deauthentication attacks, WPS brute force, and Bluetooth attacks (Bluejacking, Bluesnarfing, Bluebugging). Countermeasures include WIPS, 802.1X, and wireless security policies."}, {"t": "Network Architecture: DMZ, Bastion Hosts, and Screened Subnets", "d": "Network architecture uses zones of trust: internal (trusted), DMZ (semi-trusted), external (untrusted). Bastion hosts are hardened systems exposed to untrusted networks. Screened subnet architecture uses routers and firewalls for layered protection."}, {"t": "Secure Network Protocols and Port Numbers", "d": "Critical port numbers and their security implications. Secure protocols replace insecure ones: SSH (22) replaces Telnet (23), SFTP/SCP replace FTP (21), HTTPS (443) replaces HTTP (80), LDAPS (636) replaces LDAP (389)."}, {"t": "Multilayer Protocol Security", "d": "Understanding how protocols interact across OSI layers and the security implications of protocol encapsulation, tunneling, and covert channels."}, {"t": "Microsegmentation and Zero Trust Networking", "d": "Implementing granular network segmentation at the workload level to enforce least-privilege network access in modern data centers and cloud environments."}, {"t": "Email Security Protocols", "d": "Securing email communication through authentication, encryption, and anti-spoofing protocols including SPF, DKIM, DMARC, and S/MIME."}, {"t": "WAN Technologies and Circuit-Switched vs Packet-Switched Networks", "d": "Understanding WAN connectivity options including dedicated circuits, packet-switched networks, MPLS, SD-WAN, and their security implications."}, {"t": "Content Distribution and Caching Security", "d": "Security considerations for CDNs, web caches, proxy servers, and content delivery architectures including cache poisoning and edge security."}, {"t": "Network Traffic Analysis and Flow Monitoring", "d": "Techniques for monitoring and analyzing network traffic patterns including NetFlow, sFlow, packet capture, and traffic baseline analysis."}, {"t": "Network Access Control Implementation", "d": "Implementing pre-admission and post-admission network access controls using 802.1X, NAC agents, health checks, and remediation networks."}, {"t": "Cellular and Mobile Network Security", "d": "Security architecture of cellular networks from 3G through 5G, including mobile communication protocols, IMSI catchers, and mobile device threats."}, {"t": "Load Balancing and High Availability Networking", "d": "Network-level high availability through load balancers, clustering, failover mechanisms, and redundant network architectures."}, {"t": "Secure Remote Access and VPN Architectures", "d": "VPN technologies, remote access architectures, and secure connectivity solutions including IPsec, SSL/TLS VPN, split tunneling, and always-on VPN."}, {"t": "Network Attacks and Countermeasures", "d": "Common network-level attacks including DDoS, ARP spoofing, VLAN hopping, man-in-the-middle, and BGP hijacking with their countermeasures."}, {"t": "Satellite and Alternative Communication Systems", "d": "Security considerations for satellite communications, Li-Fi, Bluetooth, NFC, RFID, and other alternative communication technologies."}, {"t": "Firewall Types and Generations", "d": "Evolution of firewall technologies from packet filters through next-generation firewalls, including deployment architectures and selection criteria."}, {"t": "Network Segmentation and Architecture", "d": "Designing secure network architectures using VLANs, DMZs, screened subnets, bastion hosts, and network segmentation strategies."}, {"t": "Wireless Security Standards and Attacks", "d": "Comprehensive review of wireless protocols from WEP through WPA3, wireless attacks, and enterprise wireless security deployment."}, {"t": "DNS Security and Attacks", "d": "DNS infrastructure security including DNSSEC, DNS over HTTPS/TLS, DNS attacks, and protective DNS services."}, {"t": "Software-Defined Networking Security", "d": "Security implications of SDN including controller security, API protection, programmable security policies, and SDN-specific threats."}, {"t": "Unified Communications Security", "d": "Securing voice, video, messaging, and collaboration platforms including VoIP, SIP, and conferencing security."}, {"t": "Cloud Networking Security", "d": "Network security in cloud environments including VPCs, security groups, transit gateways, and cloud-native network controls."}, {"t": "Network Protocol Vulnerabilities", "d": "Security weaknesses in common network protocols including ARP, BGP, ICMP, and SNMP with attack vectors and mitigations."}, {"t": "TCP/IP Protocol Suite Security", "d": "TCP/IP protocols were designed for reliability, not security. Understanding TCP three-way handshake, SYN floods, session hijacking, IP spoofing, and protocol-level attacks is essential for the CISSP exam."}, {"t": "Network Segmentation Strategies", "d": "Network segmentation divides the network into zones with different security levels. Strategies include VLANs, subnets, DMZs, micro-segmentation, and zero trust network access. Segmentation limits lateral movement after a breach."}, {"t": "TLS 1.3 and Secure Communication Protocols", "d": "TLS 1.3 significantly improves upon previous versions with faster handshake, mandatory forward secrecy, and removal of weak algorithms. Understanding protocol evolution and configuration best practices is essential."}, {"t": "Wireless Security: WPA3, EAP Methods, and Attack Vectors", "d": "Wireless security has evolved from WEP (broken) through WPA/WPA2 to WPA3. Understanding authentication methods (EAP types), encryption protocols, and wireless-specific attacks is critical."}, {"t": "IPv6 Security Considerations", "d": "IPv6 introduces security changes: mandatory IPsec support (but not mandatory use), larger address space reducing scanning, but new attack surfaces including NDP attacks, extension header abuse, and dual-stack vulnerabilities."}, {"t": "Network-Based Intrusion Detection and Prevention", "d": "NIDS/NIPS detect and prevent network attacks using signature-based, anomaly-based, and stateful protocol analysis methods. Understanding detection methods, deployment placement, and limitations is critical."}, {"t": "VPN Technologies: IPsec, SSL/TLS, and WireGuard", "d": "VPNs create encrypted tunnels over untrusted networks. IPsec operates at Layer 3 for site-to-site VPNs. SSL/TLS VPNs work at Layer 4-7 for remote access. WireGuard is a modern alternative with simpler design."}, {"t": "DDoS Attack Types and Mitigations", "d": "Distributed Denial of Service attacks overwhelm targets through volumetric (bandwidth), protocol (state table), or application-layer (resource) attacks. Defense requires multi-layered mitigation including ISP scrubbing, CDN, and WAF."}, {"t": "Email Security: SPF, DKIM, DMARC, and S/MIME", "d": "Email authentication protocols (SPF, DKIM, DMARC) prevent spoofing and phishing. S/MIME provides end-to-end email encryption and signing. Together they address the major email security threats."}, {"t": "SDN and Network Function Virtualization Security", "d": "Software-Defined Networking separates the control plane from the data plane, centralizing network management. NFV virtualizes network functions (firewalls, load balancers). Both introduce new security considerations."}, {"t": "Secure Network Architecture: Bastion Hosts, Screened Subnets, and Proxy Servers", "d": "Secure network architectures use bastion hosts (hardened public-facing systems), screened subnets (DMZ with dual firewalls), and proxy servers (intermediaries hiding internal systems) to protect internal resources."}, {"t": "OSI Model Security Analysis", "d": "Understanding which security protocols and attacks operate at each OSI layer is fundamental. Each layer has specific vulnerabilities, protocols, and countermeasures that the CISSP exam tests extensively."}, {"t": "Network Address Translation and Its Security Implications", "d": "NAT translates private IP addresses to public addresses, providing a form of security by obscuring internal network topology. However, NAT is not a security control and has implications for IPsec, VoIP, and IPv6 transition."}, {"t": "DNSSEC, DoH, and DNS Security", "d": "DNS is critical infrastructure vulnerable to spoofing, cache poisoning, and amplification attacks. DNSSEC provides authentication and integrity. DNS over HTTPS (DoH) and DNS over TLS (DoT) provide confidentiality."}, {"t": "Network Monitoring: NetFlow, sFlow, and Packet Capture", "d": "Network monitoring tools provide different levels of visibility. NetFlow/sFlow provide metadata about traffic flows. Full packet capture provides complete content. Each serves different security monitoring needs."}, {"t": "Cloud Networking and Virtual Network Security", "d": "Cloud networking uses virtual constructs (VPCs, subnets, security groups, NACLs) that require different security approaches than physical networks. Understanding these constructs is essential for cloud security."}, {"t": "IoT and Embedded Device Security", "d": "Internet of Things (IoT) devices expand the attack surface with constrained resources, infrequent patching, default credentials, and long deployment lifetimes. Securing IoT requires lightweight cryptography, network segmentation, and lifecycle management."}, {"t": "Bluetooth and Short-Range Wireless Security", "d": "Bluetooth, NFC, and other short-range wireless protocols have unique security vulnerabilities including eavesdropping, MITM attacks, and device tracking. Understanding attack vectors and mitigations is essential."}, {"t": "Content Distribution Networks and Edge Security", "d": "CDNs distribute content across geographically dispersed edge servers, improving performance and resilience. CDN security includes DDoS mitigation, WAF integration, TLS termination, and origin protection."}, {"t": "WAN Technologies and Secure Communications", "d": "WAN technologies connect geographically distributed sites. Understanding MPLS, SD-WAN, leased lines, and their security properties helps architects choose appropriate connectivity for different security requirements."}], "review": [{"t": "OSI Model", "d": "7 layers: Physical, Data Link, Network, Transport, Session, Presentation, Application"}, {"t": "TCP/IP Model", "d": "4 layers: Network Access, Internet, Transport, Application"}, {"t": "TCP vs UDP", "d": "TCP = reliable, connection-oriented, 3-way handshake. UDP = fast, connectionless, no guarantee."}, {"t": "Stateful Firewall", "d": "3rd gen — tracks connections in state table (L3-4)"}, {"t": "Application Proxy", "d": "2nd gen — Layer 7 deep inspection, most secure but slowest"}, {"t": "WEP", "d": "BROKEN — 24-bit IV, RC4. Never use."}, {"t": "WPA3/SAE", "d": "Current standard — SAE (Dragonfly), forward secrecy, OWE for open networks"}, {"t": "EAP-TLS", "d": "Most secure wireless auth — mutual certificate authentication"}, {"t": "SYN Flood", "d": "Half-open TCP connections exhaust connection table. Counter: SYN cookies."}, {"t": "VLAN Hopping", "d": "Switch spoofing or double tagging to bypass VLAN isolation"}, {"t": "DMZ", "d": "Network segment between two firewalls hosting public-facing services"}, {"t": "Micro-segmentation", "d": "Per-workload security policies, enabled by SDN, supports zero trust"}, {"t": "DNSSEC", "d": "DNS Security Extensions — signs DNS records for authentication + integrity. Does NOT encrypt (no confidentiality)."}, {"t": "DoH vs DoT", "d": "DNS over HTTPS (port 443) vs DNS over TLS (port 853). Both encrypt DNS queries for privacy."}, {"t": "DNS Tunneling", "d": "Data exfiltration encoded in DNS queries. Hard to detect — DNS rarely blocked. Monitor for unusual patterns."}, {"t": "NAC", "d": "Network Access Control — verifies device compliance before granting access. Quarantines non-compliant devices."}, {"t": "802.1X", "d": "Port-based access control: Supplicant → Authenticator → Auth Server (RADIUS). Port blocked until authenticated."}, {"t": "DHCP Snooping", "d": "Switch feature preventing rogue DHCP servers. Only trusted ports can send DHCP responses."}, {"t": "DAI", "d": "Dynamic ARP Inspection — validates ARP packets against DHCP snooping database. Prevents ARP spoofing."}, {"t": "TACACS+ vs RADIUS", "d": "TACACS+ encrypts entire payload (device mgmt). RADIUS encrypts only password (network access). Both are AAA."}, {"t": "SIP/RTP/SRTP", "d": "SIP = VoIP call setup. RTP = media transport. SRTP = encrypted media. Voice on dedicated VLAN."}, {"t": "VOMIT/SPIT", "d": "VOMIT = VoIP eavesdropping. SPIT = Spam over Internet Telephony."}, {"t": "SDN Architecture", "d": "Application → Control (SDN controller) → Infrastructure. Controller is brain and single point of failure."}, {"t": "NFV", "d": "Network Function Virtualization — replaces hardware appliances with software on commodity servers."}, {"t": "TLS 1.3", "d": "1-RTT handshake, ECDHE mandatory, no RSA key exchange, AEAD only. TLS 1.0/1.1 deprecated."}, {"t": "IDS vs IPS", "d": "IDS = detect only (passive, detective). IPS = detect and prevent (inline, preventive)."}, {"t": "Signature vs Anomaly Detection", "d": "Signature = known threats, low FP. Anomaly = unknown threats, higher FP. Use both together."}, {"t": "False Positive vs Negative", "d": "FP = false alarm (Type I). FN = missed attack (Type II, more dangerous)."}, {"t": "SIEM", "d": "Security Info and Event Management — aggregates logs, correlates events, alerts, compliance reporting."}, {"t": "SOAR", "d": "Security Orchestration, Automation, Response — extends SIEM with automated playbooks."}, {"t": "IPv6", "d": "128-bit addresses. NDP replaces ARP. No broadcast. Built-in IPsec (optional in practice). Dual-stack = double attack surface."}, {"t": "Rogue AP vs Evil Twin", "d": "Rogue = unauthorized AP on network. Evil twin = attacker AP mimicking legitimate SSID."}, {"t": "Deauth Attack", "d": "Forged 802.11 deauthentication frames. Unencrypted in WPA2. Fixed by WPA3 PMF/802.11w."}, {"t": "Bluejacking/Snarfing/Bugging", "d": "Bluejacking = messages (annoying). Bluesnarfing = data theft. Bluebugging = device control (most serious)."}, {"t": "Bastion Host", "d": "Hardened system at network perimeter. Minimal services, extensive logging, closely monitored."}, {"t": "Screened Subnet", "d": "Two screening routers with bastion host between them. Most secure traditional network architecture."}, {"t": "Key Ports", "d": "SSH=22, DNS=53, HTTP=80, Kerberos=88, LDAP=389, HTTPS=443, LDAPS=636, RDP=3389."}, {"t": "CDN Security", "d": "DDoS absorption, WAF at edge, TLS termination (can see plaintext). Protect origin IP."}, {"t": "WPS", "d": "Wi-Fi Protected Setup — brute-forceable PIN. Always disable. Effectively 11,000 combinations."}, {"t": "Microsegmentation", "d": "Workload-level network segmentation. East-west traffic control. Aligned with Zero Trust."}, {"t": "Zero Trust", "d": "Never trust, always verify. NIST 800-207. Verify explicitly, least privilege, assume breach."}, {"t": "SPF", "d": "Sender Policy Framework — DNS TXT record listing authorized mail servers for a domain."}, {"t": "DKIM", "d": "DomainKeys Identified Mail — cryptographic signature on email headers, public key in DNS."}, {"t": "DMARC", "d": "Domain-based Message Authentication — policy for SPF/DKIM failures (none/quarantine/reject) + reporting."}, {"t": "S/MIME", "d": "Secure email using X.509 certificates (PKI). Provides encryption + signing. End-to-end."}, {"t": "PGP", "d": "Pretty Good Privacy — email encryption using web of trust model (not PKI)."}, {"t": "MPLS", "d": "Multi-Protocol Label Switching — label-based forwarding, QoS, VPN. NOT encrypted by default."}, {"t": "SD-WAN", "d": "Software-Defined WAN — application-aware routing over any transport. Encrypts with IPsec."}, {"t": "T1/T3 Speeds", "d": "T1 = 1.544 Mbps (24 channels). T3 = 44.736 Mbps (672 channels)."}, {"t": "Forward Proxy", "d": "Protects CLIENTS — content filtering, anonymity, caching."}, {"t": "Reverse Proxy", "d": "Protects SERVERS — load balancing, WAF, SSL offloading."}, {"t": "Cache Poisoning", "d": "Injecting malicious content into cache. Served to many users from cache."}, {"t": "NetFlow/IPFIX", "d": "Flow metadata (src/dst IP, ports, bytes). Less storage than PCAP. No payload capture."}, {"t": "TAP vs SPAN", "d": "TAP = passive, no packet loss. SPAN/mirror = potential loss under load."}, {"t": "Beaconing", "d": "Malware calling home at regular intervals. Detected via traffic baseline analysis."}, {"t": "EAP-TLS", "d": "Strongest 802.1X method — mutual certificate authentication."}, {"t": "MAB", "d": "MAC Authentication Bypass — fallback for devices without 802.1X supplicant. Less secure."}, {"t": "IMSI Catcher", "d": "Rogue base station (Stingray). Exploits 2G/3G one-way auth. 5G uses SUCI to prevent."}, {"t": "SIM Swapping", "d": "Social engineering carrier to transfer phone number. Defeats SMS-based 2FA."}, {"t": "NFC Relay Attack", "d": "Extending NFC range electronically to make fraudulent contactless payments at distance."}, {"t": "VRRP/HSRP", "d": "Gateway redundancy protocols — virtual IP with automatic failover. Sub-second failover."}, {"t": "L4 vs L7 Load Balancer", "d": "L4 = IP/port routing (fast). L7 = content-aware routing (smart, can inspect HTTP)."}, {"t": "Active-Active vs Active-Passive", "d": "AA = all serve traffic (max capacity). AP = standby waits (simpler)."}, {"t": "IPsec Modes", "d": "Transport = payload only (host-to-host). Tunnel = entire packet (site-to-site)."}, {"t": "AH vs ESP", "d": "AH = integrity only, NO encryption (protocol 51). ESP = encryption + integrity (protocol 50)."}, {"t": "IKE Phases", "d": "Phase 1 = secure channel (ISAKMP SA). Phase 2 = IPsec SA for data transfer."}, {"t": "Split Tunneling", "d": "Only corporate traffic through VPN. Risk: device on two networks simultaneously."}, {"t": "SASE", "d": "Secure Access Service Edge — converges SD-WAN + CASB + SWG + ZTNA + FWaaS in cloud."}, {"t": "DDoS Types", "d": "Volumetric (bandwidth), Protocol (resources), Application (services). Use CDN + rate limiting."}, {"t": "ARP Spoofing", "d": "Forged ARP replies redirect traffic. L2 attack. Counter: DAI + DHCP snooping."}, {"t": "MAC Flooding", "d": "Overwhelm CAM table → switch acts as hub. Counter: port security."}, {"t": "BGP Hijacking", "d": "Unauthorized route announcements redirect traffic. Counter: RPKI/ROA."}, {"t": "Covert Channels", "d": "Storage = hide data in shared resources. Timing = modulate system timing. Both bypass normal controls."}, {"t": "Protocol Encapsulation", "d": "Higher-layer data in lower-layer frames. Can bypass layer-specific security controls."}, {"t": "Packet Filter", "d": "1st gen firewall — L3/4 only. Fastest but no state/content inspection. ACL-based."}, {"t": "Application Proxy", "d": "2nd gen — L7 deep inspection. Most secure but slowest. Breaks direct connections."}, {"t": "NGFW", "d": "Next-Gen Firewall — stateful + DPI + app awareness + IPS + identity + TLS inspection."}, {"t": "WAF", "d": "Web Application Firewall — L7 HTTP protection. SQL injection, XSS, CSRF detection."}, {"t": "UTM", "d": "Unified Threat Management — all-in-one: FW + IPS + AV + content filter + VPN. SMB solution."}, {"t": "Screened Subnet", "d": "Two firewalls with DMZ between. Public services in DMZ, internal network protected by inner firewall."}, {"t": "Three-Tier Architecture", "d": "Web (DMZ) → App (restricted) → Database (protected). Each tier communicates only with adjacent."}, {"t": "Air Gap", "d": "Physical network isolation. Highest security. Not perfect (Stuxnet via USB)."}, {"t": "WEP", "d": "BROKEN — 24-bit IV, RC4. Key recovered in minutes. Never use."}, {"t": "WPA2", "d": "AES-CCMP encryption. PSK (home) or Enterprise (802.1X/RADIUS). Current minimum standard."}, {"t": "WPA3", "d": "SAE (forward secrecy), OWE (encrypted open networks), PMF (protected management frames)."}, {"t": "Evil Twin", "d": "Rogue AP with same SSID as legitimate network. Captures credentials. Counter: 802.1X/EAP-TLS."}, {"t": "Karma Attack", "d": "Rogue AP responds to ANY probe request — impersonates any remembered network."}, {"t": "KRACK", "d": "Key Reinstallation Attack — WPA2 4-way handshake vulnerability. Patched."}], "formulas": ["OSI: 1-Physical, 2-Data Link, 3-Network, 4-Transport, 5-Session, 6-Presentation, 7-Application", "TCP/IP: 1-Network Access, 2-Internet, 3-Transport, 4-Application", "Data units: Data → Segments → Packets → Frames → Bits", "TCP three-way handshake: SYN → SYN-ACK → ACK", "Well-known ports: 0-1023 | Registered: 1024-49151 | Dynamic: 49152-65535", "SYN flood: SYN → SYN-ACK → (no ACK) — fills connection table", "Smurf: spoofed ICMP echo → broadcast → amplified replies to victim", "Fraggle: same as Smurf but UDP instead of ICMP", "DNS amplification factor: response size / request size (50-500x typical)", "ARP spoofing: fake ARP reply → attacker MAC mapped to gateway IP", "1st gen = Packet Filter = Layer 3 = Stateless", "2nd gen = Application Proxy (L7) + Circuit-level (L5/SOCKS)", "3rd gen = Stateful Inspection = L3-4 = Connection tracking", "NGFW = Stateful + IDS/IPS + App awareness + TLS inspection", "WEP: RC4 + 24-bit IV = BROKEN", "WPA: RC4 + TKIP = improved but deprecated", "WPA2: AES-CCMP = current standard", "WPA3: SAE (Dragonfly) + forward secrecy + OWE", "802.1X: Supplicant → Authenticator → Authentication Server (RADIUS)", "VLAN ID: 12-bit field = 4,094 possible VLANs (802.1Q)", "DMZ: Internet → Firewall1 → DMZ → Firewall2 → Internal", "SDN: Control Plane (decisions) + Data Plane (forwarding)", "Segmentation reduces: attack surface, blast radius, compliance scope", "AH: IP Protocol 51 — integrity + authentication, NO encryption", "ESP: IP Protocol 50 — encryption + integrity + authentication", "IKEv1: Phase 1 (ISAKMP SA) → Phase 2 (IPsec SA)", "Transport mode: host-to-host | Tunnel mode: gateway-to-gateway", "SPF: DNS TXT record → authorized sending IPs for a domain", "DKIM: Private key signs headers → public key in DNS verifies", "DMARC: SPF + DKIM + Policy (none/quarantine/reject) + Reporting", "S/MIME: X.509 + RSA + AES = encrypted and signed email"], "aids": ["\"Please Do Not Touch Steve's Pet Alligator\" — Physical to Application", "\"Some People Forget Birthdays\" — Segments, Packets, Frames, Bits", "TCP = \"Trustworthy Communication Protocol\" | UDP = \"Unreliable Delivery Protocol\"", "ARP = \"Address Resolution Protocol\" — resolves IP to MAC (Layer 2)", "Smurf = Small ICMP multiplied; Fraggle = Fragment-like UDP", "MITM = \"Man Intercepts Two Messages\"", "DNSSEC = \"DNS Signatures Ensure Correctness\"", "SYN cookies = \"Stateless defense against SYN floods\"", "1st gen = Packet = Primitive and fast", "2nd gen = Proxy = Protective but Plodding", "3rd gen = Stateful = Smart tracking", "NGFW = \"Next Gen Filters Whatever\" — does everything", "WEP = \"Woefully Easy to Penetrate\"", "SAE = \"Secure Against Everything (offline attacks)\"", "EAP-TLS = \"Two-way Lockdown Security\" (mutual certs)", "PEAP = \"Protected EAP = Password inside TLS tunnel\"", "CSMA/CA = wireless Avoids collisions; CSMA/CD = wired Detects collisions", "VLAN hopping: \"Switch Spoofing + Double Tagging = Two attacks\"", "DMZ = \"Demilitarized Middleground Zone\" — between two firewalls", "Micro-seg = \"Micro fences around each workload\"", "SDN: \"Software Decides Networking\" — centralized brain, distributed muscle", "AH = \"Authentication Handles integrity\" (no encryption)", "ESP = \"Encrypts Security Payload\" (does everything)", "Transport = \"This payload only\" | Tunnel = \"Total packet wrapped\"", "IKE phases: \"Phase 1 builds the road, Phase 2 drives the traffic\"", "Email security stack: \"SPF checks the Server, DKIM checks the Data, DMARC makes the Decision\"", "DMARC policies: \"NQR\" — None (monitor), Quarantine (spam), Reject (block)", "S/MIME vs PGP: \"S/MIME = Structure (CA hierarchy), PGP = People (web of trust)\"", "DNSSEC: \"DNS Signatures Ensure Correctness\" (but not confidentiality)", "DoH vs DoT: \"DoH Hides in HTTPS (443), DoT has its own porT (853)\"", "DNS tunneling: \"Data Needs Smuggling through DNS\"", "CDN security benefits: \"DWAG\" — DDoS absorption, WAF, Access control, Geo-blocking", "CDN risks: \"CTOP\" — Cache poisoning, TLS visibility, Origin exposure, Privacy concerns", "802.1X roles: \"SAA\" — Supplicant, Authenticator, Authentication server", "NAC process: \"AACRr\" — Authenticate, Assess compliance, Connect or Quarantine, Remediate", "Switch security: \"PDDIDBS\" — Port security, DHCP snooping, DAI, IP Source Guard, Disable unused ports, BPDU guard, STP protection", "Router security: \"DULSN\" — Disable unused services, Use SSH, Logging, SNMP v3, NTP", "VoIP security: \"VETS\" — VLAN separation, Encryption (SRTP/TLS), Toll fraud prevention, SPIT/SPAM filtering", "VoIP attacks: \"VS-VoIP\" — VOMIT, SPIT, SIP flooding, toll fraud", "SDN layers: \"ACI\" — Application, Control, Infrastructure (top to bottom)", "NFV: \"No Fixed hardware needed for Virtualized network Functions\"", "TLS 1.3 improvements: \"FESA\" — Faster (1-RTT), Eliminated insecure algorithms, Simplified cipher suites, AEAD only", "SSH: \"Secure Shell = Say goodbye to Telnet\"", "Protocol layers: \"SSH=Application, TLS=Transport, IPsec=Network\"", "IDS = \"I Detect Stuff\" (passive). IPS = \"I Prevent Stuff\" (active inline)", "Errors: \"False Positive = False alarm (Type I), False Negative = Failed to detect (Type II)\"", "Detection: \"Signatures know the known, Anomalies spot the strange\"", "IPv6 security: \"No NAT, No broadcast, NDP replaces ARP, IPsec built-in\"", "IPv6 risks: \"TDNE\" — Tunneling bypass, Dual-stack doubles surface, NDP spoofing, Extension header evasion", "Bluetooth attacks by severity: \"Jacking < Snarfing < Bugging\" — annoyance < theft < control", "Wireless countermeasures: \"WEDSS\" — WPA3, EAP/802.1X, Disable WPS, Separate SSIDs, Site surveys", "DMZ: \"Defenders Monitor the Zone between two firewalls\"", "Trust zones: \"External (none) → DMZ (some) → Internal (full)\"", "Bastion: \"Built to withstand Attacks — Stripped and Hardened\"", "Key ports: \"22 SSH, 53 DNS, 80 HTTP, 88 Kerberos, 443 HTTPS, 389 LDAP, 636 LDAPS, 3389 RDP\"", "Secure replacements: \"Replace cleartext: Telnet→SSH, FTP→SFTP, HTTP→HTTPS, SNMP→v3, LDAP→LDAPS\"", "Covert channel types: \"STorage = STatic data hiding, Timing = Temporal modulation\"", "Tunneling attacks: \"DNS, ICMP, HTTP — DAH! They bypass firewalls\"", "Zero Trust pillars: \"VLA\" — Verify explicitly, Least privilege, Assume breach", "Traffic directions: \"NS=North-South (perimeter), EW=East-West (lateral)\"", "Email auth stack: \"SPF DKIM DMARC = Send Permission First, Digital Key Integrity Mark, Decision Maker And Report Creator\"", "S/MIME vs PGP: \"S/MIME = Standards PKI, PGP = People trust People\"", "T-carrier speeds: \"T1=1.5, T3=45, OC-3=155, OC-12=622, OC-48=2.5G\"", "WAN evolution: \"Leased Lines → Frame Relay → ATM → MPLS → SD-WAN\"", "Proxy direction: \"Forward = For clients, Reverse = Rear-guard for servers\"", "Cache attacks: \"Poisoning = bad content IN cache, Deception = sensitive content IN cache\"", "Flow monitoring: \"NetFlow = Network Flow summary, sFlow = Sampled Flow statistics\"", "TAP vs SPAN: \"TAP = Total Access Point (passive, no loss), SPAN = Some Packets Are Not copied (potential loss)\"", "802.1X roles: \"SAA — Supplicant Asks, Authenticator relays, Auth server Answers\"", "EAP strength: \"TLS > PEAP > FAST > MD5 (never use MD5)\"", "Cellular evolution: \"2G=voice+SMS, 3G=data+mutual auth, 4G=all IP+IPsec, 5G=slicing+SUCI+edge\"", "Mobile threats: \"SIBS — SIM swap, IMSI catcher, Baseband attack, SS7 exploit\"", "LB algorithms: \"RLWI — Round-robin, Least connections, Weighted, IP hash\"", "HA modes: \"AA=All Active (capacity), AP=Active Passive (simplicity)\"", "IPsec protocols: \"AH = Authentication Header (no encryption!), ESP = Encryption Security Payload (full protection)\"", "IKE phases: \"Phase 1 = Partners agree to talk securely, Phase 2 = Partners agree what to protect\"", "VPN types: \"Site-to-Site = IPsec tunnel, Remote Access = SSL/TLS, Always-On = Zero Trust\"", "DDoS types: \"VPA — Volumetric (bandwidth), Protocol (resources), Application (services)\"", "L2 attacks: \"AVM — ARP spoofing, VLAN hopping, MAC flooding\"", "VLAN hopping prevention: \"DNC — Disable DTP, Native VLAN change, Configure access ports\"", "Bluetooth attacks: \"Jack Snarf Bug — Bluejacking (annoying), Bluesnarfing (stealing), Bluebugging (controlling)\"", "Satellite orbits: \"GEO=Geosynchronous (high/slow), MEO=Medium, LEO=Low (close/fast)\"", "Firewall evolution: \"1-Packet, 2-Proxy, 3-Stateful, NG-Everything\"", "NGFW features: \"SADITU\" — Stateful + Application awareness + DPI + IPS + TLS inspection + User identity", "DMZ architecture: \"External FW → DMZ → Internal FW → LAN\" — two firewalls is key", "Network zones: \"Public → DMZ → Restricted → Protected → Air-gapped\" — increasing security", "Wireless evolution: \"WEP=Weak, WPA=Workaround, WPA2=Works, WPA3=Wonderful\"", "Wireless attacks: \"ERDWK\" — Evil twin, Rogue AP, Deauth, War driving, Karma", "DNS attacks: \"CATCH-D\" — Cache poisoning, Amplification, Tunneling, Compromise (hijacking), Hijacking, Domain shadowing", "DNS security layers: \"DNSSEC (authentic) + DoH/DoT (private) + Protective DNS (filtered)\"", "SDN layers: \"ACI\" — Application (apps), Control (controller/brain), Infrastructure (switches/forwarding)", "SDN APIs: \"North = REST (apps), South = OpenFlow (switches)\"", "VoIP protocols: \"SRS\" — SIP (signaling), RTP (media), SRTP (secure media)", "VoIP attacks: \"ETVCS\" — Eavesdropping, Toll fraud, Vishing, Caller ID spoofing, SIP flooding", "Cloud network security layers: \"VSN\" — VPC (isolation), Security groups (instance), NACLs (subnet)", "Cloud connectivity: \"VDP\" — VPN (encrypted internet), Direct Connect (dedicated physical), PrivateLink (private service access)", "Insecure protocols: \"ABIS\" — ARP (no auth), BGP (no auth), ICMP (abuse), SNMP v1/v2 (cleartext)", "Protocol defenses: \"DRDS\" — DAI (ARP), RPKI (BGP), Disable/rate-limit (ICMP), SNMPv3 (SNMP)", "OSI layers: \"Please Do Not Throw Sausage Pizza Away\" — Physical, Data Link, Network, Transport, Session, Presentation, Application", "TCP/IP layers: \"NITA\" — Network Access, Internet, Transport, Application"]}, {"code": "IAM", "name": "Identity and Access Management", "weight": "13", "topics": [{"t": "IAAA and Authentication Factors", "d": "IAAA establishes accountability. Four factor types: Type 1 (know — password), Type 2 (have — token), Type 3 (are — biometric), Type 4 (where — location). MFA requires 2+ different types."}, {"t": "Biometric Authentication: FRR, FAR, and CER", "d": "Biometrics authenticate based on physical or behavioral characteristics. FRR (Type 1 Error) rejects legitimate users. FAR (Type 2 Error) accepts imposters. CER (Crossover Error Rate) where FAR equals FRR is the primary accuracy metric — lower CER means more accurate."}, {"t": "Identity Lifecycle and Privileged Access Management", "d": "Identity lifecycle: Provisioning → Management → Deprovisioning. Provisioning must follow least privilege. Deprovisioning must be immediate upon termination. Privileged Access Management (PAM) controls admin accounts through vaulting, session recording, JIT elevation, and zero standing privileges."}, {"t": "SSO and Federation: SAML, OAuth, OpenID Connect", "d": "SAML provides enterprise SSO using XML assertions between IdP and SP. OAuth 2.0 is an authorization framework using access tokens. OpenID Connect adds authentication on top of OAuth. XACML defines access control policies. Federation enables cross-organization trust."}, {"t": "Kerberos and AAA Protocols", "d": "Kerberos v5 uses KDC (AS+TGS) for ticket-based authentication with symmetric encryption (AES). KDC is single point of failure. RADIUS: UDP, encrypts password only, combines AAA. TACACS+: TCP, encrypts everything, separates AAA. Diameter: not backward-compatible with RADIUS."}, {"t": "Access Control Models: DAC, MAC, RBAC, ABAC", "d": "DAC: owner decides (flexible, least secure). MAC: system-enforced labels (rigid, most secure). RBAC: role-based (most common in enterprise). ABAC: attribute-based (most flexible, supports complex policies). Rule-based uses if/then rules (firewalls). Implicit deny is the most secure default."}, {"t": "Identity Provisioning, Deprovisioning, and Access Reviews", "d": "Identity provisioning creates and manages user accounts throughout the identity lifecycle. Deprovisioning removes access when no longer needed. Regular access reviews (recertification) ensure least privilege is maintained over time."}, {"t": "Multifactor Authentication (MFA) and Authentication Strategies", "d": "MFA requires two or more different factor types: something you know (Type 1), something you have (Type 2), something you are (Type 3). Two factors of the same type is NOT MFA. MFA dramatically reduces credential compromise attacks."}, {"t": "Access Control Attacks and Countermeasures", "d": "Common attacks against access controls include password attacks (brute force, dictionary, rainbow tables), privilege escalation, session hijacking, and credential stuffing. Each has specific countermeasures."}, {"t": "Directory Services and LDAP", "d": "Directory services (Active Directory, LDAP) provide centralized identity management. LDAP (port 389, LDAPS port 636) queries directory data using a hierarchical structure (DN, OU, CN). Active Directory integrates Kerberos, LDAP, DNS, and Group Policy."}, {"t": "Credential Management and Password Policies", "d": "Effective credential management includes strong password policies, password managers, credential vaulting, and modern passwordless alternatives. NIST SP 800-63B updated password guidance significantly — no forced rotation, no composition rules."}, {"t": "Zero Trust Identity Architecture", "d": "Zero Trust applies identity-centric security: every access request is verified regardless of network location. Core components include continuous authentication, device trust evaluation, micro-segmentation, and least privilege access with JIT/JEA."}, {"t": "Session Management and Token Security", "d": "Session management controls how authenticated sessions are created, maintained, and terminated. Secure session tokens must be random, unpredictable, and protected. JWT, SAML tokens, and cookies each have specific security requirements."}, {"t": "Identity Federation and Third-Party Authentication", "d": "Federation enables authentication across organizational boundaries. Trust relationships allow users from one domain to access resources in another. Standards include SAML, OAuth, OIDC, and WS-Federation. Cross-certification and trusted third-party models."}, {"t": "Accountability and Auditing Controls", "d": "Accountability links actions to identities through logging, auditing, and monitoring. Audit trails must be protected, comprehensive, and regularly reviewed. Non-repudiation ensures actions cannot be denied."}, {"t": "Privileged Access Management (PAM)", "d": "Controls and tools for managing, monitoring, and securing privileged accounts including password vaulting, session recording, just-in-time access, and privilege elevation."}, {"t": "Access Control Models Deep Dive", "d": "Detailed analysis of access control models including DAC, MAC, RBAC, ABAC, Rule-Based, and Risk-Based access control with implementation considerations."}, {"t": "Biometric Systems and Authentication Technologies", "d": "Deep dive into biometric authentication including physiological and behavioral biometrics, error rates, anti-spoofing, and emerging authentication technologies."}, {"t": "Identity Lifecycle Management", "d": "Managing identity from creation through modification to decommissioning, including provisioning, access reviews, role transitions, and deprovisioning."}, {"t": "Service Accounts and Non-Human Identity Management", "d": "Managing machine identities including service accounts, API keys, certificates, managed identities, and workload identity in cloud-native environments."}, {"t": "Physical Access Control Systems", "d": "Physical access control technologies including smart cards, proximity cards, mantrap/airlock, turnstiles, bollards, and convergence of physical and logical access."}, {"t": "Authorization Mechanisms and Policy Enforcement", "d": "Technical implementation of authorization including ACLs, capability tables, security labels, content-dependent and context-dependent controls, and policy decision/enforcement points."}, {"t": "Single Sign-On Architectures", "d": "SSO implementation approaches including Kerberos-based, SAML-based, OIDC-based, and agent-based SSO with security considerations."}, {"t": "Access Review and Governance", "d": "Processes for ensuring access remains appropriate over time including user access reviews, role mining, segregation of duties enforcement, and identity governance."}, {"t": "LDAP and Directory Services Security", "d": "Securing directory services including LDAP, Active Directory, schema security, replication security, and directory-based attacks."}, {"t": "Passwordless and Modern Authentication", "d": "Emerging authentication technologies including FIDO2/WebAuthn, passkeys, behavioral biometrics, and risk-adaptive authentication."}, {"t": "Cloud Identity and Access Management", "d": "Managing identities in cloud environments including IAM roles, temporary credentials, cross-account access, and cloud-native identity controls."}, {"t": "Credential Management and Secrets Handling", "d": "Secure storage, rotation, and lifecycle management of credentials including passwords, API keys, certificates, and secrets vaults."}, {"t": "Federated Identity and Trust Models", "d": "Cross-organizational identity sharing using SAML, OAuth, OIDC, and trust frameworks enabling SSO across domains."}, {"t": "Session Management Security", "d": "Secure creation, maintenance, and termination of user sessions including token management, timeout policies, and session hijacking prevention."}, {"t": "Identity Proofing and Registration", "d": "Verifying the identity of individuals before issuing credentials, including NIST SP 800-63A identity assurance levels and enrollment processes."}, {"t": "Accountability and Audit in IAM", "d": "Logging, monitoring, and auditing identity and access activities to ensure accountability, detect anomalies, and support compliance."}, {"t": "Access Control Administration", "d": "Centralized vs decentralized administration, provisioning workflows, access request processes, and delegated administration models."}, {"t": "Identity as a Service and Cloud Identity", "d": "Cloud-based identity services including IDaaS, SCIM provisioning, directory synchronization, and multi-cloud identity strategies."}, {"t": "Multifactor Authentication Design", "d": "Architecture and implementation of MFA including factor selection, risk-based authentication, step-up authentication, and MFA bypass prevention."}, {"t": "Privilege Escalation Prevention", "d": "Preventing unauthorized elevation of access rights through technical controls, monitoring, and least privilege enforcement."}, {"t": "Access Control Attacks and Countermeasures", "d": "Common attacks against access control systems including pass-the-hash, Kerberoasting, token manipulation, and relay attacks with defenses."}, {"t": "Zero Trust Architecture for Identity", "d": "Zero trust identity principles including continuous verification, microsegmentation, policy enforcement points, and identity-centric security."}, {"t": "Kerberos Authentication Protocol", "d": "Kerberos is a symmetric-key authentication protocol using a trusted third party (KDC). It provides SSO through ticket-based authentication. Understanding the authentication flow, components, and limitations is heavily tested."}, {"t": "RADIUS, TACACS+, and Diameter Protocols", "d": "AAA protocols authenticate, authorize, and account for network access. RADIUS uses UDP and encrypts only passwords. TACACS+ uses TCP and encrypts the entire payload. Diameter is the successor to RADIUS."}, {"t": "OAuth 2.0, OpenID Connect, and SAML", "d": "OAuth 2.0 provides delegated authorization (not authentication). OpenID Connect adds authentication on top of OAuth. SAML is an XML-based SSO protocol for enterprise federation. Understanding when to use each is critical."}, {"t": "Access Control Models: DAC, MAC, RBAC, and ABAC", "d": "Four primary access control models determine how access decisions are made. DAC uses owner discretion, MAC uses system-enforced labels, RBAC uses job roles, and ABAC uses attributes for fine-grained control."}, {"t": "Biometric Authentication Deep Dive", "d": "Biometric authentication uses physiological or behavioral characteristics. Key metrics are FRR, FAR, and CER. Understanding biometric types, accuracy trade-offs, and attack vectors is essential."}, {"t": "Privilege Escalation and Privileged Access Management", "d": "Privilege escalation attacks gain elevated access (vertical = admin, horizontal = another user). PAM solutions control, monitor, and audit privileged access through vaulting, session recording, and just-in-time access."}, {"t": "Identity Federation Standards and Trust", "d": "Identity federation enables users from one organization to access resources in another without separate credentials. Trust relationships, assertion protocols, and cross-domain identity management require careful security consideration."}, {"t": "Access Control Administration and Review", "d": "Access control administration includes provisioning, review, and deprovisioning. Regular access reviews (recertification) detect privilege creep. Automated tools enforce timely deprovisioning upon role changes or termination."}, {"t": "FIDO2 and Passwordless Authentication", "d": "FIDO2 (WebAuthn + CTAP) enables passwordless authentication using public key cryptography and hardware authenticators. It eliminates password-related attacks including phishing, credential stuffing, and password reuse."}, {"t": "Attribute-Based Access Control Deep Dive", "d": "ABAC evaluates access requests based on attributes of the subject, object, action, and environment. Policies combine multiple attributes for fine-grained, context-aware access decisions."}, {"t": "Identity Governance and Administration (IGA)", "d": "IGA platforms manage the full identity lifecycle: provisioning, access requests, access certification, separation of duties enforcement, and analytics. IGA ensures the right people have the right access at the right time."}, {"t": "Multi-Factor Authentication Strategies", "d": "MFA combines two or more authentication factors from different categories. Understanding factor types, MFA bypass attacks, and adaptive/risk-based authentication helps select appropriate MFA strategies."}, {"t": "Accountability Through Audit Trails", "d": "Accountability ensures actions can be traced to responsible individuals through audit trails, logging, and monitoring. Non-repudiation prevents denial of actions. Understanding what to log and how to protect logs is critical."}, {"t": "Password Policies and Credential Storage", "d": "Modern password policies focus on length over complexity. Credential storage must use adaptive hashing algorithms (bcrypt, Argon2) with unique salts. Understanding password attacks and defenses is essential."}, {"t": "Directory Services and LDAP Security", "d": "LDAP directories provide centralized identity storage for authentication and authorization. Understanding LDAP structure, LDAP injection attacks, and secure LDAP configuration is important for IAM."}, {"t": "Service Accounts and Non-Human Identity", "d": "Service accounts, API keys, certificates, and machine identities are non-human credentials that require special management. They often have elevated privileges and are frequently overlooked in security programs."}, {"t": "Session Management and Token Security", "d": "Session management controls the lifecycle of user sessions from creation to termination. Secure session handling prevents hijacking, fixation, and replay attacks."}, {"t": "Directory Services Security", "d": "Directory services (Active Directory, LDAP) are central authentication and authorization infrastructure. Compromising the directory service compromises the entire organization."}, {"t": "Decentralized Identity and Self-Sovereign Identity", "d": "Decentralized identity gives individuals control over their digital identities without relying on centralized identity providers. Verifiable credentials and blockchain-based identifiers enable self-sovereign identity."}, {"t": "Conditional Access and Risk-Based Authentication", "d": "Conditional access policies evaluate risk signals at authentication time to make dynamic access decisions. Factors include device compliance, location, risk score, and behavior patterns."}], "review": [{"t": "IAAA", "d": "Identification, Authentication, Authorization, Auditing — establishes accountability"}, {"t": "Type 1/2/3/4", "d": "Know (password), Have (token), Are (biometric), Where (location)"}, {"t": "CER", "d": "Crossover Error Rate — where FAR=FRR. Lower = more accurate"}, {"t": "Kerberos KDC", "d": "Key Distribution Center (AS+TGS), symmetric AES, single point of failure"}, {"t": "RADIUS", "d": "UDP 1812, encrypts password only, combines AAA"}, {"t": "TACACS+", "d": "TCP 49, encrypts everything, separates AAA"}, {"t": "SAML", "d": "Enterprise SSO — XML assertions between IdP and SP"}, {"t": "OAuth 2.0", "d": "Authorization framework (NOT authentication) — access tokens"}, {"t": "OpenID Connect", "d": "Authentication layer on top of OAuth — ID tokens (JWT)"}, {"t": "PAM", "d": "Privileged Access Management — vaulting, session recording, JIT elevation"}, {"t": "SCIM", "d": "System for Cross-domain Identity Management — automated provisioning standard"}, {"t": "Implicit Deny", "d": "Deny all access unless explicitly granted — most secure default"}, {"t": "MFA Factor Types", "d": "Type 1 (know), Type 2 (have), Type 3 (are), Type 4 (where). Must use DIFFERENT types for true MFA."}, {"t": "HOTP vs TOTP", "d": "HOTP = counter-based (valid until used). TOTP = time-based (30-60 sec, more secure)."}, {"t": "FIDO2/WebAuthn", "d": "Passwordless auth using public key crypto. Phishing-resistant — private key never leaves device."}, {"t": "Password Spraying", "d": "Few common passwords tried against many accounts. Avoids lockout per account."}, {"t": "Credential Stuffing", "d": "Using breached username/password pairs from data breaches. MFA defeats this."}, {"t": "Kerberoasting", "d": "Extracting service ticket hashes for offline cracking. Use strong service account passwords."}, {"t": "Golden Ticket", "d": "Forged Kerberos TGT using krbtgt hash. Provides unlimited domain access. Reset krbtgt twice."}, {"t": "Pass-the-Hash", "d": "Using stolen NTLM hash to authenticate without knowing the password."}, {"t": "LDAP vs LDAPS", "d": "LDAP = port 389 (cleartext). LDAPS = port 636 (TLS encrypted). Always use LDAPS."}, {"t": "Active Directory", "d": "Microsoft directory: LDAP + Kerberos + DNS + GPO. Forest → Domain → OU → Objects."}, {"t": "NIST 800-63B", "d": "Password guidance: NO forced rotation, NO complexity rules, YES breach checking, YES 8+ char minimum."}, {"t": "Argon2", "d": "Memory-hard password hashing algorithm. Most resistant to GPU/ASIC attacks. Newest standard."}, {"t": "JIT Access", "d": "Just-In-Time — temporary elevated privileges that auto-revoke after time period."}, {"t": "JEA", "d": "Just-Enough-Access — limited scope of elevated privileges to minimum needed."}, {"t": "ZTNA", "d": "Zero Trust Network Access — replaces traditional VPN with identity-centric access control."}, {"t": "SASE", "d": "Secure Access Service Edge — converges networking and security in the cloud."}, {"t": "JWT", "d": "JSON Web Token — Header.Payload.Signature. Base64 encoded (NOT encrypted). Used in OIDC and APIs."}, {"t": "Session Fixation", "d": "Attacker sets a known session ID before victim logs in. Fix: regenerate session ID after auth."}, {"t": "Cookie Security Flags", "d": "Secure (HTTPS only), HttpOnly (no JS access), SameSite (anti-CSRF). All three should be set."}, {"t": "Federation Trust Models", "d": "Cross-certification (direct, doesn't scale) vs. Trusted third party (hub/spoke, scalable)."}, {"t": "OAuth Grant Types", "d": "Auth Code (best), Client Credentials (M2M), Implicit (deprecated), Resource Owner Password (deprecated)."}, {"t": "PKCE", "d": "Proof Key for Code Exchange — required for public OAuth clients. Prevents authorization code interception."}, {"t": "Accountability", "d": "Links actions to identities through identification + authentication + audit logging."}, {"t": "UEBA", "d": "User and Entity Behavior Analytics — ML-based anomaly detection for user/system behavior."}, {"t": "Non-repudiation", "d": "Cannot deny an action. Achieved through digital signatures (strongest), audit logs, video."}, {"t": "MFA Fatigue", "d": "Flooding user with push notifications until they approve. Counter: number matching, context display."}, {"t": "SIM Swap", "d": "Hijacking phone number to intercept SMS OTP. Counter: use hardware tokens or authenticator apps."}, {"t": "Password Vault", "d": "PAM component — stores privileged credentials encrypted, auto-rotates passwords."}, {"t": "JIT Access", "d": "Just-In-Time — temporary elevation granted on request, auto-revoked after time window."}, {"t": "Break-Glass", "d": "Emergency access procedure — heavy auditing required, post-incident review mandatory."}, {"t": "Service Account", "d": "Non-human identity for automated processes. High risk: elevated privileges, no MFA, static credentials."}, {"t": "Secrets Management", "d": "HashiCorp Vault, AWS Secrets Manager — centralized credential storage, rotation, audit."}, {"t": "Managed Identity", "d": "Cloud-native — platform handles authentication transparently. No stored credentials."}, {"t": "DAC vs MAC", "d": "DAC = owner decides (flexible, Trojan risk). MAC = system decides (labels, military-grade)."}, {"t": "RBAC Constraints", "d": "Static SoD = cannot hold both roles. Dynamic SoD = cannot activate both simultaneously."}, {"t": "ABAC/XACML", "d": "Attribute-Based AC — most flexible. Uses subject, object, environment, action attributes."}, {"t": "Risk-Based AC", "d": "Adaptive — evaluates risk score per request. Higher risk = more authentication required."}, {"t": "Capability Table", "d": "Attached to SUBJECT — lists objects they can access. Transpose of ACL."}, {"t": "PEP/PDP", "d": "PEP = enforces decisions. PDP = makes decisions. PIP = provides data. PAP = administers policies."}, {"t": "Content-Dependent", "d": "Access based on data content (e.g., DB view hiding salary). Context-Dependent = time/location."}, {"t": "Golden Ticket", "d": "Forged TGT using krbtgt hash — domain-wide access. Silver Ticket = service ticket, single service."}, {"t": "Kerberoasting", "d": "Request service tickets, crack offline. Counter: strong service account passwords, AES only."}, {"t": "Orphan Account", "d": "Active account of former employee — insider threat risk. Detected by access reviews."}, {"t": "Privilege Creep", "d": "Accumulated excess access from role changes. Detected by access reviews + peer group comparison."}, {"t": "Role Mining", "d": "Bottom-up — analyze actual access to derive roles. Complements top-down role engineering."}, {"t": "IGA", "d": "Identity Governance and Administration — automates reviews, SoD, role management, compliance."}, {"t": "Mantrap/Vestibule", "d": "Two interlocking doors — first must close before second opens. Prevents tailgating."}, {"t": "Anti-passback", "d": "Requires alternating entry/exit scans — prevents badge sharing."}, {"t": "PIV/CAC", "d": "Physical-logical convergence — single smart card for building access + computer login."}, {"t": "FIDO2/WebAuthn", "d": "Passwordless authentication using hardware keys. Phishing-resistant. Replaces passwords."}, {"t": "Constrained Interface", "d": "Limits functions by privilege level — different menus for different roles."}, {"t": "LDAP Ports", "d": "LDAP = 389 (cleartext). LDAPS = 636 (TLS). Always use LDAPS or SASL bind."}, {"t": "AD Forest", "d": "Security boundary in Active Directory. Domains are admin boundaries. OUs are management containers."}, {"t": "Pass-the-Hash", "d": "Use NTLM hash without cracking to authenticate. Counter: disable NTLM, use Kerberos."}, {"t": "DCSync", "d": "Replicate AD credentials by impersonating domain controller. Counter: monitor replication events."}, {"t": "Passkeys", "d": "Synced FIDO2 credentials across devices. Origin-bound (phishing-resistant). No server-side password storage."}, {"t": "Continuous Authentication", "d": "Ongoing identity verification during session using behavioral biometrics."}, {"t": "Step-Up Authentication", "d": "Additional factors required when accessing higher-risk resources within existing session."}, {"t": "Cloud IAM Roles", "d": "Use roles instead of users for applications. Temporary credentials via STS. No permanent access keys."}, {"t": "Permission Boundary", "d": "Limits maximum possible permissions for IAM entity. Even broader policies cannot exceed boundary."}, {"t": "SCP", "d": "Service Control Policy — organization-wide guardrail in AWS Organizations. Restricts all accounts."}, {"t": "LAPS", "d": "Local Administrator Password Solution — unique, rotated admin password per workstation."}], "formulas": ["Accountability = Identification + Authentication", "MFA = 2+ factors from DIFFERENT types", "HOTP = HMAC-based OTP (event-based, counter)", "TOTP = Time-based OTP (30-60 second window)", "CER (EER) = Point where FAR equals FRR (lower is better)", "Type 1 Error = FRR (False Rejection Rate) — rejects legitimate user", "Type 2 Error = FAR (False Acceptance Rate) — accepts imposter", "Higher sensitivity = lower FAR, higher FRR", "Lower sensitivity = lower FRR, higher FAR", "Enrollment time > 2 minutes = unacceptable", "Identity Lifecycle: Provision → Manage → Deprovision", "SCIM = modern provisioning standard (replaces SPML)", "Access Review frequency: Annual (standard) | Quarterly (privileged)", "PAM: Vault + Record + JIT + Zero Standing Privileges", "SAML: IdP (authenticates) → Assertion (XML) → SP (authorizes)", "OAuth 2.0: Authorization Code grant = most secure", "OIDC = OAuth 2.0 + ID Token (JWT) = Authentication + Authorization", "XACML: Subject + Resource + Action + Environment → Permit/Deny", "KDC = AS (authenticates) + TGS (issues service tickets)", "Kerberos clock skew tolerance: 5 minutes (requires NTP)", "RADIUS: UDP 1812/1813, password only encrypted, combines A&A", "TACACS+: TCP 49, entire payload encrypted, separates A, A, A", "Diameter: TCP/SCTP 3868, NOT backward-compatible with RADIUS", "DAC: Owner → grants access → flexible, least secure", "MAC: Labels + clearances → system enforces → most secure", "RBAC: Users → Roles → Permissions (simplifies admin)", "ABAC: Subject + Object + Action + Environment → Permit/Deny", "ACL = object-focused | Capability Table = subject-focused"], "aids": ["IAAA: \"I Am Always Accountable\"", "Factors: \"Know, Have, Are, Where\" — 1, 2, 3, 4", "MFA rule: \"Different types, not different instances\"", "NIST passwords: \"No expiry, No complexity, Yes breach-check\"", "\"Type 2 is FAR from Type 1\" — memorize this phrase", "\"Retina Reveals\" — reveals health/PHI data (blood pressure, pregnancy)", "\"Iris Is Ideal\" — most commonly accepted, second most accurate", "Accuracy ranking: \"RIF-HVS\" — Retina, Iris, Fingerprint, Hand, Voice, Signature", "Lifecycle: \"PMD\" — Provision, Manage, Deprovision", "PAM = \"Privileged Access is Managed\" — vault, record, JIT", "Termination: \"DRR\" — Disable (don't delete), Revoke all, Review audit", "Privilege creep: \"Accumulated Access is an Attack surface\"", "\"OpenID = Open the door (autheNtication), OAuth = O-Authorize\"", "\"SAML = Security for enterprise, OAuth = Open for commercial\"", "OAuth grant types: \"AIRC\" — Auth Code, Implicit, Resource Owner, Client Creds", "OIDC adds the \"ID\" to OAuth — ID Token for identity", "\"RADIUS is Rudimentary\" — UDP, password only, combined AAA", "\"TACACS+ is Total\" — TCP, Total encryption, separated AAA", "\"Kerberos = Key (symmetric) + Tickets + Time (5 min skew)\"", "\"Diameter is Different\" — NOT backward-compatible with RADIUS", "\"DAC = Discretion of the owner, MAC = Mandated by the system\"", "\"RBAC = Roles Before individual Access Control\"", "\"ABAC = Attributes-Based = Always flexible, Best for complex Access Control\"", "\"ACL = Access for the Object, Capability = Capability of the Subject\"", "JML: \"Joiners get access, Movers get adjusted, Leavers get cut\"", "Access creep: \"Collect privileges like stamps — review regularly to trim\"", "Deprovisioning priority: \"Badge, VPN, Email, Apps, Archive\" — BVEAA", "Factor types: \"Know, Have, Are, Where\" — 1, 2, 3, 4", "True MFA: \"Mix the types, never double up\"", "TOTP: \"Time-limited One-Time Password\" (better than HOTP)", "Password attacks: \"BDHRS-C\" — Brute, Dictionary, Hybrid, Rainbow, Spraying, Credential stuffing", "Escalation: \"Vertical = up, Horizontal = sideways\"", "Session defenses: \"RSTS\" — Rotate tokens, Secure flags, TLS, Session timeout", "LDAP hierarchy: \"DC → OU → CN\" — Domain, Organization, Common name", "AD attacks: \"GSPD\" — Golden ticket, Silver ticket, Pass-the-Hash, DCSync", "AD security tiers: \"0=DC, 1=Servers, 2=Workstations\" — never cross tiers", "NIST 800-63B: \"No Rotation, No Complexity, Yes Breach-checking, Yes Length\"", "Password storage: \"bPA + Salt + Pepper\" — bcrypt/PBKDF2/Argon2 + unique salt + server pepper", "FIDO2: \"Fast Identity, Domain-bound, phishing-prOof\"", "Zero Trust pillars: \"IDLMC\" — Identity verification, Device trust, Least privilege, Micro-segmentation, Continuous monitoring", "NIST 800-207: \"PE decides, PA manages, PEP enforces\"", "JIT/JEA: \"Just-In-Time = temporary, Just-Enough-Access = limited scope\"", "Cookie security: \"SHS\" — Secure, HttpOnly, SameSite", "JWT: \"Header.Payload.Signature\" — base64 encoded, not encrypted", "Session security: \"RTLIA\" — Regenerate ID, Timeouts, Logout invalidation, limit concurrent, Anomaly detection", "Federation protocols: \"SAML authenticates, OAuth authorizes, OIDC does both\"", "SAML roles: \"IdP Identifies, SP Serves, User Agent browses\"", "OAuth flows: \"ACIR\" — Auth Code (best), Implicit (deprecated), Resource Owner (deprecated), Client Credentials (M2M)", "Audit log contents: \"TSAOT\" — Timestamp, Source identity, Action, Outcome, Target", "Non-repudiation: \"Digital Signatures Deny Denial\" — strongest form", "Log protection: \"SWHR\" — Separate server, Write-once, Hash integrity, Restrict access", "PAM pillars: \"VSJE\" — Vault, Session record, Just-in-time, Elevation management", "Break-glass: \"Emergency access = use sparingly, audit heavily, review post-incident\"", "MAC models: \"Bell-LaPadula = BLP = Bottom Lip Pushed up (no read UP), Biba = Bring Integrity Back Always (no write UP)\"", "Access control evolution: \"DAC → MAC → RBAC → ABAC → Risk-Based (increasingly sophisticated)\"", "Error types: \"Type 2 is FAR from Type 1\" — FAR is Type 2, FRR is Type 1", "Biometric accuracy ranking: \"IRFV\" — Iris (best), Retina, Fingerprint, Voice (least accurate)", "Identity lifecycle: \"PMD\" — Provision, Maintain, Deprovision", "Deprovisioning priority: \"DDAR\" — Disable immediately, Delete after retention, Archive data, Review logs", "NHI risks: \"SSEO\" — Shared credentials, Static passwords, Embedded secrets, Orphaned accounts", "Secrets management: \"CRAD\" — Centralize, Rotate, Audit, Dynamic generation", "Physical controls layering: \"FBGS\" — Fence, Bollards, Guards, Smart cards (outside in)", "Convergence benefits: \"SLAC\" — Single credential, Location awareness, Audit correlation, Cost reduction", "Authorization architecture: \"PEDA\" — PEP Enforces, PDP Decides, PIP provides Attributes (PAP Administers)", "Control types: \"Content = What is in it, Context = When/Where/How it is accessed\"", "Kerberos attacks: \"GSKP\" — Golden ticket, Silver ticket, Kerberoasting, Pass-the-ticket", "SSO protocols: \"KSOC\" — Kerberos (intra-domain), SAML (cross-domain enterprise), OIDC (modern apps), Cookie (same domain)", "Access review cycle: \"RCRA\" — Request, Certify, Revoke (if inappropriate), Audit", "SoD types: \"Static = Structural (cannot assign), Dynamic = During session (cannot activate simultaneously)\"", "AD hierarchy: \"Forest > Domain > OU > Object\" — forest is the security boundary", "AD attacks: \"PKDG\" — Pass-the-Hash, Kerberoasting, DCSync, Golden ticket", "FIDO2 components: \"WebAuthn + CTAP = FIDO2\" — Web Authentication + Client-to-Authenticator Protocol", "Auth evolution: \"Password → MFA → Passwordless → Continuous\" — increasingly secure", "AWS IAM layers: \"SCP > Permission Boundary > Identity Policy > Resource Policy\" — all must allow", "Cloud credential hierarchy: \"Temporary > Permanent > Embedded (never)\" — most to least secure", "Secrets hierarchy: \"Vault > Manager > Environment Variable > Config File > Hardcoded (never)\"", "Credential attacks: \"Stuffing = many passwords vs one account; Spraying = one password vs many accounts\"", "Federation protocols: \"SAML = enterprise/XML, OAuth = authorization/tokens, OIDC = authentication/JWT\"", "SAML flow: \"User → SP → IdP → Authenticate → Assertion → SP → Access\"", "Cookie security flags: \"HSS\" — HttpOnly (no JS), Secure (HTTPS only), SameSite (CSRF prevention)", "Session attacks: \"FHRC\" — Fixation, Hijacking, Replay, CSRF", "IAL levels: \"1=Anyone, 2=Someone verified, 3=Someone verified in person by a trained human\"", "Proofing steps: \"RVV\" — Resolution (who are you?), Validation (prove it), Verification (is it really you?)", "Audit log content: \"WWWWO\" — Who, What, When, Where, Outcome", "Access review types: \"MPC\" — Micro (event-triggered), Periodic (scheduled), Continuous (real-time)", "JML lifecycle: \"Joiner (baseline access) → Mover (review + change) → Leaver (revoke all)\"", "Administration models: \"Centralized = Control, Decentralized = Delegation, Hybrid = Harmony\"", "IDaaS benefits: \"SUPAG\" — Scalable, Updated automatically, Pre-integrated, Available globally, Governed centrally", "SCIM operations: \"CRUDS\" — Create, Read, Update, Delete, Search (standard REST)", "MFA factors: \"Know-Have-Are-Where\" — Password, Token, Biometric, Location", "MFA strength ranking: \"SMS < TOTP < Push < FIDO2/WebAuthn\"", "Escalation types: \"Vertical = Up (user to admin), Horizontal = Across (user to other user)\"", "Prevention stack: \"LAMP\" — Least privilege, Application whitelisting, Mandatory access control, Patching", "Kerberos attacks: \"KGAS\" — Kerberoasting (service tickets), Golden ticket (TGT forgery), AS-REP roasting (no preauth), Silver ticket (TGS forgery)", "PtH defense: \"DCPS\" — Disable NTLM, Credential Guard, Protected Users group, Segment networks", "ZTA principles: \"VLA\" — Verify explicitly, Least privilege, Assume breach", "ZTA components: \"PDP decides, PEP enforces, PE (Policy Engine) orchestrates\"", "Kerberos flow: \"AS gives TGT, TGS gives ST, Service gives Access\" — ATT(S)A", "Error types: \"Type 1 = Reject (FRR), Type 2 = Accept (FAR)\" — 1 Rejects, 2 Accepts", "CER: \"Crossover = Comparison metric\" — use CER to compare biometric systems"]}, {"code": "SAT", "name": "Security Assessment and Testing", "weight": "12", "topics": [{"t": "Security Tests, Assessments, and Audits", "d": "Test = verify one control. Assessment = comprehensive review + recommendations. Audit = formal review by auditors. Internal audits serve stakeholders; external audits by Big 4 serve regulators. SOC 1 = financial controls, SOC 2 = security/trust, SOC 3 = public summary."}, {"t": "Vulnerability Assessment vs Penetration Testing", "d": "Vulnerability assessment identifies weaknesses without exploiting them. Penetration testing actively exploits vulnerabilities to prove impact. VA is broader coverage; pen testing is deeper analysis. Both require written authorization. VA runs regularly; pen tests are periodic."}, {"t": "Code Review Methods: SAST, DAST, and Fagan Inspection", "d": "SAST (Static Application Security Testing) analyzes source code without execution — finds buffer overflows, injection flaws. DAST (Dynamic Application Security Testing) tests running applications — finds XSS, SQLi, authentication flaws. Fagan Inspection (POPIR-F) is the most formal manual code review. IAST combines both approaches."}, {"t": "SCAP, Log Reviews, and Continuous Monitoring", "d": "SCAP (NIST) standardizes vulnerability management: CVE (names), CVSS (scores 0-10), CCE (configs), CPE (platforms), XCCDF (checklists), OVAL (testing). Log reviews detect anomalies and policy violations. SIEM aggregates and correlates logs. Continuous monitoring provides ongoing security posture awareness."}, {"t": "Fuzz Testing and Synthetic Transactions", "d": "Fuzz testing sends random or semi-random input to find crashes and vulnerabilities. Mutation fuzzing (dumb) modifies existing inputs randomly. Generational fuzzing (intelligent) creates inputs from a data model — finds more subtle bugs. Synthetic transactions test systems with scripted scenarios to verify expected behavior."}, {"t": "SOC Reports, Third-Party Audits, and Compliance Validation", "d": "SOC (System and Organization Controls) reports provide independent assurance of a service organization's controls. SOC 1 covers financial reporting, SOC 2 covers security/availability/processing integrity/confidentiality/privacy (Trust Services Criteria). Type I = design only, Type II = design + operational effectiveness over time."}, {"t": "Penetration Testing Methodologies and Rules of Engagement", "d": "Penetration testing simulates real attacks to identify exploitable vulnerabilities. Methodologies include OWASP, PTES, OSSTMM. Rules of engagement define scope, timing, and boundaries. Types: white box (full knowledge), gray box (partial), black box (no knowledge)."}, {"t": "Vulnerability Management Program", "d": "Vulnerability management is a continuous lifecycle: discover assets, scan for vulnerabilities, prioritize by risk, remediate or accept, verify fixes, and report. It is not a one-time scan but an ongoing program with metrics and governance."}, {"t": "Security Audit Types and Standards", "d": "Security audits independently verify control effectiveness. Types: internal (organization's own team), external (independent third party), regulatory (government agency). Standards include ISO 19011, ISACA audit standards, and AICPA standards."}, {"t": "SCAP and Automated Security Assessment", "d": "SCAP (Security Content Automation Protocol) standardizes automated security assessment. Components: CVE (vulnerability naming), CVSS (scoring), CCE (configuration), CPE (platform naming), XCCDF (checklist format), OVAL (test language)."}, {"t": "Software Testing Methods", "d": "Software testing encompasses unit testing, integration testing, system testing, and acceptance testing. Security-specific methods include fuzzing, static analysis (SAST), dynamic analysis (DAST), interactive testing (IAST), and regression testing."}, {"t": "Key Performance Indicators (KPIs) and Security Metrics", "d": "Meaningful security metrics drive improvement and demonstrate program effectiveness. Key metrics include MTTD, MTTR, patch compliance, vulnerability aging, phishing click rate, and cost per incident. Metrics must be actionable, not just collected."}, {"t": "Continuous Monitoring and Security Assessment", "d": "Continuous monitoring provides real-time visibility into security posture through automated scanning, log analysis, configuration monitoring, and threat detection. NIST SP 800-137 defines the continuous monitoring program."}, {"t": "Code Review and Software Testing Techniques", "d": "Comprehensive review of code analysis methods including static analysis, dynamic analysis, code reviews, walkthroughs, and formal inspection processes."}, {"t": "Penetration Testing Methodology and Reporting", "d": "Structured approach to penetration testing including planning, reconnaissance, scanning, exploitation, post-exploitation, and reporting with rules of engagement."}, {"t": "Security Metrics, KPIs, and KRIs", "d": "Measuring security program effectiveness through Key Performance Indicators, Key Risk Indicators, metrics frameworks, and security dashboards."}, {"t": "Log Management and SIEM Operations", "d": "Centralized log collection, aggregation, correlation, and analysis using SIEM platforms for security monitoring, alerting, and compliance."}, {"t": "Vulnerability Scanning and Assessment", "d": "Automated vulnerability scanning tools, techniques, scan types, and vulnerability management lifecycle from discovery through remediation."}, {"t": "Compliance Testing and Regulatory Audits", "d": "Testing security controls against regulatory requirements including PCI-DSS, HIPAA, SOX, GDPR compliance assessment, and audit preparation."}, {"t": "Business Continuity and Disaster Recovery Testing", "d": "Testing BCP/DRP through tabletop exercises, walkthroughs, simulations, parallel tests, and full-interruption tests with lessons learned integration."}, {"t": "Security Architecture Assessment", "d": "Evaluating security architectures through threat modeling, design reviews, attack surface analysis, and architecture risk assessment."}, {"t": "Security Control Validation and Effectiveness Testing", "d": "Methods for validating that security controls are operating as intended including control testing, red team assessments, and tabletop exercises."}, {"t": "Data Collection and Analysis for Security Testing", "d": "Collecting and analyzing security data from multiple sources including vulnerability databases, threat feeds, log analysis, and security information sharing."}, {"t": "Interface Testing and Misuse Case Analysis", "d": "Testing system interfaces, APIs, and user interactions for security vulnerabilities including negative testing, boundary testing, and abuse case development."}, {"t": "Security Assessment Reporting and Risk Communication", "d": "Effectively communicating security assessment findings to technical and business audiences through structured reports, risk ratings, and remediation recommendations."}, {"t": "Third-Party Service Assessment", "d": "Evaluating the security posture of third-party service providers through questionnaires, audits, certifications, and continuous monitoring."}, {"t": "Security Audit Management", "d": "Planning, conducting, and reporting security audits including internal audits, external audits, regulatory audits, and audit evidence collection."}, {"t": "Continuous Security Monitoring", "d": "Real-time and ongoing monitoring of security controls using automated tools, dashboards, and risk-based alerting."}, {"t": "Software Testing for Security", "d": "Testing software for security vulnerabilities including unit testing, integration testing, regression testing, and acceptance testing with security focus."}, {"t": "Security Control Frameworks and Baselines", "d": "Frameworks for selecting, implementing, and measuring security controls including NIST 800-53, ISO 27002, CIS Controls, and COBIT."}, {"t": "Attack Surface Analysis", "d": "Identifying, measuring, and reducing the attack surface through systematic enumeration of entry points, trust boundaries, and exposure."}, {"t": "Bug Bounty and Responsible Disclosure", "d": "Managing vulnerability disclosure programs including bug bounty platforms, responsible disclosure policies, and coordinated vulnerability disclosure."}, {"t": "Security Assessment Methodologies", "d": "Structured approaches to security assessment including OWASP Testing Guide, NIST SP 800-115, PTES, and OSSTMM."}, {"t": "Compliance Monitoring and Reporting", "d": "Tracking organizational compliance with regulatory requirements, industry standards, and internal policies through monitoring and reporting."}, {"t": "Security Control Effectiveness Measurement", "d": "Quantifying how well security controls achieve their objectives through testing, metrics, and maturity assessment."}, {"t": "Digital Forensics for Assessment", "d": "Using forensic techniques for security assessments including evidence collection, analysis tools, and forensic readiness."}, {"t": "Vulnerability Assessment Techniques and Tools", "d": "Vulnerability assessments systematically identify weaknesses in systems, networks, and applications. Understanding scanner types, CVSS scoring, false positives/negatives, and assessment frequency is essential."}, {"t": "Penetration Testing: Types, Phases, and Rules of Engagement", "d": "Penetration testing simulates real attacks to test security controls. Types include black box, white box, and grey box. The ROE document defines scope, authorization, and constraints. Understanding the testing lifecycle is critical."}, {"t": "Security Audit Types and Standards", "d": "Security audits verify compliance and control effectiveness. Types include internal, external, and third-party audits. Key standards include SOC 1/2/3, ISO 27001, and PCI DSS QSA assessments."}, {"t": "Software Testing Methods: SAST, DAST, IAST, and SCA", "d": "Application security testing uses complementary methods: SAST (static — source code), DAST (dynamic — running application), IAST (interactive — instrumented runtime), and SCA (software composition analysis — third-party components)."}, {"t": "Log Management and SIEM Operations", "d": "Log management collects, stores, and analyzes log data from across the enterprise. SIEM correlates events from multiple sources to detect threats. Understanding log types, retention, and correlation rules is essential."}, {"t": "Code Review Techniques: Fagan Inspection and Peer Review", "d": "Formal code review (Fagan inspection) is the most effective method for finding defects. Peer reviews, walkthroughs, and automated reviews complement formal inspections at different cost and thoroughness levels."}, {"t": "Security Metrics, KPIs, and KRIs", "d": "Security metrics quantify security posture and program effectiveness. KPIs measure performance against objectives. KRIs provide early warning of increasing risk. Metrics must be SMART and actionable."}, {"t": "Compliance Testing and Validation", "d": "Compliance testing verifies that security controls satisfy regulatory, contractual, and policy requirements. Methods include control testing, substantive testing, gap analysis, and evidence collection for auditors."}, {"t": "Vulnerability Management Program", "d": "A vulnerability management program continuously identifies, classifies, prioritizes, remediates, and verifies vulnerabilities across the organization. It is a cyclical process, not a one-time scan."}, {"t": "Security Control Validation", "d": "Security control validation verifies that implemented controls actually work as intended. Methods include testing, red team exercises, purple team collaboration, and breach and attack simulation (BAS)."}, {"t": "Security Assessment Reporting", "d": "Effective security assessment reports communicate findings, risk, and recommendations to different audiences. Executive summaries address leadership, technical details address remediation teams, and risk ratings prioritize action."}, {"t": "Bug Bounty Programs", "d": "Bug bounty programs invite external security researchers to find and responsibly disclose vulnerabilities in exchange for rewards. They complement internal security testing by leveraging diverse attacker perspectives."}, {"t": "Red Team and Purple Team Operations", "d": "Red teams simulate real-world adversaries to test organizational defenses end-to-end. Purple teams combine red team offense with blue team defense for collaborative security improvement."}, {"t": "Security Control Assessment Methods", "d": "Security control assessments verify that controls are implemented correctly, operating as intended, and producing the desired outcome. NIST SP 800-53A defines assessment methods: examine, interview, and test."}, {"t": "Continuous Monitoring and Security Automation", "d": "Continuous monitoring provides ongoing awareness of security posture through automated data collection, analysis, and reporting. NIST SP 800-137 defines the ISCM (Information Security Continuous Monitoring) strategy."}, {"t": "Third-Party Risk Assessment", "d": "Third-party risk assessment evaluates the security posture of vendors, suppliers, and partners who have access to organizational data or systems. It is a critical component of supply chain security."}, {"t": "SCAP and Automated Security Assessment", "d": "SCAP (Security Content Automation Protocol) provides standardized specifications for automated security assessment, including vulnerability checking, configuration compliance, and patch verification."}], "review": [{"t": "Security Test", "d": "Verify a specific control is functioning"}, {"t": "Security Assessment", "d": "Comprehensive review + risk analysis + remediation recommendations"}, {"t": "SOC 2 Type II", "d": "Gold standard: control design + operational effectiveness over 6-12 months"}, {"t": "CVE", "d": "Common Vulnerabilities and Exposures — standardized vulnerability naming"}, {"t": "CVSS", "d": "Vulnerability severity scoring 0.0-10.0 (Critical ≥ 9.0)"}, {"t": "SAST", "d": "Static testing — analyzes source code without execution (buffer overflows)"}, {"t": "DAST", "d": "Dynamic testing — tests running application (SQLi, XSS, CSRF)"}, {"t": "Fagan Inspection", "d": "Most formal code review: POPIR-F — defects identified, not fixed, during Inspection"}, {"t": "White Box", "d": "Full knowledge (crystal box) — most thorough pen test"}, {"t": "Black Box", "d": "No knowledge — most realistic pen test, most time-consuming"}, {"t": "SIEM", "d": "Aggregates, normalizes, correlates logs from multiple sources for security monitoring"}, {"t": "Generational Fuzzing", "d": "Intelligent — creates inputs from data model, finds deeper bugs than mutation"}, {"t": "Pen Test Types", "d": "White box (full knowledge, most thorough). Gray box (partial). Black box (no knowledge, most realistic)."}, {"t": "ROE", "d": "Rules of Engagement — scope, timing, methods, contacts, data handling. Written authorization MANDATORY."}, {"t": "Red/Blue/Purple Team", "d": "Red = attack. Blue = defend. Purple = collaborative (both share findings to improve)."}, {"t": "PTES", "d": "Pen Testing Execution Standard — 7 phases from pre-engagement to reporting."}, {"t": "Vulnerability Management", "d": "Continuous: Discover → Scan → Prioritize → Remediate → Verify → Report. Not one-time."}, {"t": "Credentialed
