<style>
/* Layout: flat, minimal — plain top bar with text tabs, single 1040px column, hairline dividers instead of boxes; one accent */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f5f7; --line:#e6e8ec; --line-2:#cfd3da;
  --ink:#111418; --ink-2:#4b525c; --ink-3:#7a818c;
  --accent:#2448e0; --accent-ink:#ffffff; --accent-soft:#eef1fd;
  --good:#16794a; --good-soft:#ecf7f1; --bad:#c2312a; --bad-soft:#fcefee;
  --mark:#fff1b8;
  --display:"Chakra Petch","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#111315; --surface-2:#1b1e22; --line:#26292e; --line-2:#3a3f46;
  --ink:#eceef1; --ink-2:#a8afb9; --ink-3:#7c838e;
  --accent:#8aa2ff; --accent-ink:#0b0f1f; --accent-soft:#1a2140;
  --good:#5cc98f; --good-soft:#15261d; --bad:#ff7b72; --bad-soft:#2c1715; --mark:#4d4320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#111315; --surface-2:#1b1e22; --line:#26292e; --line-2:#3a3f46;
  --ink:#eceef1; --ink-2:#a8afb9; --ink-3:#7c838e;
  --accent:#8aa2ff; --accent-ink:#0b0f1f; --accent-soft:#1a2140;
  --good:#5cc98f; --good-soft:#15261d; --bad:#ff7b72; --bad-soft:#2c1715; --mark:#4d4320; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent)}
b,strong{font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;padding-block:14px 6px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.005em;margin:0;display:flex;align-items:baseline;gap:0;line-height:1.1}
.brand h1 .tagbox{color:var(--accent)}
.brand .count{font-size:13px;color:var(--ink-3);white-space:nowrap}
#themeBtn{margin-left:-6px}
.brand .spacer{flex:1}
.search{flex:1 1 240px;min-width:0;max-width:380px}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
nav.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:8px 0 10px;font-weight:500;font-size:14px;color:var(--ink-3);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs a .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px;font-size:0}
main{padding-block:40px 100px}
h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 8px;text-wrap:balance}
h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:500}
.lede{color:var(--ink-2);max-width:62ch;margin:0 0 22px;font-size:16.5px}
.stack{display:flex;flex-direction:column;gap:36px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px}
.grid2>*{min-width:0}
.card{background:transparent;border:0;border-top:1px solid var(--line);padding:22px 0 0}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .w{font-size:11px;opacity:.6;margin-left:4px}
button.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 18px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.btn:hover:not(:disabled){opacity:.85}
button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
button.btn.ghost:hover:not(:disabled){border-color:var(--ink);opacity:1}
button.btn:disabled{opacity:.3;cursor:default}
button:focus-visible,.chip:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dnum{display:inline-flex;align-items:center;white-space:nowrap;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-3);flex:0 0 auto}
.dnum::before{content:"D"}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px 24px;margin:0;padding:22px 0;border-block:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-weight:600;font-size:15px}
ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ol.rules li::marker{color:var(--ink-3)}
.plan{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0;padding-top:0}
.day .when{font-size:13px;color:var(--ink-3)}
.day .when b{display:block;font-family:var(--display);font-size:16px;color:var(--ink)}
.day.today .when b{color:var(--accent)}
.day.exam .when b{color:var(--bad)}
.day ul{margin:0;padding-left:18px}
.mast{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:14px}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink-3)}
.bar.low i{background:var(--bad)} .bar.mid i{background:#c98a00} .bar.hi i{background:var(--good)}
.tnum{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3);white-space:nowrap}
.dsec,.model{scroll-margin-top:170px}
.flash{animation:flashin 1.6s ease-out}
@keyframes flashin{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.dhead h3{font-size:24px}
.dhead .wt{font-size:13px;color:var(--ink-3)}
.blk h3{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.blk ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:6px}
.blk li{max-width:80ch}
.blk li::marker{color:var(--ink-3)}
details.more{margin-top:16px}
details.more summary{cursor:pointer;color:var(--accent);font-size:14px}
details.more ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--ink-2)}
.mind{border-top:1px solid var(--line);padding-top:22px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:500;background:var(--bg);position:sticky;top:0}
td.acr{font-family:var(--mono);font-weight:500;white-space:nowrap;color:var(--ink)}
td .note{color:var(--ink-3);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);flex:1 1 220px;min-width:0}
.toolbar input[type=search]:focus{outline:none;border-color:var(--accent);background:var(--bg)}
mark{background:var(--mark);color:inherit;border-radius:2px}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 28px}
.pair{font-size:14px;min-width:0;color:var(--ink-2)}
.pair>div:first-child{color:var(--ink)}
.pair b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.qcard{max-width:720px;padding-top:6px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-bottom:12px}
.qtext{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 18px;max-width:64ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--line-2);background:var(--surface-2)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:3px;min-width:12px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--ink);background:var(--surface-2)}
.opt:disabled{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--surface-2);font-size:15px}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.progress{height:2px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .2s}
.timer{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.warn{color:var(--bad)}
.score{font-family:var(--display);font-size:56px;font-weight:700;line-height:1}
.verdict{display:inline-block;font-weight:500;font-size:13px;margin-top:6px}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.review li{margin-bottom:12px}
.opt.multi .box{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink-3);border-radius:3px;vertical-align:-2px}
.opt.multi.picked .box{background:var(--ink);border-color:var(--ink)}
.qtype{color:var(--accent);font-weight:500}
.ordlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:o}
.ordlist li{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;border:1px solid var(--line);border-radius:8px;counter-increment:o}
.ordlist li::before{content:counter(o);font-family:var(--mono);font-size:12px;color:var(--ink-3);min-width:14px}
.ordlist .ordtxt{flex:1;min-width:0}
.ordbtns{display:flex;gap:4px;flex:0 0 auto}
.mv{font:inherit;width:34px;height:34px;border-radius:6px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.mv:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.mv:disabled{opacity:.2;cursor:default}
.ordlist li.right,.mrow.right{background:var(--good-soft);border-color:var(--good)}
.ordlist li.wrong,.mrow.wrong{background:var(--bad-soft);border-color:var(--bad)}
.matchgrid{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;align-items:center;padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:8px}
.mrow .ml{font-weight:500;min-width:0}
.mrow select{font:inherit;font-size:14px;width:100%;min-width:0;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 36px}
.mgrid>*{min-width:0}
.model .mn{font-size:15px;margin:0 0 12px;color:var(--ink-2)}
.model .mn .ml1{color:var(--accent);font-weight:700}
.model .steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.model .steps li::marker{color:var(--ink-3)}
.model .thost .qcard{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px}
table.osi td{font-size:13px}
.flash{perspective:1200px;max-width:620px}
.fc{position:relative;min-height:250px;cursor:pointer;transform-style:preserve-3d;transition:transform .4s}
.fc.flip{transform:rotateY(180deg)}
.fc .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--surface-2)}
.fc .term{font-family:var(--display);font-size:30px;font-weight:700;text-wrap:balance}
.fc .def{font-size:17px;white-space:pre-line}
.fc .src{font-size:12px;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.progress i{transition:none}}
.results{display:flex;flex-direction:column}
.res{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;min-width:0}
.res .tag{font-size:12px;color:var(--ink-3)}
.empty{padding:28px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:10px;font-size:14px}

/* setup dialog */
.smart{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:10px;background:var(--accent-soft);margin:0 0 18px}
.smart>div{flex:1 1 260px;min-width:0}
.srsbar{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--ink-3)}
.srsbar b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{font:inherit;display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:0;border:0;background:transparent;color:var(--ink-2);cursor:pointer;text-align:left}
.sw.on .swprev{outline:3px solid var(--accent);outline-offset:2px}
.sw.on .swname{color:var(--ink);font-weight:600}
.swname{font-size:13px}
.themepop{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 64px);right:max(16px,env(safe-area-inset-right,0px));width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.tphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hotwrap{overflow-x:auto}
svg.hot{width:100%;max-width:720px;height:auto;display:block}
svg.hot-net{min-width:520px}
svg.hot-osi{max-width:440px}
svg.hot .hlink{stroke:var(--line-2);stroke-width:2}
svg.hot .hz rect{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5;transition:fill .15s}
svg.hot .hz{cursor:pointer;outline:none}
svg.hot .hz:hover rect,svg.hot .hz:focus-visible rect{stroke:var(--accent);stroke-width:2}
svg.hot .hz.picked rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
svg.hot .hz.right rect{fill:var(--good-soft);stroke:var(--good);stroke-width:2.5}
svg.hot .hz.wrong rect{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2.5}
svg.hot .hz.done{cursor:default}
.hzl{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font:500 13px/1.25 var(--body);color:var(--ink);pointer-events:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 32px}
.dgrid>*{min-width:0}
.dumpc{border-top:1px solid var(--line);padding-top:16px}
.dumpc h3{font-size:16px}
.dumpc textarea{width:100%;font-family:var(--mono);font-size:13px;line-height:1.5;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);resize:vertical}
.dumpc textarea:focus{outline:none;border-color:var(--accent)}
.dlist{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.dlist.ans{padding-left:20px;list-style:revert}
.dlist li.ok{color:var(--good)} .dlist li.miss{color:var(--ink-3)}
ul.bl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.lnk{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;min-width:0}
.lnk:hover{border-color:var(--accent)}
.lnk .tag{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
/* sub navigation */
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs a{flex:0 0 auto;padding:5px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.subtabs a:hover{background:var(--surface-2);color:var(--ink)}
.subtabs a.on{background:var(--surface-2);color:var(--ink)}
.subtabs a .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
nav.tabs{gap:26px}
nav.tabs a{font-size:15px}
/* setup panel */
.setup{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.setup-head{padding:18px 22px 4px}
.setup-head h3{margin:0}
.setup-head p{margin:4px 0 0;color:var(--ink-3);font-size:14px}
.frows{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:14px 22px;border-top:1px solid var(--line);align-items:start}
.frows .frow:first-child{border-top:0}
.flabel{font-size:14px;font-weight:600;padding-top:7px}
.flabel span{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.fctl{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;padding:7px 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink-2);cursor:pointer}
.seg button:hover:not(:disabled){color:var(--ink);border-color:var(--ink-3)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:default}
.seg button .w{font-size:11px;opacity:.6;margin-left:6px}
.dpick{display:flex;flex-wrap:wrap;gap:6px}
.setup-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2)}
.setup-foot .summary{font-size:14px;color:var(--ink-2)}
.setup-foot .btn{padding:10px 22px}
.dmodes{display:flex;flex-direction:column;gap:14px}
.dgname{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.dgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.dmode{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.dmode span{font-size:13px;color:var(--ink-3)}
.dmode:hover{border-color:var(--ink-3)}
.dmode.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist>div{display:grid;grid-template-columns:110px minmax(60px,1fr) 44px 56px;gap:12px;align-items:center}
/* session */
.session{display:flex;flex-direction:column;gap:18px}
.sbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sback{font:inherit;font-size:14px;font-weight:500;background:transparent;border:0;color:var(--accent);cursor:pointer;padding:4px 0}
.stitle{font-family:var(--display);font-weight:700;font-size:18px}
.homelink{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.logo{width:1.15em;height:1.15em;margin-right:.4em;flex:0 0 auto}
.logo .lg-bg{fill:var(--accent)} .logo .lg-sh{fill:var(--bg)} .logo .lg-ck{fill:none;stroke:var(--accent);stroke-width:40;stroke-linecap:round;stroke-linejoin:round}
[data-skin="brutal"] .logo .lg-bg{stroke:#111;stroke-width:24}
/* install sheet */
.a2hs{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line-2);box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:a2up .3s ease-out}
@keyframes a2up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.a2hs{animation:none}}
.a2in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.a2top{display:flex;gap:14px;align-items:center}
.a2top img{width:56px;height:56px;border-radius:13px;flex:0 0 auto}
.a2top b{font-family:var(--display);font-size:18px;display:block}
.a2top span{font-size:14px;color:var(--ink-2)}
.a2steps{margin:0;padding-left:22px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.a2steps .ico{display:inline-block;vertical-align:-3px;width:18px;height:18px}
.a2btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.homelink:hover .brand2{text-decoration:underline;text-underline-offset:3px}
/* history */
.histcard{margin-top:4px}
.hstats{display:flex;flex-wrap:wrap;gap:12px 28px;margin:14px 0 6px}
.hstats div{min-width:0}
.hstats dt{font-size:12px;color:var(--ink-3)}
.hstats dd{margin:0;font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.hstats dd.up{color:var(--good)} .hstats dd.down{color:var(--bad)}
.hchartwrap{margin-top:8px}
.hchart{width:100%;height:auto;display:block;max-width:760px}
.hchart .grid{stroke:var(--line);stroke-width:1}
.hchart .tgt{stroke:var(--good);stroke-width:1.2;stroke-dasharray:5 5}
.hchart .ax{fill:var(--ink-3);font:11px var(--mono)}
.hchart .tgtl{fill:var(--good)}
.hchart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.hchart .dot{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.hchart .dot.low{stroke:var(--bad)} .hchart .dot.mid{stroke:#c98a00} .hchart .dot.hi{stroke:var(--good)}
.htable{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(60px,140px) 46px auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hrow:first-child{border-top:0}
.hlabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hpct{color:var(--ink);text-align:right}
a.hlink{color:inherit;text-decoration:none;grid-template-columns:150px minmax(0,1fr) minmax(40px,90px) 44px}
a.hlink:hover .hlabel{color:var(--accent)}
.reslink{font-size:13px;text-decoration:none;white-space:nowrap}
.setupbtn{font:inherit;font-size:13px;color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.setupbtn:hover{color:var(--ink);border-color:var(--line-2)}
.ob{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.obbox{width:min(560px,100%);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:22px;max-height:100%;overflow:auto}
.obbox h2{font-size:28px}
.obstep{font-size:12px;color:var(--ink-3);margin:0 0 6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.field input{font:inherit;font-size:16px;font-weight:400;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);width:100%;max-width:340px}
.field input:focus{outline:none;border-color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:6px;cursor:pointer;font-size:14.5px}
.check:hover{background:var(--surface-2)}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}
.obnav{border-top:1px solid var(--line);padding-top:18px}
.obdots{display:flex;gap:6px;margin-right:6px}
.obdots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.obdots i.on{background:var(--ink)}
.plink{color:inherit;text-decoration:none;border-bottom:1px solid var(--line-2)}
.plink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.focuspill{font-size:11px;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 6px;margin-left:4px}
.sharebox{font-family:var(--mono);font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);flex:1 1 220px;min-width:0}
@media (max-width:600px){.obbox{padding:20px}.obbox h2{font-size:23px}}
@media (max-width:600px){
  main{padding-block:28px 80px}
  .day{grid-template-columns:1fr;gap:4px}
  h2{font-size:27px}
  .qtext{font-size:17px}
  .fc .term{font-size:24px}
  .brand .count{order:3;flex-basis:100%;margin-top:-6px}
  nav.tabs{gap:18px}
  .mrow{grid-template-columns:1fr;gap:6px}
  .mgrid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr;gap:8px;padding:14px 16px}
  .flabel{padding-top:0}
  .setup-head,.setup-foot{padding-inline:16px}
  nav.tabs{gap:20px}
  .hrow,a.hlink{grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px}
  .hrow>.tnum:first-child{grid-column:1/-1}
  .hrow>.bar{display:none}
  .hrow>.tnum:last-child{grid-column:1/-1}
  .hist>div{grid-template-columns:90px minmax(40px,1fr) 40px}
  .hist>div>span:last-child{display:none}
}

// "Think like a manager" items: every option is defensible; one is BEST.
// [domain, question, [BEST, RUNNER-UP, other, other], why BEST, why not the runner-up]
const MANAGER = [
// ---------- D1 ----------
[1,"A new regulation requires protecting customer financial data. What should the security manager do FIRST?",["Determine which data, systems and processes are in scope and assess gaps","Encrypt every customer database immediately","Buy a data loss prevention tool","Launch awareness training on the new regulation"],"You can't protect what you haven't scoped. A gap analysis drives everything else.","Encrypting right away acts before knowing where the data is or what the regulation actually requires."],
[1,"Senior management declines to fund a control for a risk you rated as high. What should you do?",["Make sure the risk and management's decision to accept it are formally documented","Implement the control anyway using existing budget","Report the decision to the regulator","Escalate to the board without telling management"],"Management owns risk. Your job is to make sure they decided with full information and that it's recorded.","Implementing it anyway overrides a business decision that isn't yours to make."],
[1,"What should be done FIRST in a risk assessment?",["Identify and value the assets","Identify threats and vulnerabilities","Calculate annualized loss expectancy","Select countermeasures"],"Asset value determines what's worth protecting and feeds every later calculation.","Threats only matter relative to the assets they affect, so assets come first."],
[1,"What is the BEST way to ensure a new security program succeeds?",["Get visible senior management sponsorship tied to business goals","Run an organization-wide awareness campaign","Enforce strict penalties for violations","Deploy the strongest available technical controls"],"Without executive support, funding, authority and adoption all fail.","Awareness matters, but it can't make up for a lack of authority and funding."],
[1,"You discover your employer is knowingly shipping a product with a flaw that endangers users. What is the BEST action?",["Raise it through internal channels and, if it isn't addressed, report to the appropriate authority","Post the details publicly right away","Stay silent because your duty is to your employer","Quietly fix the code without telling anyone"],"Canon 1 (protect society) outranks duty to your employer, but you still act responsibly through proper channels first.","Going public immediately skips responsible handling and could make the harm worse."],
[1,"What is the MOST important factor when deciding whether to implement a safeguard?",["Its cost compared with the risk reduction it provides","How strong the control is technically","The vendor's reputation","How easy it is to deploy"],"A control is justified when its value (reduced ALE minus its cost) is positive.","A very strong control can still cost more than the loss it prevents."],
[1,"A vendor will process your customers' sensitive data. What should happen FIRST?",["Perform due diligence on the vendor's security before signing","Add a right-to-audit clause to the contract","Encrypt the data before sending it","Request the vendor's SOC 3 report after go-live"],"Assess before you commit. The assessment tells you what contract terms and controls you'll need.","Contract clauses come after you know the risks they need to address."],
[1,"What is the PRIMARY purpose of a security policy?",["Communicate management's intent and direction for protecting assets","Specify technical configuration settings","List the step-by-step tasks for administrators","Satisfy external auditors"],"Policies are high-level statements of intent; standards, baselines and procedures implement them.","Configuration settings belong in standards and baselines, not policy."],
// ---------- D2 ----------
[2,"What is the MOST important factor when classifying data?",["Its value and sensitivity to the organization","Who created it","Where it is stored","How much it costs to store"],"Classification reflects the impact if the data is disclosed, altered or lost.","The creator doesn't determine the data's value or sensitivity."],
[2,"Who should decide how long a type of business record is retained?",["The data owner, based on legal and business requirements","The data custodian","The security administrator","The records' end users"],"Owners are accountable for their data, including its retention.","Custodians carry out the retention policy; they don't set it."],
[2,"Which control BEST protects sensitive data on laptops that might be lost or stolen?",["Full disk encryption","Strong login passwords","Cable locks","BIOS passwords"],"FDE keeps data unreadable even if the drive is removed.","A login password is bypassed by pulling the drive or booting another OS."],
[2,"Old backup tapes containing customer data are due for disposal. What should happen FIRST?",["Confirm the retention period has ended and no legal hold applies","Degauss the tapes","Shred the tapes","Send them to offsite storage"],"Destroying records under legal hold or before retention ends can be a legal violation.","Degaussing is a valid method, but it's the second step, after confirming you're allowed to destroy them."],
[2,"What is the PRIMARY purpose of labeling data and media?",["To tell people and systems how to handle it according to its classification","To make the data easier to find","To track its storage cost","To meet backup requirements"],"Labels connect classification to handling rules.","Searchability is a side benefit, not the purpose."],
[2,"A department wants to use production customer data to test a new application. What is the BEST approach?",["Use masked or synthetic data in the test environment","Copy production data with stricter access controls in test","Use production data but delete it after testing","Let developers test directly in production"],"Masking or synthetic data removes the exposure entirely.","Stricter controls on a copy still leave real customer data sitting in a less-protected environment."],
// ---------- D3 ----------
[3,"When should security first be considered for a new system?",["At initiation, when requirements are defined","During detailed design","During testing","Just before deployment"],"Security requirements shape the design, and fixing things later costs much more.","By design time, the requirements that drive the design should already include security."],
[3,"Two companies need to exchange email that the recipient can prove was sent by the sender. What is the BEST solution?",["S/MIME signing with certificates from a trusted CA","TLS between the two mail servers","Encrypting messages with a shared AES key","An HMAC with a shared secret"],"Digital signatures with certificates provide origin authentication and non-repudiation.","TLS protects the connection between servers, not the message itself, and doesn't prove who wrote it."],
[3,"What is the BEST way to protect the master keys for a high-volume payment system?",["Store and use them inside a hardware security module","Store them in the server's TPM","Keep them in an encrypted file on the server","Give a copy to a key escrow agent"],"An HSM is built for tamper-resistant key storage and high-volume crypto, with FIPS 140 validation.","A TPM protects one device's own secrets; it isn't designed for shared, high-volume key management."],
[3,"A firewall crashes and starts allowing all traffic. Which principle was violated?",["Fail securely","Defense in depth","Least privilege","Separation of duties"],"A failure should default to a secure state (deny).","Defense in depth might limit the damage, but the defect is how the device itself failed."],
[3,"You need to confirm a downloaded installer hasn't been tampered with AND came from the vendor. What is the BEST method?",["Verify the vendor's digital signature on the file","Compare its SHA-256 hash with the one posted on the same download page","Scan it with antivirus","Check the file size"],"A signature proves both integrity and origin.","An attacker who can swap the file on that site can swap the posted hash too."],
[3,"Which is the MOST important consideration when choosing fire suppression for a staffed data center?",["Safety of the people in the room","Protecting the equipment from water damage","Cost of the system","Speed of discharge"],"Human life always comes first.","Equipment protection matters, but never ahead of safety."],
// ---------- D4 ----------
[4,"Remote employees need access to a few internal web apps. What is the BEST long-term approach?",["Zero trust network access granting per-app access based on identity and device health","A full-tunnel VPN to the corporate network","Publishing the apps directly to the internet behind a firewall","An SSH jump host"],"ZTNA gives least-privilege access to specific apps, not the whole network.","A VPN works but usually grants broad network access once connected."],
[4,"You see large volumes of long DNS TXT queries to an unfamiliar domain. What is MOST likely?",["Data exfiltration through DNS tunneling","A misconfigured DNS resolver","Normal content delivery network traffic","A DNSSEC validation failure"],"Large, encoded TXT queries to one odd domain are a classic tunneling sign.","Misconfiguration doesn't usually produce sustained large TXT payloads to a single unknown domain."],
[4,"What is the BEST way to keep guest Wi-Fi users away from corporate systems?",["Put guests on a separate network segment with firewall rules isolating them","Use WPA3 on the guest network","Hide the guest network's SSID","Use MAC address filtering"],"Segmentation stops guests reaching internal systems, whatever encryption they use.","WPA3 protects guests' traffic over the air but doesn't stop them reaching the corporate network."],
[4,"Only company-issued devices should be able to connect to wired network ports. What is the BEST control?",["802.1X with certificate-based device authentication","Port security limiting MAC addresses","Disabling DHCP","Assigning each department its own VLAN"],"Certificates prove a device is company-managed.","MAC addresses are easy to spoof."],
[4,"Where is it BEST to place a public-facing web server?",["In a screened subnet (DMZ) behind a WAF","On the internal LAN with port forwarding","Directly on the internet with a host firewall","On the same segment as the database server"],"The DMZ limits what an attacker can reach if the server is compromised.","Port forwarding to the internal LAN puts a compromised server right next to internal systems."],
[4,"VoIP calls must be protected from eavesdropping. What is the BEST control?",["SRTP for the voice stream with TLS-protected SIP signaling","A dedicated voice VLAN","Disabling call recording","Using UDP instead of TCP"],"Encryption protects the content of the call itself.","A voice VLAN separates traffic but doesn't encrypt it."],
// ---------- D5 ----------
[5,"An employee transfers to a new department. Which access action is MOST important?",["Remove access that the new role doesn't need","Grant access for the new department","Reset the user's password","Disable the account until HR confirms"],"Failing to remove old access is how privilege creep happens.","Granting new access matters for productivity, but removing old access is the security priority."],
[5,"What BEST reduces the risk from administrator accounts?",["Privileged access management with just-in-time elevation and session monitoring","Requiring longer admin passwords","One shared, well-protected admin account","An annual review of admin group membership"],"Admin rights exist only when needed, and every session is recorded.","Longer passwords help, but standing privileges stay exposed around the clock."],
[5,"Users are writing down passwords because they have too many. What is the BEST solution?",["Single sign-on with MFA","More password-complexity training","Longer password expiration periods","Disciplinary action for writing down passwords"],"Fewer credentials removes the root cause, and MFA strengthens the one that remains.","Training doesn't fix the underlying problem of too many passwords."],
[5,"A contractor's project ended last week, but their account still works. What does this MOST indicate?",["A failure in the deprovisioning process","A weak password policy","Missing MFA","Insufficient logging"],"Accounts should be disabled as soon as the engagement ends.","The password policy has nothing to do with an account that should no longer exist."],
[5,"Which access model BEST supports least privilege in a large organization with frequent job changes?",["Role-based access control","Discretionary access control","Mandatory access control","Rule-based access control"],"Moving a user between roles changes their access consistently.","DAC leaves access to individual owners, which drifts and is hard to manage at scale."],
[5,"A high-security data center door uses biometrics. Which metric matters MOST?",["A low false acceptance rate","A low false rejection rate","Fast enrollment","Low cost per reader"],"For high security, letting an impostor in is the critical failure.","A low FRR improves convenience, not security."],
// ---------- D6 ----------
[6,"Mid-test, a pen tester finds a critical flaw being actively exploited in production. What should they do FIRST?",["Stop and notify the designated contact as the rules of engagement specify","Finish testing and include it in the report","Exploit it further to show the impact","Patch it themselves"],"An active compromise is an incident; the ROE's emergency contact path applies.","Waiting for the report leaves an active attack running."],
[6,"Which gives the MOST objective assessment of an organization's controls?",["An independent third-party audit","The internal audit team","A self-assessment by control owners","A review by the vendor that supplied the controls"],"Independence gives the most objectivity.","Internal audit is fairly independent but still part of the organization."],
[6,"Management asks whether the security program is effective. What is the BEST evidence?",["Metrics tied to business objectives and tracked over time","The number of controls deployed","The size of the security budget","A list of tools purchased"],"Effectiveness means outcomes, measured against goals.","Counting controls measures activity, not effectiveness."],
[6,"A vulnerability scan returns 400 findings. What should you do FIRST?",["Prioritize by risk: exploitability, asset criticality and exposure","Patch everything with the highest CVSS score first","Patch all 400","Re-run the scan to confirm"],"Risk-based prioritization (including CISA KEV and EPSS) fixes what matters most first.","CVSS alone ignores whether the asset is critical or the flaw is actually being exploited."],
[6,"Which testing finds security flaws EARLIEST in development?",["Static analysis and code review during coding","Dynamic testing of the running application","Penetration testing before release","User acceptance testing"],"SAST and code review work before the app even runs.","DAST needs a running build, which comes later."],
// ---------- D7 ----------
[7,"Ransomware is detected on a file server. What should you do FIRST?",["Isolate the server from the network","Restore it from backup","Pay the ransom to recover the data","Wipe and rebuild the server"],"Containment stops it spreading. Restore only after you understand the scope.","Restoring before containing risks reinfection and destroys evidence."],
[7,"You suspect an attacker is active on a server. What is the BEST action to preserve evidence?",["Disconnect it from the network but keep it powered on and capture memory","Shut it down immediately","Reboot it into safe mode","Run antivirus to remove the malware"],"Volatile evidence in RAM is lost when the machine powers off.","Shutting down stops the attack but wipes memory evidence."],
[7,"Who should declare a disaster and activate the DR plan?",["The person given that authority in the plan","The first IT staff member on site","Any manager who is available","The cloud provider"],"Activation authority is defined in advance to avoid confusion and delay.","First responders assess the situation but usually lack the authority to activate the plan."],
[7,"What is the MOST important part of a backup strategy?",["Regularly testing that restores actually work","Keeping copies off-site","Taking full backups every day","Encrypting the backups"],"An untested backup may not restore when you need it.","Off-site copies are essential, but worthless if they can't be restored."],
[7,"An outage requires an urgent fix outside the normal change window. What is the BEST approach?",["Use the emergency change procedure, then document and review it afterward","Wait for the next CAB meeting","Make the change and skip the paperwork","Have the vendor make the change"],"Emergency changes still follow a defined, documented process.","Waiting for the CAB prolongs the outage when an emergency process already exists."],
[7,"An administrator has been editing logs to hide mistakes. Which control would BEST have prevented this?",["Sending logs to a central, write-once system that admins can't modify","Reviewing logs more often","Requiring admins to sign an acceptable use policy","Mandatory vacation"],"Separating log control from the people being logged stops the tampering.","Reviews are detective; they only work if the logs haven't already been altered."],
[7,"What is the MOST important factor in choosing an alternate processing site?",["It is far enough away not to be hit by the same disaster","It is close enough for staff to commute easily","It is the cheapest option","It uses the same internet provider"],"A site taken out by the same regional event is useless.","Convenience matters less than surviving the same disaster."],
[7,"After an incident is resolved, what is the MOST valuable next step?",["Hold a lessons-learned review and update controls and the IR plan","Close the ticket and move on","Discipline the staff involved","Buy a new security tool"],"Improvement is the point of the post-incident phase.","Closing the ticket loses the chance to stop it happening again."],
// ---------- D8 ----------
[8,"A development team wants to skip security testing to meet a deadline. What is the BEST response?",["Explain the risk to the business owner and let them formally accept or delay","Block the release","Allow it quietly and test afterward","Escalate to HR"],"Risk decisions belong to the business owner, made with full information.","Blocking the release takes a business decision that belongs to the owner."],
[8,"What MOST effectively reduces vulnerabilities in custom software?",["Building security into every SDLC phase, starting with requirements","A penetration test before each release","A web application firewall","A bug bounty program"],"Preventing flaws early beats finding them later.","Pen tests find flaws late and only take a sample."],
[8,"Developers have write access to production systems. Which principle is MOST directly violated?",["Separation of duties","Least privilege","Defense in depth","Need-to-know"],"Development and production duties should be separated so no one can push unreviewed changes.","Least privilege also applies, but CISSP frames dev vs prod as separation of duties."],
[8,"What is the MOST important security step before buying COTS software?",["Assess the vendor's security practices and product risk (support, SBOM, certifications)","Negotiate the lowest price","Check that it has the features users want","Make sure it runs on current hardware"],"Due diligence on acquired software is part of supply chain risk management.","Features drive the purchase, but security has to be assessed before you commit."],
[8,"What BEST ensures the code running in production is exactly the code that was reviewed and approved?",["Code signing combined with controlled release management","Peer code review","Static analysis","Unit testing"],"Signing proves the artifact hasn't changed since approval.","Code review checks the code but doesn't prove that same code is what got deployed."],
[8,"A partner API is being scraped heavily. What is the BEST control?",["Authenticate each partner and apply per-client rate limits","Add WAF signatures","Change the API URL","Return generic error messages"],"Knowing who's calling and limiting how much they can call addresses the abuse directly.","WAF signatures catch attacks, not legitimate-looking but excessive requests."],
];
