ntire employment lifecycle — from background checks and NDAs during hiring to exit interviews and immediate access revocation during termination."}, {"t": "Security Awareness, Education, and Training", "d": "A comprehensive security program includes three levels: Awareness (all employees, behavioral), Training (role-specific technical skills), and Education (in-depth understanding for security professionals)."}, {"t": "Intellectual Property: Copyright, Patent, Trademark, Trade Secret", "d": "Four types of intellectual property protection exist: Copyright (creative works, automatic, life+70 years), Patent (inventions, 20 years), Trademark (brand identity, renewable indefinitely), and Trade Secret (proprietary processes, no expiration if kept secret)."}, {"t": "Privacy Legislation: GDPR, HIPAA, GLBA, and Global Privacy Laws", "d": "Major privacy laws define how personal data must be collected, processed, stored, and destroyed. GDPR (EU), HIPAA (US healthcare), GLBA (US finance), and various national laws each have distinct requirements and penalties."}, {"t": "Risk Frameworks: NIST RMF, ISO 31000, and COSO ERM", "d": "Risk management frameworks provide structured approaches. NIST RMF (6 steps for federal systems), ISO 31000 (universal risk management principles), and COSO ERM (enterprise risk management integrated with strategy)."}, {"t": "Security Control Categories, Types, and Functions", "d": "Controls are categorized by implementation (Technical/Administrative/Physical) and by function (Preventive, Detective, Corrective, Deterrent, Compensating, Recovery, Directive). Understanding the matrix is essential for CISSP."}, {"t": "Compliance, Audit, and Regulatory Requirements", "d": "Compliance ensures adherence to laws, regulations, and standards. Internal/external audits verify compliance. Key frameworks include PCI-DSS, SOX, FISMA, and industry-specific regulations."}, {"t": "Security Control Frameworks: NIST SP 800-53 and ISO 27001", "d": "NIST SP 800-53 provides a catalog of security and privacy controls organized by family. ISO 27001 defines ISMS requirements. Together they form the basis for implementing comprehensive security programs."}, {"t": "Acquisitions, Mergers, and Divestitures", "d": "Security must be integrated into M&A activities. Due diligence includes security assessments of target companies. Data handling, system integration, and access control changes present significant risks during organizational transitions."}, {"t": "Import/Export Controls and Transborder Data Flow", "d": "Cryptographic products and technologies are subject to export controls (EAR, ITAR, Wassenaar Arrangement). Cross-border data transfers must comply with privacy laws and international agreements."}, {"t": "Evidence Types and Legal Investigation", "d": "Four types of evidence: Real (physical objects), Documentary (documents/logs), Testimonial (witness statements), and Demonstrative (models/simulations). Evidence must be relevant, reliable, and legally obtained."}, {"t": "Computer Crime Laws and Cybercrime", "d": "Key US computer crime laws include CFAA, ECPA, and the Identity Theft Enforcement Act. International frameworks include the Budapest Convention. Understanding jurisdiction and evidence collection is critical."}, {"t": "Professional Ethics and Organizational Ethics", "d": "Beyond the ISC2 Code of Ethics, organizations must establish ethical frameworks including codes of conduct, ethics committees, whistleblower protections, and conflict of interest policies."}, {"t": "Change Management and Configuration Management", "d": "Change management ensures modifications to systems follow a controlled process: request, review, approve, implement, verify, document. Configuration management maintains known-good system states through baselines and inventories."}, {"t": "Quantitative Risk Analysis Deep Dive", "d": "Advanced quantitative techniques include Monte Carlo simulation, decision tree analysis, sensitivity analysis, and Bayesian analysis. These methods provide more nuanced risk assessments beyond basic SLE/ALE calculations."}, {"t": "Types of Law: Criminal, Civil, Administrative, and Common vs. Civil Law Systems", "d": "Understanding the distinctions between criminal law (imprisonment), civil/tort law (monetary damages), and administrative/regulatory law (government regulations), plus the difference between common law and civil law legal systems."}, {"t": "Security Policies: Types and Development", "d": "Organizations need multiple policy types: Organizational (strategic), Issue-specific (topic-focused like AUP), and System-specific (platform-focused). Policies must be management-approved, enforceable, and regularly reviewed."}, {"t": "Risk Assessment Methodologies: Qualitative Approaches", "d": "Qualitative risk analysis uses subjective ratings (High/Medium/Low) through techniques like Delphi method, brainstorming, interviews, and risk matrices. Faster than quantitative but less precise."}, {"t": "Business Impact Analysis (BIA) Deep Dive", "d": "The BIA is the most critical phase of BCP. It identifies critical business functions, determines maximum tolerable downtime (MTD), and establishes recovery priorities. BIA drives all subsequent BCP/DR decisions."}, {"t": "Disaster Recovery Site Types and Strategies", "d": "DR site types range from hot (immediate failover) to cold (weeks to activate). Additional options include mobile sites, cloud DR, and reciprocal agreements. Site selection depends on RTO, cost, and risk tolerance."}, {"t": "Third-Party Risk Management and Vendor Assessment", "d": "Organizations must assess and manage risks from third-party relationships through due diligence, contractual controls, ongoing monitoring, and exit strategies. SOC reports, right-to-audit, and SLAs are key tools."}, {"t": "Privacy Principles and Data Protection Concepts", "d": "Privacy principles including purpose limitation, data minimization, consent, transparency, and individual rights form the foundation of modern privacy law. The OECD Guidelines and GAPP provide universal frameworks."}, {"t": "Security Governance Structures and Roles", "d": "Effective security governance requires clear organizational structures: Board of Directors (oversight), CEO (ultimate accountability), CISO (security strategy), security committee (cross-functional coordination), and defined roles at every level."}, {"t": "Standards, Baselines, Guidelines, and Procedures", "d": "Below policies in the hierarchy: Standards (mandatory specific requirements), Baselines (minimum security configurations), Guidelines (optional recommendations), and Procedures (step-by-step instructions). Each serves a distinct purpose."}, {"t": "Threat Intelligence and Information Sharing", "d": "Threat intelligence involves collecting, analyzing, and sharing information about current and emerging threats. Sources include OSINT, ISACs, STIX/TAXII, and commercial feeds. Intelligence must be timely, relevant, and actionable."}, {"t": "Business Continuity Plan Testing and Maintenance", "d": "BCP/DR plans must be regularly tested using increasingly disruptive methods: checklist review, tabletop exercise, walkthrough, simulation, parallel test, and full interruption test. Plans also require regular maintenance and updates."}, {"t": "Risk Appetite, Tolerance, and Capacity", "d": "Risk appetite is the level of risk an organization is willing to accept in pursuit of objectives. Risk tolerance is the acceptable variation around appetite. Risk capacity is the maximum risk an organization can absorb."}, {"t": "Security Planning Horizons and Strategy", "d": "Security planning operates at three horizons: Strategic (3-5 years), Tactical (6-12 months), and Operational (days to weeks). Each level translates security vision into actionable implementation."}, {"t": "Data Breach Notification Requirements", "d": "Data breach notification laws require organizations to notify affected individuals, regulators, and sometimes media within specified timeframes. Requirements vary by jurisdiction: GDPR (72 hours), HIPAA (60 days), US state laws (varies)."}, {"t": "Defense in Depth and Layered Security", "d": "Defense in depth uses multiple layers of security controls so that if one layer fails, others continue to protect. Layers span physical, technical, and administrative controls across the entire environment."}, {"t": "Security Assessment and Authorization (SA&A)", "d": "The formal process of evaluating security controls and granting authorization to operate (ATO). Replaces the older Certification and Accreditation (C&A) terminology. Follows NIST SP 800-37 RMF."}, {"t": "Contractual, Legal, and Regulatory Obligations", "d": "Security professionals must understand how contracts, laws, and regulations create binding obligations. Key concepts include liability, due care, negligence, contractual security requirements, and regulatory penalties."}, {"t": "Continuous Improvement and Security Program Maturity", "d": "Security programs must continuously improve using maturity models (CMM/CMMI), metrics, KPIs, and regular assessments. The goal is progressing from ad-hoc to optimized security operations."}, {"t": "Risk Response and Control Selection", "d": "After identifying risks, organizations must select appropriate responses and controls. The cost of a control should never exceed the value of the asset it protects. Control selection considers effectiveness, cost, operational impact, and regulatory requirements."}, {"t": "Licensing and Software Intellectual Property", "d": "Software licensing defines legal usage rights. Types include proprietary, open source (GPL, MIT, Apache, BSD), per-seat, site, enterprise, and SaaS subscriptions. Piracy and non-compliance carry legal and security risks."}, {"t": "Investigations: Administrative, Civil, Criminal, and Regulatory", "d": "Different investigation types have different objectives, authorities, evidence standards, and outcomes. Understanding these distinctions is critical for incident response and forensic decisions."}, {"t": "Separation of Duties, Least Privilege, and Need-to-Know", "d": "Three foundational access control principles: Separation of Duties (SoD) prevents fraud by requiring multiple people. Least Privilege grants minimum necessary access. Need-to-Know restricts access even within clearance level."}, {"t": "Security Control Frameworks Comparison", "d": "Comparing NIST CSF, ISO 27001/27002, COBIT, CIS Controls, and NIST SP 800-53 for organizational security governance and control selection."}, {"t": "Ethics, Professional Conduct, and Legal Compliance", "d": "ISC2 Code of Ethics, professional ethical obligations, conflicts of interest, whistleblowing, and the intersection of ethics with legal compliance."}, {"t": "Supply Chain Risk Management (SCRM)", "d": "Managing security risks throughout the supply chain including vendor assessment, third-party risk, SLA requirements, and supply chain attack prevention."}, {"t": "Business Impact Analysis Deep Dive", "d": "Conducting BIA including identifying critical business functions, determining MTD/RTO/RPO, resource dependencies, and impact categories."}, {"t": "Threat Modeling Frameworks", "d": "Systematic approaches to identifying and prioritizing threats including STRIDE, PASTA, DREAD, OCTAVE, VAST, and attack trees."}, {"t": "Security Awareness, Education, and Training Programs", "d": "Building effective security awareness programs including program design, content development, delivery methods, measurement, and continuous improvement."}, {"t": "Incident Management and Response Planning", "d": "Developing incident response plans, establishing incident classification, and integrating with business continuity for comprehensive organizational resilience."}, {"t": "Regulatory and Legal Environment", "d": "Understanding the legal and regulatory landscape affecting information security including jurisdictional issues, data breach laws, and compliance requirements."}, {"t": "Risk Management Methodologies", "d": "Comparing risk assessment approaches including NIST, ISO, FAIR, OCTAVE, and integrating risk management into organizational decision-making."}, {"t": "Security Governance Structures", "d": "Organizational structures for security governance including CISO reporting, security committees, roles and responsibilities, and executive accountability."}, {"t": "Continuity of Operations Planning (COOP)", "d": "Ensuring critical government and organizational functions continue during disruptions including succession planning, alternate sites, and devolution."}, {"t": "Maximum Tolerable Downtime and Recovery Metrics Deep Dive", "d": "MTD, RTO, RPO, WRT, and MTPD form a hierarchy of recovery metrics that drive BCP strategy. Understanding the relationships between these metrics is essential for the exam."}, {"t": "ISC2 Code of Professional Ethics", "d": "The ISC2 Code of Ethics has a preamble and four mandatory canons prioritized in order. Canon 1 (protect society) always takes precedence. Violations can result in revocation of certification."}, {"t": "Asset Valuation Methods", "d": "Determining asset value is foundational to risk analysis. Methods include replacement cost, revenue generation, book value, and impact analysis. Tangible and intangible assets require different approaches."}, {"t": "Security Awareness Program Design and Measurement", "d": "Effective security awareness programs target all employees with role-appropriate content, use varied delivery methods, and measure effectiveness through metrics like phishing click rates and incident reporting."}, {"t": "Organizational Roles in Security", "d": "Key security roles include the Board of Directors (ultimate governance), CEO (overall responsibility), CISO (security program), Data Owner (classification), Data Custodian (day-to-day), and Data Processor (handles data for controller)."}, {"t": "Criminal, Civil, and Administrative Law", "d": "Understanding the three branches of law, burden of proof standards, and how they apply to information security incidents is critical for CISSP."}, {"t": "Privacy Principles: OECD, GAPP, and Fair Information Practices", "d": "Foundational privacy frameworks including the OECD Privacy Guidelines (8 principles), GAPP (10 principles), and FIPs establish the basis for most privacy legislation worldwide."}, {"t": "Export Controls: EAR, ITAR, and Wassenaar Arrangement", "d": "Encryption technology is subject to export controls. EAR covers commercial/dual-use items, ITAR covers military/defense items, and the Wassenaar Arrangement coordinates export controls internationally."}, {"t": "Governance, Risk, and Compliance (GRC) Integration", "d": "GRC integrates governance (direction and oversight), risk management (identifying and treating threats), and compliance (meeting requirements) into a unified program that aligns security with business objectives."}, {"t": "Security Control Baselines and Tailoring", "d": "Control baselines provide a starting set of security controls based on system categorization. Tailoring adjusts these baselines to the specific environment through scoping, compensating controls, and supplementation."}, {"t": "Cyber Kill Chain and Attack Frameworks", "d": "The Lockheed Martin Cyber Kill Chain, MITRE ATT&CK, and Diamond Model provide complementary frameworks for understanding, detecting, and disrupting adversary operations."}, {"t": "Social Engineering Attacks and Defenses", "d": "Social engineering exploits human psychology rather than technical vulnerabilities. Attack types include phishing, pretexting, baiting, tailgating, and quid pro quo. Defense relies on awareness training and verification procedures."}, {"t": "Computer Crime Laws: CFAA, ECPA, and International Frameworks", "d": "Key cybercrime laws include CFAA (unauthorized access), ECPA (electronic communications privacy), and the Council of Europe Convention on Cybercrime. Understanding jurisdiction and evidence admissibility is essential."}, {"t": "Data Breach Notification Laws Comparison", "d": "Different jurisdictions have varying breach notification requirements. GDPR requires 72-hour authority notification, HIPAA requires 60-day individual notification, and US state laws vary by jurisdiction."}, {"t": "Risk Appetite Frameworks and Risk Register", "d": "Risk appetite defines how much risk an organization is willing to accept to achieve objectives. Risk registers document identified risks, their assessment, treatment plans, and ownership."}, {"t": "Insurance as Risk Transfer", "d": "Cyber insurance transfers financial risk of security incidents to an insurer. Coverage types include first-party (own losses) and third-party (liability). Understanding policy exclusions and coverage limits is critical."}, {"t": "Regulatory Frameworks: SOX, PCI DSS, FISMA", "d": "SOX protects investors through financial reporting controls, PCI DSS secures payment card data, and FISMA mandates security for federal information systems. Each has specific compliance requirements."}, {"t": "Evidence Collection and Admissibility", "d": "Digital evidence must be collected, preserved, and presented following legal standards. Key concepts include the Best Evidence Rule, chain of custody, hearsay, and the five types of evidence."}, {"t": "Continuous Monitoring and ISCM", "d": "Information Security Continuous Monitoring (ISCM) per NIST SP 800-137 maintains ongoing awareness of security posture through automated data feeds, metrics, and dashboards replacing point-in-time assessments."}, {"t": "Organizational Security Models: NIST CSF and ISO 27001", "d": "NIST CSF provides a risk-based framework with five core functions. ISO 27001 is a certifiable ISMS standard. Understanding both frameworks, their differences, and when to use each is essential."}, {"t": "NIST Risk Management Framework (RMF) Deep Dive", "d": "The NIST RMF provides a structured process for managing security and privacy risk. Six steps: Categorize, Select, Implement, Assess, Authorize, and Monitor. Required for US federal systems."}, {"t": "Negligence, Liability, and Downstream Liability", "d": "Understanding legal liability concepts including negligence, downstream liability, vicarious liability, and safe harbor provisions is critical for security managers making risk decisions."}, {"t": "Personnel Security Lifecycle", "d": "Personnel security spans the entire employment lifecycle: pre-employment screening, onboarding, ongoing monitoring, role changes, and termination. Each phase has specific security controls to mitigate insider threat risk."}, {"t": "Security Program Maturity Models", "d": "Maturity models measure how well an organization's security program is developed and operating. CMM, CMMI, and the NIST CSF implementation tiers help organizations assess their current state and plan improvements."}, {"t": "Personally Identifiable Information Protection", "d": "PII includes any information that can identify a specific individual. Direct identifiers (SSN, name) and quasi-identifiers (ZIP + age + gender) both create risk. Protection strategies must address both types."}, {"t": "Security Metrics and Program Effectiveness", "d": "Measuring security program effectiveness requires meaningful metrics aligned with business objectives. Metrics should demonstrate risk reduction, compliance status, and operational efficiency to justify security investment."}, {"t": "Compliance Considerations: HIPAA, SOX, GLBA", "d": "Key US compliance frameworks affect information security: HIPAA protects health information, SOX protects financial integrity, and GLBA protects financial consumer data. Each has specific security requirements."}, {"t": "Procurement and Vendor Risk Assessment", "d": "Security must be integrated into the procurement process. Vendor risk assessment evaluates the security posture of potential suppliers before contracts are signed. Assessment depth should match the risk level."}, {"t": "Intellectual Property Protection", "d": "Intellectual property (IP) includes trade secrets, patents, copyrights, and trademarks. Each has different legal protections, durations, and requirements. Understanding IP types is essential for security professionals."}, {"t": "Security Governance Frameworks Comparison", "d": "Multiple governance frameworks guide security program management: COBIT, ITIL, NIST CSF, ISO 27001, and TOGAF. Understanding their focus, strengths, and relationships helps organizations choose the right framework."}, {"t": "Ethics and Professional Conduct in Security", "d": "Security professionals face ethical dilemmas involving privacy, disclosure, conflicts of interest, and professional responsibility. ISC2 Code of Ethics, organizational codes, and RFC 1087 provide guidance."}, {"t": "Supply Chain Risk Management", "d": "Supply chain risk management (SCRM) addresses security risks introduced by vendors, suppliers, and service providers throughout the product and service lifecycle."}, {"t": "Security Awareness and Training Programs", "d": "Security awareness programs change user behavior to reduce human-factor security risks. Effective programs combine education (why), training (how), and awareness (ongoing reinforcement) with metrics to measure effectiveness."}, {"t": "Business Impact Assessment Methodology", "d": "The BIA identifies critical business functions and the impact of their disruption. It determines MTD, RTO, RPO, and resource requirements for each function. The BIA is the foundation of BCP/DR planning."}], "review": [{"t": "CIA Triad", "d": "Confidentiality (prevent disclosure), Integrity (prevent modification), Availability (ensure access)"}, {"t": "SLE", "d": "Single Loss Expectancy = AV x EF. Expected monetary loss from one incident."}, {"t": "ALE", "d": "Annualized Loss Expectancy = SLE x ARO. Expected yearly loss from a threat."}, {"t": "Due Care vs Diligence", "d": "Due Care = doing right (Prudent Man). Due Diligence = ongoing activities maintaining due care."}, {"t": "STRIDE", "d": "Microsoft threat classification: Spoofing, Tampering, Repudiation, Info Disclosure, DoS, Elevation."}, {"t": "Risk Treatment", "d": "MAAT: Mitigate (reduce), Accept (absorb), Avoid (eliminate), Transfer (insurance)."}, {"t": "MTD vs RTO vs RPO", "d": "MTD = max downtime. RTO = target recovery time (must be <= MTD). RPO = max data loss."}, {"t": "Policy Hierarchy", "d": "Policy (mandatory) > Standards (mandatory) > Baselines (minimum) > Guidelines (optional) > Procedures (steps)."}, {"t": "Separation of Duties", "d": "Preventive control requiring multiple people for critical tasks. Protects against collusion."}, {"t": "BIA", "d": "Business Impact Analysis — identifies critical functions and recovery priorities. Most important BCP phase."}, {"t": "ISC2 Ethics Canon 1", "d": "Protect society and infrastructure. ALWAYS takes priority over all other canons."}, {"t": "Data Classification (Govt)", "d": "Top Secret (grave) > Secret (serious) > Confidential (damage) > Unclassified (none)."}, {"t": "Personnel Security", "d": "Controls spanning hiring (background checks, NDAs), employment (SoD, least privilege), and termination (access revocation, exit interview)."}, {"t": "Mandatory Vacation", "d": "Detective control — forces someone else into the role, potentially exposing fraud or irregularities."}, {"t": "Job Rotation", "d": "Detective administrative control — rotating personnel through positions detects fraud by a predecessor."}, {"t": "Copyright", "d": "Protects creative works. Automatic upon creation. Lasts life + 70 years (or 95 years for corporate works)."}, {"t": "Patent", "d": "Protects inventions. Must file. Lasts 20 years. Requires public disclosure. Must be novel, useful, non-obvious."}, {"t": "Trademark", "d": "Protects brand identity (logos, names). Renewable indefinitely as long as actively used."}, {"t": "Trade Secret", "d": "Protects proprietary info. No filing. No expiration. Lost permanently if disclosed. Protected by NDAs."}, {"t": "GDPR", "d": "EU privacy law. 72-hour breach notification. Fines up to 4% global revenue. Right to be forgotten. Applies to any org processing EU data."}, {"t": "HIPAA", "d": "US healthcare privacy. PHI protection. Privacy/Security/Breach rules. 60-day notification. Minimum Necessary standard."}, {"t": "GLBA", "d": "Gramm-Leach-Bliley Act. US financial data. Privacy Rule, Safeguards Rule, Pretexting Protection."}, {"t": "NIST RMF Steps", "d": "Categorize, Select, Implement, Assess, Authorize, Monitor — six steps for federal system risk management."}, {"t": "ISO 27001 vs 27002", "d": "27001 = requirements (certifiable). 27002 = implementation guidance (not certifiable)."}, {"t": "Control Categories", "d": "Technical (logical), Administrative (managerial), Physical. \"TAP\" — how controls are implemented."}, {"t": "Control Functions", "d": "Preventive, Detective, Corrective, Deterrent, Compensating, Recovery, Directive — what controls do."}, {"t": "SOC 1 vs SOC 2", "d": "SOC 1 = financial reporting controls. SOC 2 = security/availability/integrity/confidentiality/privacy."}, {"t": "SOC Type I vs Type II", "d": "Type I = design at a point in time. Type II = operating effectiveness over 6-12 months (more rigorous)."}, {"t": "NIST SP 800-53", "d": "Security and privacy control catalog. 20 families, 1000+ controls. Used with FIPS 199 categorization."}, {"t": "Defense in Depth", "d": "Multiple layers of controls — if one fails, others protect. Use complementary (not redundant) controls."}, {"t": "Fail-Secure vs Fail-Open", "d": "Fail-secure = deny on failure (more secure). Fail-open = allow on failure (more available)."}, {"t": "ATO", "d": "Authorization to Operate — senior official (AO) accepts residual risk. Package: SSP + SAR + POA&M."}, {"t": "Negligence Elements", "d": "Duty existed, Duty breached, Breach caused harm, Actual damages resulted — all four required."}, {"t": "Criminal vs Civil Law", "d": "Criminal = beyond reasonable doubt, imprisonment. Civil = preponderance of evidence, monetary damages."}, {"t": "EAR vs ITAR", "d": "EAR = commercial/dual-use exports (BIS). ITAR = military/defense exports (State Dept)."}, {"t": "STIX/TAXII", "d": "STIX = structured threat intelligence format. TAXII = transport protocol for sharing STIX data."}, {"t": "Risk Appetite vs Tolerance vs Capacity", "d": "Appetite = how much risk we want. Tolerance = acceptable variation. Capacity = maximum we can absorb."}, {"t": "CMM Levels", "d": "Initial, Repeatable, Defined, Managed, Optimizing — five maturity levels."}, {"t": "NIST CSF Functions", "d": "Identify, Protect, Detect, Respond, Recover — five core cybersecurity functions."}, {"t": "Best Evidence Rule", "d": "Original documents preferred over copies. Applies to documentary evidence in legal proceedings."}, {"t": "Chain of Custody", "d": "Documents who handled evidence, when, where, what they did. Broken chain = potentially inadmissible."}, {"t": "CFAA", "d": "Computer Fraud and Abuse Act — unauthorized access OR exceeding authorized access. Primary US federal cybercrime law."}, {"t": "ECPA", "d": "Electronic Communications Privacy Act — three titles: Wiretap Act, Stored Communications Act, Pen Register Act."}, {"t": "Privacy by Design", "d": "Seven principles by Cavoukian. Proactive, default privacy, embedded in design. Mandated by GDPR Article 25."}, {"t": "OECD Privacy Guidelines", "d": "Eight principles: Collection Limitation, Data Quality, Purpose Specification, Use Limitation, Security, Openness, Individual Participation, Accountability."}, {"t": "Delphi Technique", "d": "Anonymous expert consensus through multiple rounds. Prevents groupthink. Qualitative risk assessment method."}, {"t": "FAIR Framework", "d": "Factor Analysis of Information Risk. Quantitative. Risk = Loss Event Frequency x Loss Magnitude."}, {"t": "Monte Carlo Simulation", "d": "Runs thousands of randomized scenarios to produce probability distributions. Provides confidence intervals for risk."}, {"t": "GPL License", "d": "Copyleft — derivative works must also be GPL. \"Viral\" license. Contrasts with permissive MIT/Apache/BSD."}, {"t": "WRT", "d": "Work Recovery Time — time to verify/validate restored systems. RTO + WRT must be <= MTD."}, {"t": "TPRM Lifecycle", "d": "Due diligence, Contract, Monitor, Exit — third-party risk management lifecycle."}, {"t": "Residual Risk", "d": "Risk remaining after controls. Must be formally accepted by management. Total Risk - Controls = Residual Risk."}, {"t": "Secondary Risk", "d": "New risk introduced by implementing a control. Must also be assessed and treated."}, {"t": "Need-to-Know", "d": "Restricts access even within clearance level. Clearance gets you in the building, need-to-know gets you in the room."}, {"t": "Two-Person Integrity", "d": "Stricter form of SoD requiring two people present simultaneously for critical operations (two-man rule)."}, {"t": "Privilege Creep", "d": "Accumulation of access over time as roles change. Mitigated by regular access reviews."}, {"t": "BCP Test Types", "d": "Checklist < Tabletop < Simulation < Parallel < Full Interruption — least to most disruptive."}, {"t": "Reciprocal Agreement", "d": "Two orgs share facilities during disasters. Low cost but unreliable — hard to enforce and rarely adequate."}, {"t": "Mirrored Site", "d": "Real-time replica of production. Near-zero RTO/RPO. Most expensive DR option."}, {"t": "Data Breach: GDPR vs HIPAA", "d": "GDPR: 72 hours to authority. HIPAA: 60 days to individuals, 500+ = media. HIPAA safe harbor = encrypted PHI exempt."}, {"t": "NIST CSF 2.0", "d": "Added Govern function. Now 6 functions: Govern, Identify, Protect, Detect, Respond, Recover."}, {"t": "CIS Controls", "d": "Prioritized cybersecurity practices. IG1=essential hygiene, IG2=standard, IG3=advanced."}, {"t": "COBIT", "d": "IT governance framework by ISACA. Aligns IT with business objectives."}, {"t": "SCCs", "d": "Standard Contractual Clauses — GDPR mechanism for cross-border data transfer."}, {"t": "BCRs", "d": "Binding Corporate Rules — internal company rules for GDPR cross-border transfers within a multinational."}, {"t": "SCRM", "d": "Supply Chain Risk Management — vendor assessment, SLAs, right-to-audit, fourth-party risk."}, {"t": "Vendor Tiering", "d": "Tier 1=critical (most scrutiny), Tier 2=important, Tier 3=minor. Assessment rigor matches tier."}, {"t": "Fourth-Party Risk", "d": "Risk from your vendor's vendors. Your security = weakest link in supply chain."}, {"t": "SecurityScorecard/BitSight", "d": "Continuous vendor risk monitoring. External security rating services."}, {"t": "BIA Metrics Hierarchy", "d": "MTD ≥ RTO + WRT. RPO drives backup frequency. RTO drives site type."}, {"t": "Safety First", "d": "In any disaster scenario, human life is ALWAYS the first priority. Then data/systems."}, {"t": "Reciprocal Agreement", "d": "Two orgs share DR facilities. Low cost but unreliable and rarely adequate."}, {"t": "ISC2 Canon Priority", "d": "1=Society, 2=Honor, 3=Service, 4=Profession. Society always wins in conflicts."}, {"t": "Negligence Test", "d": "Duty existed + Duty breached + Caused harm + Actual damages = all four required."}, {"t": "PDCA", "d": "Plan-Do-Check-Act — continuous improvement cycle used in ISO 27001."}, {"t": "Kill Chain", "d": "Lockheed Martin: Recon → Weaponize → Deliver → Exploit → Install → C2 → Actions. Break any link."}, {"t": "MITRE ATT&CK", "d": "Comprehensive matrix of adversary tactics, techniques, procedures (TTPs). Detection gap analysis."}, {"t": "PASTA", "d": "Process for Attack Simulation and Threat Analysis — 7-stage risk-centric threat modeling."}, {"t": "OCTAVE", "d": "CMU threat model — organizational focus. Workshop-based risk assessment."}, {"t": "Attack Tree", "d": "Model threats as tree — root is goal, branches are paths. Each path has cost/difficulty/likelihood."}, {"t": "Awareness vs Training", "d": "Awareness = all employees (broad). Training = specific roles (skills). Education = professionals (deep)."}, {"t": "Phishing Simulation", "d": "Most effective awareness measurement tool. Track click rates over time."}, {"t": "IR Phases", "d": "NIST 800-61: Prepare → Detect/Analyze → Contain/Eradicate/Recover → Post-Incident review."}, {"t": "Containment Strategy", "d": "Short-term = stop the attack. Long-term = prepare for eradication. Preserve evidence BEFORE cleanup."}, {"t": "P1/P2/P3/P4", "d": "Incident severity: P1=critical (all hands), P2=high, P3=medium, P4=low (business hours)."}, {"t": "CCPA/CPRA", "d": "California consumer privacy rights. Right to know, delete, opt-out of sale. Applies to CA residents."}, {"t": "FERPA", "d": "US education records privacy. Parents/students control access to education records."}, {"t": "COPPA", "d": "US children online privacy. Parental consent required for data collection from children under 13."}, {"t": "FISMA", "d": "Federal Information Security Management Act. Mandatory for US federal agencies. Uses NIST standards."}, {"t": "FedRAMP", "d": "Federal Risk and Authorization Management Program. Cloud security authorization for government use."}, {"t": "Transborder Data Flow", "d": "GDPR Ch. 5: data transfers outside EU require SCCs, BCRs, or adequacy decision."}, {"t": "FAIR Components", "d": "Risk = Loss Event Frequency x Loss Magnitude. LEF = Threat Event Frequency x Vulnerability."}], "formulas": ["SLE = AV x EF (Single Loss Expectancy = Asset Value x Exposure Factor)", "ALE = SLE x ARO (Annualized Loss Expectancy = SLE x Annualized Rate of Occurrence)", "CBA = ALE(before) - ALE(after) - Annual Cost of Safeguard", "RTO <= MTD (Recovery Time must not exceed Maximum Tolerable Downtime)", "RPO determines minimum backup frequency (RPO of 1 hour = backup at least hourly)", "Expected Value = Probability x Impact (for each decision tree branch)", "Bayes Theorem: P(A|B) = P(B|A) x P(A) / P(B)", "FAIR: Risk = Loss Event Frequency x Loss Magnitude", "RTO + WRT <= MTD", "RPO determines minimum backup frequency", "Recovery priority is inversely
