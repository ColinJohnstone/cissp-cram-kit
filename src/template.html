<title>CISSP Cram Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with tab rail; single centered column (max 1080px); tools render as cards only where they are interactive objects */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface-2:#e7ebf1; --line:#d3d9e2;
  --ink:#15202e; --ink-2:#4a5667; --ink-3:#6c7889;
  --accent:#0b5d73; --accent-ink:#ffffff; --accent-soft:#d6ebf0;
  --tip:#9a5b00; --tip-soft:#fbefd9;
  --good:#1d7a46; --good-soft:#dcf1e3; --bad:#b3261e; --bad-soft:#f9e0de;
  --mark:#ffe9a8;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --surface-2:#1f2833; --line:#2c3743;
  --ink:#e6ebf1; --ink-2:#aeb8c5; --ink-3:#8793a3;
  --accent:#5cc2db; --accent-ink:#06222a; --accent-soft:#163a45;
  --tip:#f0b45a; --tip-soft:#3a2a12;
  --good:#5fd08d; --good-soft:#143a24; --bad:#ff8a80; --bad-soft:#3d1a18; --mark:#5a4a12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --surface-2:#1f2833; --line:#2c3743;
  --ink:#e6ebf1; --ink-2:#aeb8c5; --ink-3:#8793a3;
  --accent:#5cc2db; --accent-ink:#06222a; --accent-soft:#163a45;
  --tip:#f0b45a; --tip-soft:#3a2a12;
  --good:#5fd08d; --good-soft:#143a24; --bad:#ff8a80; --bad-soft:#3d1a18; --mark:#5a4a12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
b,strong{font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;padding-block:12px 6px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand .count{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.brand .spacer{flex:1}
.search{position:relative;flex:1 1 260px;min-width:0;max-width:420px}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:9px 12px 10px;font-weight:500;font-size:14px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs a .pip{display:inline-block;font-size:10px;font-family:var(--mono);background:var(--tip-soft);color:var(--tip);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
main{padding-block:22px 80px}
h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.015em;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 8px;text-wrap:balance}
h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:600}
.lede{color:var(--ink-2);max-width:68ch;margin:0 0 18px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid2>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .w{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
button.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:500;font-size:13px;flex:0 0 auto}
/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:12px 14px;min-width:0}
.facts dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:500}
ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* plan */
.plan{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .when{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.day .when b{display:block;font-family:var(--display);font-size:15px;color:var(--ink)}
.day.today .when b{color:var(--accent)}
.day.exam .when b{color:var(--tip)}
.day ul{margin:0;padding-left:18px}
/* mastery bars */
.mast{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.low i{background:var(--bad)} .bar.mid i{background:var(--tip)} .bar.hi i{background:var(--good)}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
/* cheat */
.dsec{scroll-margin-top:130px}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dhead .wt{font-family:var(--mono);font-size:13px;color:var(--tip);background:var(--tip-soft);padding:1px 7px;border-radius:5px}
.blk h3{font-size:16px;margin-bottom:6px}
.blk ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.blk li{max-width:80ch}
details.more{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px}
details.more ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--ink-2)}
.mind{background:var(--tip-soft);border:1px solid color-mix(in srgb,var(--tip) 30%,transparent);border-radius:var(--r);padding:16px 18px}
.mind h3{color:var(--tip)}
/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.acr{font-family:var(--mono);font-weight:500;white-space:nowrap;color:var(--accent)}
td .note{color:var(--ink-3);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{font:inherit;font-size:14px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:1 1 220px;min-width:0}
mark{background:var(--mark);color:inherit;border-radius:2px}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;min-width:0}
.pair b{font-family:var(--mono);color:var(--accent);font-weight:500}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:760px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-bottom:10px}
.qtext{font-size:17px;font-weight:500;margin:0 0 14px;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:14px}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.timer{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.timer.warn{background:var(--bad-soft);color:var(--bad)}
.score{font-family:var(--display);font-size:48px;font-weight:800;line-height:1}
.verdict{display:inline-block;font-weight:600;font-size:13px;padding:3px 9px;border-radius:999px}
.verdict.pass{background:var(--good-soft);color:var(--good)} .verdict.fail{background:var(--bad-soft);color:var(--bad)}
.review li{margin-bottom:10px}
/* flashcards */
.flash{perspective:1200px;max-width:640px}
.fc{position:relative;min-height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.fc.flip{transform:rotateY(180deg)}
.fc .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--accent-soft)}
.fc .term{font-family:var(--display);font-size:26px;font-weight:700;text-wrap:balance}
.fc .def{font-size:16px}
.fc .src{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.progress i{transition:none}}
/* global search */
.results{display:flex;flex-direction:column;gap:6px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;min-width:0}
.res .tag{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.empty{padding:28px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r)}
@media (max-width:600px){
  .day{grid-template-columns:1fr;gap:4px}
  h2{font-size:22px}
  .qcard{padding:16px}
  .fc .term{font-size:22px}
  .brand .count{display:none}
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>CISSP Cram Kit</h1>
      <span class="count" id="countdown"></span>
      <span class="spacer"></span>
      <div class="search"><input id="gsearch" type="search" placeholder="Look up anything: OCSP, Biba, HIPAA, 800-88…" aria-label="Search everything"></div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#plan" data-v="plan">Plan</a>
      <a href="#cheat" data-v="cheat">Cheat Sheet</a>
      <a href="#acronyms" data-v="acronyms">Acronyms<span class="pip">focus</span></a>
      <a href="#regs" data-v="regs">Laws &amp; Bodies<span class="pip">focus</span></a>
      <a href="#drill" data-v="drill">Drills</a>
      <a href="#quiz" data-v="quiz">Domain Quiz</a>
      <a href="#exam" data-v="exam">Practice Test</a>
      <a href="#cards" data-v="cards">Flashcards</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
