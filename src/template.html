<title>CISSP Cram Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: flat, minimal — plain top bar with text tabs, single 1040px column, hairline dividers instead of boxes; one accent */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f5f7; --line:#e6e8ec; --line-2:#cfd3da;
  --ink:#111418; --ink-2:#4b525c; --ink-3:#7a818c;
  --accent:#2448e0; --accent-ink:#ffffff; --accent-soft:#eef1fd;
  --good:#16794a; --good-soft:#ecf7f1; --bad:#c2312a; --bad-soft:#fcefee;
  --mark:#fff1b8;
  --display:"Chakra Petch","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#111315; --surface-2:#1b1e22; --line:#26292e; --line-2:#3a3f46;
  --ink:#eceef1; --ink-2:#a8afb9; --ink-3:#7c838e;
  --accent:#8aa2ff; --accent-ink:#0b0f1f; --accent-soft:#1a2140;
  --good:#5cc98f; --good-soft:#15261d; --bad:#ff7b72; --bad-soft:#2c1715; --mark:#4d4320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#111315; --surface-2:#1b1e22; --line:#26292e; --line-2:#3a3f46;
  --ink:#eceef1; --ink-2:#a8afb9; --ink-3:#7c838e;
  --accent:#8aa2ff; --accent-ink:#0b0f1f; --accent-soft:#1a2140;
  --good:#5cc98f; --good-soft:#15261d; --bad:#ff7b72; --bad-soft:#2c1715; --mark:#4d4320; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent)}
b,strong{font-weight:600}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;padding-block:14px 6px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.005em;margin:0;display:flex;align-items:baseline;gap:6px;line-height:1.1}
.brand h1 .tagbox{color:var(--accent)}
.brand .count{font-size:13px;color:var(--ink-3);white-space:nowrap}
.brand .spacer{flex:1}
.search{flex:1 1 240px;min-width:0;max-width:380px}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
nav.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:8px 0 10px;font-weight:500;font-size:14px;color:var(--ink-3);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs a .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px;font-size:0}
main{padding-block:40px 100px}
h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 8px;text-wrap:balance}
h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:500}
.lede{color:var(--ink-2);max-width:62ch;margin:0 0 22px;font-size:16.5px}
.stack{display:flex;flex-direction:column;gap:36px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px}
.grid2>*{min-width:0}
.card{background:transparent;border:0;border-top:1px solid var(--line);padding:22px 0 0}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .w{font-size:11px;opacity:.6;margin-left:4px}
button.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 18px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.btn:hover:not(:disabled){opacity:.85}
button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
button.btn.ghost:hover:not(:disabled){border-color:var(--ink);opacity:1}
button.btn:disabled{opacity:.3;cursor:default}
button:focus-visible,.chip:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dnum{display:inline-flex;align-items:center;white-space:nowrap;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-3);flex:0 0 auto}
.dnum::before{content:"D"}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px 24px;margin:0;padding:22px 0;border-block:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-weight:600;font-size:15px}
ol.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ol.rules li::marker{color:var(--ink-3)}
.plan{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0;padding-top:0}
.day .when{font-size:13px;color:var(--ink-3)}
.day .when b{display:block;font-family:var(--display);font-size:16px;color:var(--ink)}
.day.today .when b{color:var(--accent)}
.day.exam .when b{color:var(--bad)}
.day ul{margin:0;padding-left:18px}
.mast{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;font-size:14px}
.bar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink-3)}
.bar.low i{background:var(--bad)} .bar.mid i{background:#c98a00} .bar.hi i{background:var(--good)}
.tnum{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3);white-space:nowrap}
.dsec{scroll-margin-top:120px}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.dhead h3{font-size:24px}
.dhead .wt{font-size:13px;color:var(--ink-3)}
.blk h3{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.blk ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:6px}
.blk li{max-width:80ch}
.blk li::marker{color:var(--ink-3)}
details.more{margin-top:16px}
details.more summary{cursor:pointer;color:var(--accent);font-size:14px}
details.more ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--ink-2)}
.mind{border-top:1px solid var(--line);padding-top:22px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:500;background:var(--bg);position:sticky;top:0}
td.acr{font-family:var(--mono);font-weight:500;white-space:nowrap;color:var(--ink)}
td .note{color:var(--ink-3);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);flex:1 1 220px;min-width:0}
.toolbar input[type=search]:focus{outline:none;border-color:var(--accent);background:var(--bg)}
mark{background:var(--mark);color:inherit;border-radius:2px}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 28px}
.pair{font-size:14px;min-width:0;color:var(--ink-2)}
.pair>div:first-child{color:var(--ink)}
.pair b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.qcard{max-width:720px;padding-top:6px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin-bottom:12px}
.qtext{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 18px;max-width:64ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--line-2);background:var(--surface-2)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:3px;min-width:12px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.picked{border-color:var(--ink);background:var(--surface-2)}
.opt:disabled{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--surface-2);font-size:15px}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.progress{height:2px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .2s}
.timer{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.warn{color:var(--bad)}
.score{font-family:var(--display);font-size:56px;font-weight:700;line-height:1}
.verdict{display:inline-block;font-weight:500;font-size:13px;margin-top:6px}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.review li{margin-bottom:12px}
.opt.multi .box{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink-3);border-radius:3px;vertical-align:-2px}
.opt.multi.picked .box{background:var(--ink);border-color:var(--ink)}
.qtype{color:var(--accent);font-weight:500}
.ordlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:o}
.ordlist li{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;border:1px solid var(--line);border-radius:8px;counter-increment:o}
.ordlist li::before{content:counter(o);font-family:var(--mono);font-size:12px;color:var(--ink-3);min-width:14px}
.ordlist .ordtxt{flex:1;min-width:0}
.ordbtns{display:flex;gap:4px;flex:0 0 auto}
.mv{font:inherit;width:34px;height:34px;border-radius:6px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.mv:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.mv:disabled{opacity:.2;cursor:default}
.ordlist li.right,.mrow.right{background:var(--good-soft);border-color:var(--good)}
.ordlist li.wrong,.mrow.wrong{background:var(--bad-soft);border-color:var(--bad)}
.matchgrid{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;align-items:center;padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:8px}
.mrow .ml{font-weight:500;min-width:0}
.mrow select{font:inherit;font-size:14px;width:100%;min-width:0;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 36px}
.mgrid>*{min-width:0}
.model .mn{font-size:15px;margin:0 0 12px;color:var(--ink-2)}
.model .mn .ml1{color:var(--accent);font-weight:700}
.model .steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.model .steps li::marker{color:var(--ink-3)}
.model .thost .qcard{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px}
table.osi td{font-size:13px}
.flash{perspective:1200px;max-width:620px}
.fc{position:relative;min-height:250px;cursor:pointer;transform-style:preserve-3d;transition:transform .4s}
.fc.flip{transform:rotateY(180deg)}
.fc .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--surface-2)}
.fc .term{font-family:var(--display);font-size:30px;font-weight:700;text-wrap:balance}
.fc .def{font-size:17px;white-space:pre-line}
.fc .src{font-size:12px;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.progress i{transition:none}}
.results{display:flex;flex-direction:column}
.res{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;min-width:0}
.res .tag{font-size:12px;color:var(--ink-3)}
.empty{padding:28px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:10px;font-size:14px}

/* setup dialog */
.smart{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-radius:10px;background:var(--accent-soft);margin:0 0 18px}
.smart>div{flex:1 1 260px;min-width:0}
.srsbar{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--ink-3)}
.srsbar b{color:var(--ink);font-variant-numeric:tabular-nums}
.setupbtn{font:inherit;font-size:13px;color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.setupbtn:hover{color:var(--ink);border-color:var(--line-2)}
.ob{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.obbox{width:min(560px,100%);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:22px;max-height:100%;overflow:auto}
.obbox h2{font-size:28px}
.obstep{font-size:12px;color:var(--ink-3);margin:0 0 6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.field input{font:inherit;font-size:16px;font-weight:400;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);width:100%;max-width:340px}
.field input:focus{outline:none;border-color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:6px;cursor:pointer;font-size:14.5px}
.check:hover{background:var(--surface-2)}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:0 0 auto}
.obnav{border-top:1px solid var(--line);padding-top:18px}
.obdots{display:flex;gap:6px;margin-right:6px}
.obdots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.obdots i.on{background:var(--ink)}
.plink{color:inherit;text-decoration:none;border-bottom:1px solid var(--line-2)}
.plink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.focuspill{font-size:11px;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 6px;margin-left:4px}
.sharebox{font-family:var(--mono);font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);flex:1 1 220px;min-width:0}
@media (max-width:600px){.obbox{padding:20px}.obbox h2{font-size:23px}}
@media (max-width:600px){
  main{padding-block:28px 80px}
  .day{grid-template-columns:1fr;gap:4px}
  h2{font-size:27px}
  .qtext{font-size:17px}
  .fc .term{font-size:24px}
  .brand .count{order:3;flex-basis:100%;margin-top:-6px}
  nav.tabs{gap:18px}
  .mrow{grid-template-columns:1fr;gap:6px}
  .mgrid{grid-template-columns:1fr}
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1><span class="tagbox">CISSP</span>Cram Kit</h1>
      <span class="count" id="countdown"></span><button class="setupbtn" id="setupBtn">Edit setup</button>

  </div>
